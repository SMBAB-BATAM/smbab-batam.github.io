/* ---------- Mengerjakan tugas ---------- */
function bukaKerja(id){ kerjaTugasId = id; renderContent(); window.scrollTo(0,0); }
function tutupKerja(){
  const t = db.tugas.find(x=>x.id===kerjaTugasId);
  const st = t? statusTugasSiswa(t, currentSiswa.id) : {};
  if(st.kode==='mengerjakan' && t.durasi>0 && !confirm('Jawaban Anda tersimpan, tetapi waktu pengerjaan tetap berjalan. Kembali ke daftar tugas?')) return;
  clearInterval(window._kjTimer); simpanJawabanSekarang();
  kerjaTugasId = ''; portalTab = 'tugas'; renderContent(); window.scrollTo(0,0);
}
function batasWaktu(t, p){
  let b = Infinity;
  if(t.durasi>0) b = new Date(p.mulai).getTime() + t.durasi*60000;
  if(t.tenggat && !t.terimaTerlambat) b = Math.min(b, new Date(t.tenggat).getTime());
  return b;
}
function mulaiKerjakan(id){
  const t = db.tugas.find(x=>x.id===id), s = currentSiswa;
  const st = statusTugasSiswa(t, s.id);
  if(st.kode!=='tersedia') return renderContent();
  const ids = t.soal.map(q=>q.id);
  if(t.acak) for(let i=ids.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; }
  db.pengumpulan.push({id:uid(), tugasId:t.id, siswaId:s.id, kelasId:t.kelasId, mulai:nowIso(), jawaban:{}, urutan:ids, status:'mengerjakan'});
  renderContent(); window.scrollTo(0,0); saveToDrive(true);
}
function lsKey(pid){ return 'smb_jwb_'+pid; }
function jawab(soalId, v){
  const t = db.tugas.find(x=>x.id===kerjaTugasId); if(!t) return;
  const p = pengumpulanDari(t.id, currentSiswa.id); if(!p || p.status!=='mengerjakan') return;
  p.jawaban = p.jawaban || {};
  p.jawaban[soalId] = v; p.diubah = nowIso();
  try{ localStorage.setItem(lsKey(p.id), JSON.stringify({jawaban:p.jawaban, diubah:p.diubah})); }catch(e){}
  const li = document.getElementById('kjq-'+soalId); if(li) li.classList.toggle('done', dijawab(v));
  const n = t.soal.filter(q=>dijawab(p.jawaban[q.id])).length;
  const pr = document.getElementById('kjProg'); if(pr) pr.textContent = `${n} dari ${t.soal.length} soal terjawab`;
  const bar = document.getElementById('kjBar'); if(bar) bar.style.width = (n/t.soal.length*100)+'%';
  const sv = document.getElementById('kjSave'); if(sv) sv.textContent = 'Menyimpan…';
  clearTimeout(window._jwbT);
  window._jwbT = setTimeout(simpanJawabanSekarang, 8000);
}
async function simpanJawabanSekarang(){
  clearTimeout(window._jwbT);
  if(!kerjaTugasId) return;
  await saveToDrive(false);
  const sv = document.getElementById('kjSave'); if(sv) sv.textContent = 'Jawaban tersimpan';
}
function konfirmasiKumpulkan(){
  const t = db.tugas.find(x=>x.id===kerjaTugasId), p = pengumpulanDari(t.id, currentSiswa.id);
  const kosong = t.soal.filter(q=>!dijawab((p.jawaban||{})[q.id])).length;
  openModal(`<h3>Kumpulkan jawaban?</h3>
    <p>${kosong? `<strong class="warn-txt">${kosong} soal belum dijawab.</strong> ` : 'Semua soal sudah dijawab. '}Setelah dikumpulkan, jawaban tidak bisa diubah lagi.</p>
    <div class="modal-actions"><button class="btn-outline btn-small" onclick="closeModal()">Periksa lagi</button><button class="btn-sun btn-small" onclick="closeModal(); kumpulkan(false)">Kumpulkan</button></div>`);
}
async function kumpulkan(otomatis){
  clearInterval(window._kjTimer); clearTimeout(window._jwbT);
  const t = db.tugas.find(x=>x.id===kerjaTugasId), p = t && pengumpulanDari(t.id, currentSiswa.id);
  if(!p || p.status!=='mengerjakan') return renderContent();
  if(window._kumpulBusy) return; window._kumpulBusy = true;
  const box = document.getElementById('kjSave'); if(box) box.textContent = 'Mengumpulkan…';
  try{
    const r = await api('kumpulkan', {pid:p.id, jawaban:p.jawaban||{}});   // dinilai di server (kunci jawaban tidak ada di perangkat siswa)
    setTersinkron('pengumpulan', r.pengumpulan); setTersinkron('tugas', r.tugas);
    if(r.version) driveKnownVersion = r.version;
    try{ localStorage.removeItem(lsKey(p.id)); }catch(e){}
    renderContent(); window.scrollTo(0,0);
    toast(otomatis? 'Waktu habis — jawaban dikumpulkan otomatis' : 'Jawaban berhasil dikumpulkan');
  }catch(e){
    toast('Gagal mengumpulkan: '+e.message+'. Jawaban tetap tersimpan, coba lagi.');
    if(box) box.textContent = 'Belum terkumpul — tekan Kumpulkan lagi';
  }finally{ window._kumpulBusy = false; }
}
function startTimerKerja(){
  clearInterval(window._kjTimer);
  window._kjTimer = setInterval(()=>{
    const t = db.tugas.find(x=>x.id===kerjaTugasId);
    const p = t && currentSiswa? pengumpulanDari(t.id, currentSiswa.id) : null;
    if(!t || !p || p.status!=='mengerjakan'){ clearInterval(window._kjTimer); return; }
    const sisa = batasWaktu(t, p) - Date.now();
    if(t.status==='tutup' || sisa<=0){ kumpulkan(true); return; }
    const el = document.getElementById('kjTimer');
    if(el && isFinite(sisa)){ el.querySelector('b').textContent = fmtSisa(sisa); el.classList.toggle('low', sisa<5*60000); }
  }, 1000);
}
function inputSoalSiswa(q, j){
  const nm = 'j_'+q.id;
  if(q.tipe==='pg') return `<div class="kj-opts">${q.opsi.map((o,oi)=> String(o).trim()? `<label class="kj-opt"><input type="radio" name="${nm}" ${String(j)===String(oi)?'checked':''} onchange="jawab('${q.id}', ${oi})"><span class="kj-l">${HURUF[oi]}</span><span>${esc(o)}</span></label>`:'').join('')}</div>`;
  if(q.tipe==='bs') return `<div class="kj-opts kj-bs">${['benar','salah'].map(v=>`<label class="kj-opt"><input type="radio" name="${nm}" ${j===v?'checked':''} onchange="jawab('${q.id}','${v}')"><span>${v==='benar'?'Benar':'Salah'}</span></label>`).join('')}</div>`;
  if(q.tipe==='isian') return `<input class="kj-in" value="${esc(j||'')}" placeholder="Ketik jawaban" oninput="jawab('${q.id}', this.value)" autocomplete="off">`;
  return `<textarea class="kj-in" rows="5" placeholder="Tulis jawaban Anda" oninput="jawab('${q.id}', this.value)">${esc(j||'')}</textarea>`;
}
function screenKerjakan(){
  const t = db.tugas.find(x=>x.id===kerjaTugasId);
  if(!t || t.status==='draf'){ kerjaTugasId=''; return screenSiswaPortal(); }
  const s = currentSiswa, st = statusTugasSiswa(t, s.id), p = st.p;
  const back = `<button class="btn-outline btn-small" onclick="tutupKerja()">← Daftar tugas</button>`;
  const meta = `<div class="kj-meta"><span>${t.soal.length} soal</span>${t.durasi>0? `<span>Durasi ${t.durasi} menit</span>`:''}${t.tenggat? `<span>Tenggat ${fmtDT(t.tenggat)}</span>`:''}</div>`;

  if(st.kode==='mengerjakan'){
    if(batasWaktu(t,p) <= Date.now()){ setTimeout(()=>kumpulkan(true), 0); return `<div class="empty">Waktu habis, mengumpulkan jawaban…</div>`; }
    try{ const b = JSON.parse(localStorage.getItem(lsKey(p.id))||'null'); if(b && (b.diubah||'') > (p.diubah||'')){ p.jawaban = b.jawaban; p.diubah = b.diubah; } }catch(e){}
    const urut = (p.urutan||[]).map(id=>t.soal.find(q=>q.id===id)).filter(Boolean);
    t.soal.forEach(q=>{ if(!urut.includes(q)) urut.push(q); });
    const n = urut.filter(q=>dijawab((p.jawaban||{})[q.id])).length;
    const batas = batasWaktu(t,p);
    setTimeout(startTimerKerja, 0);
    return `<div class="kj-bar">
        <div class="kj-bar-l">${back}<div><strong>${esc(t.judul)}</strong><span id="kjProg">${n} dari ${t.soal.length} soal terjawab</span></div></div>
        ${isFinite(batas)? `<div class="kj-timer ${batas-Date.now()<5*60000?'low':''}" id="kjTimer">Sisa waktu <b>${fmtSisa(batas-Date.now())}</b></div>`:''}
        <div class="kj-prog"><div id="kjBar" style="width:${n/t.soal.length*100}%"></div></div>
      </div>
      ${t.instruksi? `<div class="kj-instr">${teksBr(t.instruksi)}</div>`:''}
      <ol class="kj-list">${urut.map((q,i)=>{ const j=(p.jawaban||{})[q.id]; return `<li class="kj-q ${dijawab(j)?'done':''}" id="kjq-${q.id}">
        <div class="kj-qh"><span>Soal ${i+1}</span><span>${q.poin} poin · ${TIPE_SOAL[q.tipe]}</span></div>
        <div class="kj-teks">${teksBr(q.teks)}</div>${inputSoalSiswa(q, j)}</li>`; }).join('')}</ol>
      <div class="kj-submit"><span class="sd-sub" id="kjSave">Jawaban tersimpan otomatis</span><button class="btn-sun" onclick="konfirmasiKumpulkan()">Kumpulkan jawaban</button></div>`;
  }

  if(p && ['dikumpulkan','dinilai'].includes(p.status)){
    const r = p.total!=null? {skor:p.skor, dapat:p.dapat, total:p.total, perluNilai:p.perluNilai} : hitungSkor(t, p);
    const lihatNilai = t.tampilHasil!=='tidak', lihatKunci = t.tampilHasil==='pembahasan';
    const hasil = !lihatNilai? `<p>Nilai akan disampaikan oleh guru.</p>`
      : p.status==='dikumpulkan'? `<div class="kj-score"><strong>${fmtN(r.skor)}</strong><span>nilai sementara — ${r.perluNilai} soal esai masih diperiksa guru</span></div>`
      : `<div class="kj-score"><strong>${fmtN(p.skor)}</strong><span>${r.dapat} dari ${r.total} poin</span></div>`;
    const rinci = lihatKunci? `<ol class="kj-list">${t.soal.map((q,i)=>{ const j=(p.jawaban||{})[q.id];
        const esai = q.tipe==='esai', m=(p.nilaiManual||{})[q.id], ok = esai? null : poinOtomatis(q,j)>0;
        return `<li class="kj-q ${ok===true?'pk-ok':ok===false?'pk-no':''}"><div class="kj-qh"><span>Soal ${i+1}</span><span>${esai? (m!=null? m+' / '+q.poin+' poin' : 'Diperiksa guru') : (ok? '✓ Benar' : '✗ Salah')}</span></div>
          <div class="kj-teks">${teksBr(q.teks)}</div><div class="pk-a"><span class="sd-sub">Jawaban Anda:</span> ${jawabanTampil(q,j)}</div>
          ${!esai && !ok? `<div class="pk-k"><span>Jawaban benar:</span> ${kunciTampil(q)}</div>`:''}
          ${q.pembahasan? `<div class="kj-pemb">${teksBr(q.pembahasan)}</div>`:''}</li>`; }).join('')}</ol>` : '';
    return `<div class="kj-head">${back}</div>
      <div class="kj-done"><span class="kj-check">✓</span><div><h2>${esc(t.judul)}</h2><p class="sd-sub" style="margin:0">Dikumpulkan ${fmtDT(p.selesai)}${p.terlambat?' (terlambat)':''}</p></div></div>
      ${hasil}${p.komentar? `<div class="kj-instr"><strong>Komentar guru:</strong><br>${teksBr(p.komentar)}</div>`:''}${rinci}`;
  }

  const pesan = {belumBuka:`Tugas ini dibuka pada ${fmtDT(t.mulai)}.`, terlewat:'Tenggat tugas ini sudah lewat.', tutup:'Tugas ini sudah ditutup oleh guru.'}[st.kode];
  return `<div class="kj-head">${back}</div>
    <div class="kj-intro">
      <span class="ts-jenis">${jenisLabel(t.jenis)}</span>
      <h2>${esc(t.judul)}</h2>${meta}
      ${t.instruksi? `<div class="kj-instr">${teksBr(t.instruksi)}</div>`:''}
      ${pesan? `<p class="ed-warn">${pesan}</p>` : `
        ${st.lewat? `<p class="ed-warn">Tenggat sudah lewat. Jawaban tetap diterima tetapi ditandai terlambat.</p>`:''}
        ${t.durasi>0? `<p class="sd-sub">Waktu ${t.durasi} menit mulai berjalan saat Anda menekan tombol di bawah, dan jawaban dikumpulkan otomatis bila waktu habis.</p>`:''}
        <button class="btn-sun" onclick="mulaiKerjakan('${t.id}')">Mulai mengerjakan</button>`}
    </div>`;
}

/* ======================= STATUS ONLINE & CHAT ======================= */
// Butuh file Realtime.gs di Apps Script. Bila server belum diperbarui, fitur ini otomatis tidak tampil.
const RT_INTERVAL = { siswa: 60000, staf: 20000, chat: 8000 };
let rt = { ok:false, checked:false, meId:'', online:{}, lastSeen:null, rev:0, msgs:{}, timer:null, busy:false,
  chatOpen:false, room:'', read:{}, chatCari:'', sending:{}, lastNotif:0 };

function rtMe(){
  if(currentUser) return {id:currentUser.id, nama:currentUser.nama, role:currentUser.role};
  if(currentSiswa) return {id:currentSiswa.id, nama:currentSiswa.namaLengkap, role:'siswa'};
  return null;
}
function rtStaf(){ return db.users.filter(u=>u.role==='admin'||u.role==='guru'); }
function rtOnline(id){ return !!rt.online[id]; }
function rtDot(id){ return `<span class="on-dot ${rtOnline(id)?'on':''}" title="${rtOnline(id)?'Online':'Offline'}"></span>`; }
function dmRoom(a, b){ return 'dm_'+[a,b].sort().join('_'); }
function grupSaya(){ const me=rtMe(); return (db.chatGrup||[]).filter(g=>me && (g.anggota||[]).includes(me.id)); }
function roomsSaya(){
  const me = rtMe(); if(!me || me.role==='siswa') return [];
  return rtStaf().filter(u=>u.id!==me.id).map(u=>dmRoom(me.id,u.id)).concat(grupSaya().map(g=>'g_'+g.id));
}
async function rtPost(body){
  return api(body.action, body);
}
// Dipanggil setiap status login berubah (lewat updateUserBadge)
async function rtSync(){
  const me = rtMe();
  if(!me){ rtStop(); return; }
  if(rt.meId && rt.meId!==me.id) rtStop();
  if(rt.meId===me.id && (rt.timer || !rt.checked)) { renderChatUI(); return; }
  rt.meId = me.id;
  try{ rt.read = JSON.parse(localStorage.getItem('smb_read_'+me.id)||'null'); }catch(e){ rt.read = null; }
  if(!rt.checked){
    rt.checked = true;
    try{
      const r = await fetch(`${APPS_SCRIPT_URL}?action=rt_hello`);
      const j = await r.json(); rt.ok = !!(j && j.rt);
    }catch(e){ rt.ok = false; }
    if(!rtMe() || rtMe().id!==me.id) return;
  }
  if(!rt.ok){ renderChatUI(); return; }
  rtPing();
}
function rtStop(){
  clearTimeout(rt.timer); rt.timer = null;
  if(rt.meId && rt.ok){ try{ navigator.sendBeacon(APPS_SCRIPT_URL, JSON.stringify({action:'rt_bye', token:authToken})); }catch(e){} }
  Object.assign(rt, {meId:'', online:{}, lastSeen:null, rev:0, msgs:{}, chatOpen:false, room:'', read:{}, sending:{}, known:new Set()});
  renderChatUI(); renderPresence();
}
// Sinyal online ikut terkirim lewat pengecekan versi data (tiap 20 detik) — tanpa permintaan tambahan.
function rtHeartbeatParam(){ return ''; } // sinyal online kini dicatat server dari sesi login saat cek versi
function rtJadwal(){
  clearTimeout(rt.timer);
  const me = rtMe(); if(!me || !rt.ok) return;
  if(me.role==='siswa') return; // siswa cukup lewat pengecekan versi data
  const ms = me.role==='siswa'? RT_INTERVAL.siswa : (rt.chatOpen? RT_INTERVAL.chat : RT_INTERVAL.staf);
  rt.timer = setTimeout(rtPing, ms);
}
async function rtPing(){
  const me = rtMe(); if(!me || !rt.ok) return;
  if(document.hidden || rt.busy){ rtJadwal(); return; }
  rt.busy = true;
  const staf = me.role!=='siswa';
  const body = {action:'rt_ping', me};
  if(staf){
    body.ids = rtStaf().map(u=>u.id).concat(db.siswa.filter(s=>s.status==='aktif').map(s=>s.id));
    body.rooms = roomsSaya();
    rt.known = rt.known || new Set();
    const adaBaru = body.rooms.some(r=>!rt.known.has(r));   // grup/percakapan baru: ambil juga pesan lamanya
    body.since = adaBaru? 0 : rt.rev;
  }
  try{
    const j = await rtPost(body);
    if(j.online) rt.online = j.online;
    if(Array.isArray(j.msgs) && j.msgs.length) rtTerimaPesan(j.msgs, rt.rev===0);
    if(j.rev!=null) rt.rev = Math.max(rt.rev, Number(j.rev)||0);
    if(body.rooms) body.rooms.forEach(r=>rt.known.add(r));
    if(rt.read===null){ rt.read = {}; Object.keys(rt.msgs).forEach(r=>{ rt.read[r]=rtMaxSeq(r); }); rtSimpanRead(); } // pertama kali di perangkat ini: anggap pesan lama sudah dibaca
  }catch(e){ /* coba lagi di siklus berikutnya */ }
  rt.busy = false;
  renderPresence(); renderChatUI(true);
  if(activeTab==='aktivitas' && appStage==='ready') rtRefreshAktivitas();
  rtJadwal();
}
function rtTerimaPesan(list, awal){
  const me = rtMe(); let baru = null;
  list.forEach(m=>{
    const arr = rt.msgs[m.room] = rt.msgs[m.room] || [];
    if(arr.some(x=>x.s===m.s)) return;
    arr.push(m); arr.sort((a,b)=>a.s-b.s);
    if(!awal && me && m.f!==me.id && m.t > Date.now()-120000) baru = m;
  });
  if(baru && !(rt.chatOpen && rt.room===baru.room && !document.hidden)){
    toast(`💬 ${baru.n}: ${baru.x.slice(0,60)}${baru.x.length>60?'…':''}`);
  }
  if(rt.chatOpen && rt.room) rtTandaiDibaca(rt.room);
}
function rtMaxSeq(room){ const a=rt.msgs[room]||[]; return a.length? a[a.length-1].s : 0; }
function rtSimpanRead(){ try{ localStorage.setItem('smb_read_'+rt.meId, JSON.stringify(rt.read||{})); }catch(e){} }
function rtTandaiDibaca(room){ rt.read = rt.read||{}; const m=rtMaxSeq(room); if((rt.read[room]||0)<m){ rt.read[room]=m; rtSimpanRead(); } }
function rtUnread(room){ const me=rtMe(); const lr=(rt.read||{})[room]||0; return (rt.msgs[room]||[]).filter(m=>m.s>lr && me && m.f!==me.id).length; }
function rtTotalUnread(){ return roomsSaya().reduce((a,r)=>a+rtUnread(r),0); }

/* ---------- Status online: chip di topbar & daftar ---------- */
function rtHitungOnline(){
  const stafOn = rtStaf().filter(u=>rtOnline(u.id));
  const siswaOn = db.siswa.filter(s=>s.status==='aktif' && rtOnline(s.id));
  return {stafOn, siswaOn};
}
function renderPresence(){
  const el = document.getElementById('rtChip'); if(!el) return;
  const me = rtMe();
  if(!rt.ok || !me || me.role==='siswa'){ el.innerHTML=''; return; }
  const {stafOn, siswaOn} = rtHitungOnline();
  el.innerHTML = `<button class="rt-chip" onclick="bukaSiapaOnline()" title="Lihat siapa yang online"><span class="on-dot on"></span>${stafOn.length} guru · ${siswaOn.length} siswa online</button>`;
  const d = document.getElementById('dashOnline');
  if(d) d.outerHTML = dashOnlineHtml();
  const t = (n=>n? `(${n}) `:'')(rtTotalUnread());
  document.title = t + (document.title.replace(/^\(\d+\)\s*/,''));
}
function dashOnlineHtml(){
  if(!rt.ok || !currentUser) return '<div id="dashOnline"></div>';
  const {stafOn, siswaOn} = rtHitungOnline();
  return `<div id="dashOnline" class="dash-online">
    <span class="on-dot on"></span><strong>Online sekarang</strong>
    <span>${stafOn.length} guru/admin</span><span>${siswaOn.length} siswa</span>
    <button class="btn-outline btn-small" onclick="bukaSiapaOnline()">Lihat siapa</button>
    ${isAdmin()? `<button class="btn-outline btn-small" onclick="switchTab('aktivitas')">Riwayat terakhir online</button>`:''}
  </div>`;
}
function bukaSiapaOnline(){
  const {stafOn, siswaOn} = rtHitungOnline();
  const me = rtMe();
  const kelasNm = s=>{ const k=db.kelas.find(x=>x.id===s.kelasId); return k? kelasLabel(k):''; };
  openModal(`<h3>Siapa yang online</h3>
    <p class="subtitle" style="margin-top:0">Diperbarui tiap ±20 detik. Seseorang dianggap online bila websitenya terbuka dalam ±1 menit terakhir.</p>
    <div class="on-cols">
      <section><h4>Guru & admin <span class="sd-sub" style="display:inline">(${stafOn.length})</span></h4>
        ${stafOn.length? stafOn.map(u=>`<div class="on-row">${rtDot(u.id)}<span class="on-nm">${esc(u.nama)}${u.id===me.id?' <small class="sd-sub" style="display:inline">(Anda)</small>':''}</span><span class="badge ${u.role}">${u.role}</span>
          ${u.id!==me.id? `<button class="btn-outline btn-small" onclick="closeModal(); bukaChat('${dmRoom(me.id,u.id)}')">Chat</button>`:''}</div>`).join('') : '<p class="sd-sub">Tidak ada.</p>'}</section>
      <section><h4>Siswa <span class="sd-sub" style="display:inline">(${siswaOn.length})</span></h4>
        ${siswaOn.length? `<div class="on-scroll">${siswaOn.sort((a,b)=>a.namaLengkap.localeCompare(b.namaLengkap)).map(s=>`<div class="on-row">${rtDot(s.id)}<span class="on-nm">${esc(s.namaLengkap)}<small class="sd-sub">${esc(kelasNm(s))}</small></span></div>`).join('')}</div>` : '<p class="sd-sub">Tidak ada.</p>'}</section>
    </div>
    <div class="modal-actions">${isAdmin()? `<button class="btn-outline btn-small" onclick="closeModal(); switchTab('aktivitas')">Riwayat terakhir online</button>`:''}<button class="btn-sun btn-small" onclick="closeModal()">Tutup</button></div>`, 'wide');
}

/* ---------- Halaman admin: Aktivitas Online ---------- */
let aktFilter = 'semua', aktCari = '';
function fmtLalu(ms){
  const d = Date.now()-ms, m = Math.floor(d/60000);
  if(m<1) return 'baru saja'; if(m<60) return m+' menit lalu';
  const h = Math.floor(m/60); if(h<24) return h+' jam lalu';
  const hr = Math.floor(h/24); return hr+' hari lalu';
}
async function rtRefreshAktivitas(muatUlang){
  if(!rt.ok) return;
  if(muatUlang || !rt.lastSeen || Date.now()-(rt.lastSeenAt||0) > 60000){
    try{ const j = await rtPost({action:'rt_lastseen'}); rt.lastSeen = j.lastSeen||{}; rt.lastSeenAt = Date.now(); }catch(e){ if(muatUlang) toast('Gagal memuat riwayat: '+e.message); }
  }
  const ae = document.activeElement;
  if(activeTab==='aktivitas' && !(ae && ae.id==='aktCari')) renderContent();
  else if(activeTab==='aktivitas'){ const t=document.getElementById('aktTabel'); if(t) t.outerHTML = aktTabelHtml(); }
}
function aktTabelHtml(){
  const ls = rt.lastSeen || {};
  const rows = [];
  rtStaf().forEach(u=>rows.push({id:u.id, nama:u.nama, peran:u.role, ket:'', t:(ls[u.id]||{}).t||0}));
  db.siswa.filter(s=>s.status==='aktif').forEach(s=>{ const k=db.kelas.find(x=>x.id===s.kelasId); rows.push({id:s.id, nama:s.namaLengkap, peran:'siswa', ket:k? kelasLabel(k):'', noInduk:s.noInduk, t:(ls[s.id]||{}).t||0}); });
  rows.forEach(r=>{ if(rtOnline(r.id)) r.t = Math.max(r.t, rt.online[r.id]); });
  const q = aktCari.trim().toLowerCase();
  const list = rows.filter(r=> (aktFilter==='semua' || (aktFilter==='staf'? r.peran!=='siswa' : aktFilter==='siswa'? r.peran==='siswa' : aktFilter==='online'? rtOnline(r.id) : !r.t))
      && (!q || (r.nama+' '+r.ket+' '+(r.noInduk||'')).toLowerCase().includes(q)))
    .sort((a,b)=> (rtOnline(b.id)?1:0)-(rtOnline(a.id)?1:0) || b.t-a.t || a.nama.localeCompare(b.nama));
  return `<div id="aktTabel"><div class="sd-table-wrap"><table class="sd-table">
    <thead><tr><th>Nama</th><th>Peran</th><th>Kelas</th><th>Status</th><th>Terakhir online</th></tr></thead>
    <tbody>${list.map(r=>`<tr><td><strong>${esc(r.nama)}</strong>${r.noInduk? `<small class="sd-sub">No Induk ${esc(r.noInduk)}</small>`:''}</td>
      <td><span class="badge ${r.peran==='siswa'?'aktif':r.peran}">${r.peran}</span></td>
      <td><small class="sd-sub">${esc(r.ket||'—')}</small></td>
      <td>${rtOnline(r.id)? '<span class="tstat st-buka"><span class="on-dot on"></span> Online</span>' : '<span class="tstat st-draf">Offline</span>'}</td>
      <td>${r.t? `<span class="sd-k">${new Date(r.t).toLocaleString('id-ID',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span><small class="sd-sub">${fmtLalu(r.t)}</small>` : '<span class="sd-sub">Belum pernah tercatat</span>'}</td></tr>`).join('')
      || `<tr><td colspan="5" class="sd-sub" style="text-align:center;padding:20px">Tidak ada yang cocok.</td></tr>`}</tbody></table></div>
    <p class="sheet-note">Menampilkan ${list.length} orang. "Terakhir online" dicatat paling sering setiap 10 menit, jadi bisa selisih beberapa menit. Pencatatan dimulai sejak fitur ini dipasang.</p></div>`;
}
function renderAktivitas(){
  if(!isAdmin()) return `<div class="empty">Menu ini khusus Admin.</div>`;
  const head = `<div class="page-head"><div><h2>Aktivitas Online</h2><p class="subtitle">Siapa yang sedang online dan kapan terakhir kali setiap guru dan siswa membuka website.</p></div>
    ${rt.ok? `<button class="btn-outline" onclick="rtRefreshAktivitas(true)">Muat ulang</button>`:''}</div>`;
  if(!rt.ok) return head + rtBelumAktifHtml();
  if(!rt.lastSeen) setTimeout(()=>rtRefreshAktivitas(true), 0);
  const {stafOn, siswaOn} = rtHitungOnline();
  const pernah = rt.lastSeen? Object.keys(rt.lastSeen).length : 0;
  return head + `<div class="sd-summary">
      <div><strong>${stafOn.length}</strong><span>guru/admin online</span></div>
      <div><strong>${siswaOn.length}</strong><span>siswa online</span></div>
      <div><strong>${pernah}</strong><span>orang pernah tercatat online</span></div>
    </div>
    <div class="sd-filters">
      <input type="search" id="aktCari" placeholder="Cari nama, kelas, No Induk…" value="${esc(aktCari)}" oninput="aktCari=this.value; const t=document.getElementById('aktTabel'); if(t) t.outerHTML=aktTabelHtml();">
      <select onchange="aktFilter=this.value; renderContent()" aria-label="Filter">
        ${[['semua','Semua'],['online','Sedang online'],['staf','Guru & admin'],['siswa','Siswa'],['belum','Belum pernah online']].map(([v,l])=>`<option value="${v}" ${v===aktFilter?'selected':''}>${l}</option>`).join('')}
      </select>
    </div>
    ${rt.lastSeen? aktTabelHtml() : '<div class="empty">Memuat riwayat…</div>'}`;
}
function rtBelumAktifHtml(){
  return `<div class="set-card" style="max-width:760px"><div class="set-h" style="margin-top:0">Server belum diperbarui</div>
    <p style="margin-top:0">Status online dan chat membutuhkan file <strong>Realtime.gs</strong> di proyek Apps Script Anda. Setelah dipasang, fitur ini aktif dengan sendirinya — website tidak perlu diubah.</p>
    <ol class="rt-steps"><li>Buka proyek Apps Script SMB, klik <strong>+ › Script</strong>, beri nama <code>Realtime</code>, tempel isi file Realtime.gs.</li>
      <li>Di file kode utama, jadikan baris ini baris pertama di dalam <code>doGet(e)</code> dan <code>doPost(e)</code>:<br><code>var rt = rtHandle_(e); if (rt) return rt;</code></li>

function renderChatUI(hanyaPerbarui){
  const root = document.getElementById('chatRoot'); if(!root) return;
  const me = rtMe();
  if(!rt.ok || !me || me.role==='siswa' || appStage!=='ready'){ root.innerHTML=''; return; }
  const n = rtTotalUnread();
  if(!rt.chatOpen){
    root.innerHTML = `<button class="chat-fab" onclick="bukaChat()" aria-label="Buka chat${n? ', '+n+' pesan belum dibaca':''}">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/></svg>
      <span>Chat</span>${n? `<b class="cnt">${n}</b>`:''}</button>`;
    return;
  }
  if(hanyaPerbarui && document.getElementById('chatPanel')){
    const list = document.getElementById('chatList'); if(list) list.innerHTML = chatListHtml();
    const msgs = document.getElementById('chatMsgs');
    if(msgs){ const bawah = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 60; msgs.innerHTML = chatMsgsHtml(rt.room); if(bawah) msgs.scrollTop = msgs.scrollHeight; }
    const hs = document.getElementById('chatHeadSub'); if(hs) hs.innerHTML = chatHeadSub(rt.room);
    return;
  }
  root.innerHTML = `<div class="chat-panel" id="chatPanel" role="dialog" aria-label="Chat">${rt.room? chatRoomHtml(rt.room) : chatHomeHtml()}</div>`;
  const msgs = document.getElementById('chatMsgs'); if(msgs) msgs.scrollTop = msgs.scrollHeight;
}
function bukaChat(room){ rt.chatOpen = true; rt.room = room||''; if(room) rtTandaiDibaca(room); renderChatUI(); rtJadwal(); if(room) setTimeout(()=>{ const i=document.getElementById('chatInput'); i&&i.focus(); },30); }
function tutupChat(){ rt.chatOpen = false; rt.room=''; renderChatUI(); renderPresence(); rtJadwal(); }
function namaRoom(room){
  const me = rtMe();
  if(room.startsWith('g_')){ const g=(db.chatGrup||[]).find(x=>'g_'+x.id===room); return g? g.nama : 'Grup'; }
  const other = room.slice(3).split('_').find(id=>id!==me.id);
  const u = db.users.find(x=>x.id===other); return u? u.nama : 'Pengguna';
}
function lawanDm(room){ const me=rtMe(); return room.slice(3).split('_').find(id=>id!==me.id); }
function chatHeadSub(room){
  if(room.startsWith('g_')){ const g=(db.chatGrup||[]).find(x=>'g_'+x.id===room); const ang=g?g.anggota:[]; const on=ang.filter(id=>rtOnline(id)).length; return `${ang.length} anggota · ${on} online`; }
  const id = lawanDm(room); return rtOnline(id)? '<span class="on-dot on"></span> Online' : 'Offline';
}
function chatListHtml(){
  const me = rtMe(), q = rt.chatCari.trim().toLowerCase();
  const items = [];
  grupSaya().forEach(g=>items.push({room:'g_'+g.id, nama:g.nama, grup:true}));
  rtStaf().filter(u=>u.id!==me.id).forEach(u=>items.push({room:dmRoom(me.id,u.id), nama:u.nama, uid:u.id, role:u.role}));
  items.forEach(it=>{ const a=rt.msgs[it.room]||[]; it.last=a[a.length-1]; it.unread=rtUnread(it.room); });
  const list = items.filter(it=>!q || it.nama.toLowerCase().includes(q))
    .sort((a,b)=> ((b.last||{}).t||0)-((a.last||{}).t||0) || (b.uid&&rtOnline(b.uid)?1:0)-(a.uid&&rtOnline(a.uid)?1:0) || a.nama.localeCompare(b.nama));
  return list.map(it=>`<button class="cl-item ${it.unread?'unread':''}" onclick="bukaChat('${it.room}')">
      <span class="cl-av ${it.grup?'grp':''}">${it.grup? '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.6c2.8.2 5 2.2 5 5.4"/></svg>' : esc(inisial(it.nama))}${it.uid? rtDot(it.uid):''}</span>
      <span class="cl-txt"><strong>${esc(it.nama)}</strong><small>${it.last? esc((it.last.f===me.id?'Anda: ':(it.grup? it.last.n.split(' ')[0]+': ':''))+it.last.x).slice(0,60) : (it.grup? 'Grup' : (it.role==='admin'?'Admin':'Guru'))}</small></span>
      <span class="cl-meta">${it.last? `<time>${jamPesan(it.last.t, true)}</time>`:''}${it.unread? `<b class="cnt">${it.unread}</b>`:''}</span>
    </button>`).join('') || '<p class="sd-sub" style="padding:16px">Tidak ditemukan.</p>';
}
function chatHomeHtml(){
  const {stafOn} = rtHitungOnline();
  return `<div class="cp-head"><div><strong>Chat</strong><small>${stafOn.length} guru/admin online</small></div>
      <button class="btn-outline btn-small" onclick="formGrupChat()">+ Grup</button>
      <button class="ib" aria-label="Tutup chat" onclick="tutupChat()">✕</button></div>
    <div class="cp-search"><input type="search" placeholder="Cari nama atau grup…" value="${esc(rt.chatCari)}" oninput="rt.chatCari=this.value; document.getElementById('chatList').innerHTML=chatListHtml()"></div>
    <div class="cp-list" id="chatList">${chatListHtml()}</div>`;
}
function jamPesan(t, ringkas){
  const d = new Date(t), now = new Date();
  const hari = d.toDateString()===now.toDateString();
  if(ringkas) return hari? d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}) : d.toLocaleDateString('id-ID',{day:'numeric',month:'short'});
  return d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}
function chatMsgsHtml(room){
  const me = rtMe(), grup = room.startsWith('g_');
  const all = (rt.msgs[room]||[]).concat(Object.values(rt.sending).filter(p=>p.room===room));
  if(!all.length) return `<div class="cm-empty">Belum ada pesan. Mulai percakapan di bawah.</div>`;
  let lastDay = '', lastFrom = '';
  return all.map(m=>{
    const d = new Date(m.t), day = d.toDateString();
    let sep = '';
    if(day!==lastDay){ sep = `<div class="cm-day">${d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})}</div>`; lastDay = day; lastFrom=''; }
    const mine = m.f===me.id, showName = grup && !mine && lastFrom!==m.f;
    lastFrom = m.f;
    return `${sep}<div class="cm ${mine?'mine':''} ${m.pending?'pending':''} ${m.gagal?'fail':''}">
      ${showName? `<span class="cm-n">${esc(m.n)}</span>`:''}<div class="cm-b">${teksBr(m.x)}<time>${m.gagal? 'Gagal terkirim · <a href="javascript:void 0" onclick="kirimUlang(\''+m.tmp+'\')">kirim ulang</a>' : m.pending? 'Mengirim…' : jamPesan(m.t)}</time></div></div>`;
  }).join('');
}
function chatRoomHtml(room){
  const grup = room.startsWith('g_');
  const nm = namaRoom(room);
  return `<div class="cp-head"><button class="ib" aria-label="Kembali" onclick="rt.room=''; renderChatUI()">←</button>
      <span class="cl-av ${grup?'grp':''}" style="width:34px;height:34px">${grup? '#' : esc(inisial(nm))}</span>
      <div style="flex:1;min-width:0"><strong>${esc(nm)}</strong><small id="chatHeadSub">${chatHeadSub(room)}</small></div>
      ${grup? `<button class="ib" title="Kelola grup" onclick="formGrupChat('${room.slice(2)}')">⋯</button>`:''}
      <button class="ib" aria-label="Tutup chat" onclick="tutupChat()">✕</button></div>
    <div class="cp-msgs" id="chatMsgs">${chatMsgsHtml(room)}</div>
    <div class="cp-input"><textarea id="chatInput" rows="1" maxlength="500" placeholder="Tulis pesan…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault(); kirimPesan();}" oninput="this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,110)+'px'"></textarea>
      <button class="btn-sun" onclick="kirimPesan()" aria-label="Kirim">Kirim</button></div>`;
}
async function kirimPesan(){
  const inp = document.getElementById('chatInput'); if(!inp) return;
  const text = inp.value.trim(); if(!text) return;
  const me = rtMe(), room = rt.room;
  const tmp = 'tmp'+Date.now();
  rt.sending[tmp] = {tmp, room, f:me.id, n:me.nama, x:text, t:Date.now(), pending:true, s:Infinity};
  inp.value=''; inp.style.height='auto';
  renderChatUI(true); const box=document.getElementById('chatMsgs'); if(box) box.scrollTop=box.scrollHeight;
  await kirimKeServer(tmp);
}
async function kirimKeServer(tmp){
  const p = rt.sending[tmp]; if(!p) return;
  p.pending = true; p.gagal = false; renderChatUI(true);
  try{
    const j = await rtPost({action:'rt_send', me:rtMe(), room:p.room, text:p.x});
    delete rt.sending[tmp];
    rtTerimaPesan([j.msg], false); rtTandaiDibaca(p.room);
  }catch(e){ p.pending=false; p.gagal=true; }
  renderChatUI(true); const box=document.getElementById('chatMsgs'); if(box) box.scrollTop=box.scrollHeight;
}
function kirimUlang(tmp){ kirimKeServer(tmp); }

      ${rtStaf().map(u=>`<label>${u.id===me.id? `<input type="checkbox" checked disabled>` : `<input type="checkbox" class="gc_ang" value="${u.id}" ${anggota.has(u.id)?'checked':''} ${bolehUbah?'':'disabled'}>`} ${rtDot(u.id)} ${esc(u.nama)}${u.id===me.id?' (Anda)':''}</label>`).join('')}

function simpanGrupChat(gid){
  const nama = val('gc_nama'); if(!nama) return toast('Nama grup wajib diisi');
  const me = rtMe();
  const ang = [me.id, ...[...document.querySelectorAll('.gc_ang:checked')].map(c=>c.value)];
  if(ang.length<2) return toast('Pilih minimal satu anggota lain');
  db.chatGrup = db.chatGrup || [];
  if(gid){ const g=db.chatGrup.find(x=>x.id===gid); g.nama=nama; g.anggota=[...new Set(ang)]; }
  else { const g={id:uid(), nama, anggota:[...new Set(ang)], dibuatOleh:me.id, dibuat:nowIso()}; db.chatGrup.push(g); gid=g.id; }
  closeModal(); saveToDrive(true); bukaChat('g_'+gid);
  toast('Grup disimpan — anggota lain akan melihatnya dalam ±20 detik');
}
function keluarGrup(gid){
  const g = (db.chatGrup||[]).find(x=>x.id===gid); const me = rtMe();
  if(!confirm(`Keluar dari grup "${g.nama}"?`)) return;
  g.anggota = g.anggota.filter(id=>id!==me.id);
  if(!g.anggota.length) db.chatGrup = db.chatGrup.filter(x=>x.id!==gid);
  closeModal(); rt.room=''; renderChatUI(); saveToDrive(true);
}
function hapusGrup(gid){
  const g = (db.chatGrup||[]).find(x=>x.id===gid);
  if(!confirm(`Hapus grup "${g.nama}" untuk semua anggota? Riwayat pesan tetap tersimpan di spreadsheet.`)) return;
  db.chatGrup = db.chatGrup.filter(x=>x.id!==gid);
  closeModal(); rt.room=''; renderChatUI(); saveToDrive(true);
}

function activeTahunAjaran(){ return db.tahunAjaran.find(t=>t.aktif) || db.tahunAjaran[0]; }
function tingkatOf(kelas){ return db.tingkatKelas.find(t=>t.id===kelas.tingkatKelasId); }
function daerahOf(kelas){ return db.daerah.find(d=>d.id===kelas.daerahId); }
function kelasLabel(k){ const t=tingkatOf(k), d=daerahOf(k); return `${t?t.nama:'?'}${k.namaRombel?' - '+k.namaRombel:''} (${d?d.nama:'?'})`; }
function kelasOfTahun(taId){ return db.kelas.filter(k=>k.tahunAjaranId===taId).sort((a,b)=>{
  const ta=tingkatOf(a), tb=tingkatOf(b); return (ta?ta.urutan:0)-(tb?tb.urutan:0);
});}

function fmtDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),2600); }
function openModal(html, cls){ document.getElementById('modalRoot').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal ${cls||''}" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function nextNoInduk(){ db.meta.noIndukCounter = (db.meta.noIndukCounter||0)+1; return String(db.meta.noIndukCounter).padStart(4,'0'); }

/* ---- Input tanggal format dd/mm/yyyy (disimpan internal sebagai yyyy-mm-dd) ---- */
function isoToDdmmyyyy(iso){ if(!iso) return ''; const p=iso.split('-'); if(p.length!==3) return ''; return `${p[2]}/${p[1]}/${p[0]}`; }
function ddmmyyyyToIso(str){
  const m = (str||'').trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!m) return '';
  const d=+m[1], mo=+m[2], y=+m[3];
  if(mo<1||mo>12||d<1||d>31) return '';
  return `${m[3]}-${m[2]}-${m[1]}`;
}
function maskDateInput(el){
  let v = el.value.replace(/\D/g,'').slice(0,8);
  if(v.length>=5) v = v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);
  else if(v.length>=3) v = v.slice(0,2)+'/'+v.slice(2);
  el.value = v;
}
function dateFieldDDMMYYYY(id, isoValue){
  return `<input id="${id}" type="text" inputmode="numeric" placeholder="dd/mm/yyyy" maxlength="10" oninput="maskDateInput(this)" value="${isoValue? isoToDdmmyyyy(isoValue):''}">`;
}

async function submitPendaftaran(){
  const nama = kapitalNama(document.getElementById('dfNama').value);
  const tempatLahir = document.getElementById('dfTempat').value.trim();
  const tglLahir = ddmmyyyyToIso(document.getElementById('dfTgl').value.trim());
  const teleponSiswa = document.getElementById('dfTeleponSiswa').value.trim();
  const daerahId = document.getElementById('dfDaerah').value;
  const alamatTinggal = document.getElementById('dfAlamat').value.trim();
  const asalSekolah = document.getElementById('dfAsalSekolah').value.trim();
  const namaVihara = document.getElementById('dfVihara').value.trim();
  if(!nama) return dfShowError('Nama Lengkap wajib diisi', 'dfNama');
  if(!tempatLahir) return dfShowError('Tempat Lahir wajib diisi', 'dfTempat');
  if(!tglLahir) return dfShowError('Tanggal Lahir wajib diisi format dd/mm/yyyy', 'dfTgl');
  if(!teleponSiswa) return dfShowError('No Telepon Siswa wajib diisi', 'dfTeleponSiswa');

  if(!namaVihara) return dfShowError('Nama Vihara wajib diisi', 'dfVihara');

  const entry = {
    id:uid(), status:'pending', tanggalDaftar: new Date().toISOString().slice(0,10),
    namaLengkap: nama, tempatLahir, tglLahir, teleponSiswa,
    tingkatKelasId: document.getElementById('dfTingkat').value,
    daerahId,
    alamatTinggal, asalSekolah,
    namaAyah: document.getElementById('dfAyah').value.trim(),
    teleponAyah: document.getElementById('dfTeleponAyah').value.trim(),
    namaIbu: document.getElementById('dfIbu').value.trim(),
    teleponIbu: document.getElementById('dfTeleponIbu').value.trim(),
    namaWali: document.getElementById('dfWali').value.trim(),
    teleponWali: document.getElementById('dfTeleponWali').value.trim(),

  if(r.duplikat){

// Tanda tangan digital: perkecil, hapus latar terang, potong ke area tinta, simpan sebagai PNG transparan
async function uploadTtdGuru(input){
  const f = input.files[0]; input.value='';
  if(!cekFileGambar(f)) return;
  if(window._ttdProses) return;
  window._ttdProses = true;
  const prev = document.querySelector('.sig-prev'); if(prev) prev.innerHTML = 'Memproses…';
  await jeda();
  try{
    const c = await muatGambarFile(f, 900, 400);
    const w = c.width, h = c.height, ctx = c.getContext('2d');
    const d = ctx.getImageData(0,0,w,h), px = d.data;
    let x0=w, y0=h, x1=-1, y1=-1;
    for(let i=0;i<px.length;i+=4){
      const lum = 0.299*px[i]+0.587*px[i+1]+0.114*px[i+2];
      const a = Math.max(0, Math.min(255, (205-lum)*3.2)); // makin gelap makin pekat, latar terang jadi transparan
      px[i+3] = Math.min(px[i+3], a);
      if(px[i+3]>40){ const p=i/4, x=p%w, y=(p-x)/w; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
    }
    if(x1<0){ toast('Tanda tangan tidak terbaca — gunakan tinta gelap di kertas putih'); renderContent(); return; }
    ctx.putImageData(d,0,0);
    const pad=6; x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(w-1,x1+pad); y1=Math.min(h-1,y1+pad);
    const cw=x1-x0+1, ch=y1-y0+1, sc2=Math.min(1, 420/cw, 160/ch);
    const o = document.createElement('canvas'); o.width=Math.max(1,Math.round(cw*sc2)); o.height=Math.max(1,Math.round(ch*sc2));
    o.getContext('2d').drawImage(c, x0,y0,cw,ch, 0,0,o.width,o.height);
    const u = db.users.find(x=>x.id===currentUser.id);
    u.ttdGambar = o.toDataURL('image/png'); currentUser = u;
    renderContent(); saveToDrive(true); toast('Tanda tangan disimpan');
  }catch(e){ toast('Foto tidak bisa dibaca — coba foto lain (JPG/PNG)'); renderContent(); }
  finally{ window._ttdProses = false; }
}

  u.pendidikanTerakhir = document.getElementById('pfPendidikan').value.trim();
  updateUserBadge();
  await saveToDrive(true);
  toast('Profil disimpan');
}
function pfPassError(msg){ const b=document.getElementById('pfPassError'); b.textContent='⚠ '+msg; b.style.display='block'; }
async function submitUbahPassword(){
  const lama = document.getElementById('pfPassLama').value;
  const baru = document.getElementById('pfPassBaru').value;
  const ulang = document.getElementById('pfPassUlang').value;
  if(!lama||!baru||!ulang) return pfPassError('Semua kolom password wajib diisi');
  if(baru !== ulang) return pfPassError('Password baru dan ulangi password tidak sama');
  if(baru.length < 4) return pfPassError('Password baru minimal 4 karakter');
  try{ await api('ubahPassword', {lama, baru}); }catch(e){ return pfPassError(e.message); }
  document.getElementById('pfPassLama').value=''; document.getElementById('pfPassBaru').value=''; document.getElementById('pfPassUlang').value='';
  const b=document.getElementById('pfPassError'); if(b) b.style.display='none';
  toast('Password berhasil diubah');
}

function formApprove(id){
  const p = db.pendaftaran.find(x=>x.id===id);
  const ta = activeTahunAjaran();
  if(!ta){ toast('Buat tahun ajaran aktif terlebih dahulu'); return; }
  const kelasList = kelasOfTahun(ta.id);
  const cocok = kelasList.filter(k=>k.tingkatKelasId===p.tingkatKelasId && k.daerahId===p.daerahId);
  openModal(`<h3>Setujui Pendaftaran — ${esc(p.namaLengkap)}</h3>
    <p class="subtitle" style="margin-top:-6px">Pilih kelas tujuan di tahun ajaran ${esc(ta.nama)}. Nomor Induk akan dibuat otomatis.</p>
    <div class="field"><label>Kelas</label><select id="apKelas">
      <option value="">— pilih kelas —</option>
      ${kelasList.map(k=>`<option value="${k.id}" ${cocok.some(c=>c.id===k.id)?'selected':''}>${esc(kelasLabel(k))}</option>`).join('')}
    </select></div>
    ${!kelasList.length? `<p style="font-size:12.5px;color:var(--coral)">Belum ada kelas di tahun ajaran ini. Buat dulu di tab Tahun Ajaran.</p>`:''}
    <div class="modal-actions"><button class="btn-outline btn-small" onclick="closeModal()">Batal</button>
    <button class="btn-sun btn-small" onclick="prosesApprove('${id}')">Setujui & Buat Akun</button></div>`);
}
function prosesApprove(id){
  const kelasId = document.getElementById('apKelas').value;
  if(!kelasId) return toast('Pilih kelas tujuan terlebih dahulu');
  const p = db.pendaftaran.find(x=>x.id===id);
  const sudahAda = db.siswa.find(s=> normTeks(s.namaLengkap)===normTeks(p.namaLengkap) && normTeks(s.tempatLahir)===normTeks(p.tempatLahir) && s.tglLahir===p.tglLahir);
  if(sudahAda && !confirm(`Sudah ada siswa "${sudahAda.namaLengkap}" dengan tempat & tanggal lahir yang sama (No Induk ${sudahAda.noInduk}). Tetap setujui sebagai siswa baru?`)) return;
  const siswaBaru = {
    id:uid(), noInduk: nextNoInduk(), status:'aktif',
    namaLengkap: kapitalNama(p.namaLengkap), tempatLahir: p.tempatLahir, tglLahir: p.tglLahir, teleponSiswa: p.teleponSiswa,
    kelasId, alamatTinggal: p.alamatTinggal, asalSekolah: p.asalSekolah,
    namaAyah: p.namaAyah, teleponAyah: p.teleponAyah, namaIbu: p.namaIbu, teleponIbu: p.teleponIbu,
    namaWali: p.namaWali, teleponWali: p.teleponWali, statusKetuhanan: p.statusKetuhanan, namaVihara: p.namaVihara,
  };
  db.siswa.push(siswaBaru);
  p.status = 'approved'; p.approvedSiswaId = siswaBaru.id;
  closeModal(); renderTabs(); renderContent(); saveToDrive(true);
  toast(`Disetujui — No Induk ${siswaBaru.noInduk} dibuat untuk ${siswaBaru.namaLengkap}`);
}
function tolakPendaftaran(id){
  if(!confirm('Tolak pendaftaran ini?')) return;
  const p = db.pendaftaran.find(x=>x.id===id);
  p.status = 'rejected';
  renderTabs(); renderContent(); saveToDrive(true);
}

function simpanKas(id){
  const tanggal = document.getElementById('fKasTgl').value;
  const tipe = document.getElementById('fKasTipe').value;
  const keterangan = document.getElementById('fKasKet').value.trim();
  const jumlah = Number(document.getElementById('fKasJumlah').value);
  if(!tanggal||!keterangan||!jumlah) return toast('Semua kolom wajib diisi');
  if(id){
    const k = db.kas.find(x=>x.id===id);
    Object.assign(k, {tanggal, tipe, keterangan, jumlah});
  } else {
    db.kas.push({id:uid(), tanggal, tipe, keterangan, jumlah, autoGenerated:false});
  }
  closeModal(); renderContent(); saveToDrive(true);
}
function hapusKas(id){ if(!confirm('Hapus catatan kas ini?')) return; db.kas=db.kas.filter(k=>k.id!==id); renderContent(); saveToDrive(true); }

/* ======================= DASHBOARD ======================= */
function meterRows(items, total, opts){
  opts = opts||{};
  if(!total) return `<div class="dash-empty">Belum ada data.</div>`;
  return items.map(it=>{
    const pct = Math.round(it.n/total*1000)/10;
    return `<div class="meter" title="${esc(it.label)}: ${it.n} dari ${total} (${pct}%)">
      <div class="meter-top"><span class="meter-lbl">${esc(it.label)}</span><span class="meter-val"><strong>${pct}%</strong> · ${it.n}${opts.unit?' '+opts.unit:''}</span></div>
      <div class="meter-track"><div class="meter-fill${it.cls?' '+it.cls:''}" style="width:${Math.max(pct, it.n?2:0)}%"></div></div>
    </div>`;
  }).join('');
}
function renderDashboard(){
  const ta = activeTahunAjaran();
  const kelasTA = ta? kelasOfTahun(ta.id) : [];
  const kelasTAIds = new Set(kelasTA.map(k=>k.id));
  const semuaSiswa = db.siswa;
  const aktif = semuaSiswa.filter(s=>s.status==='aktif');
  const guruList = db.users.filter(u=>u.role==='guru');
  const pct = (n,t)=> t? Math.round(n/t*1000)/10 : 0;

  // --- Siswa per daerah & jenjang ---
  const byDaerah = {}, byJenjang = {};
  aktif.forEach(s=>{
    const k = db.kelas.find(x=>x.id===s.kelasId);
    const d = k? daerahOf(k) : null, t = k? tingkatOf(k) : null;
    const dn = d? d.nama : 'Belum ada kelas', jn = t? t.jenjang : 'Belum ada kelas';
    byDaerah[dn] = (byDaerah[dn]||0)+1; byJenjang[jn] = (byJenjang[jn]||0)+1;
  });
  const urutJenjang = ['SD','SMP','SMA/SMK','Belum ada kelas'];
  const daerahItems = Object.entries(byDaerah).sort((a,b)=>b[1]-a[1]).map(([label,n])=>({label,n}));
  const jenjangItems = Object.entries(byJenjang).sort((a,b)=>urutJenjang.indexOf(a[0])-urutJenjang.indexOf(b[0])).map(([label,n])=>({label,n}));

  // --- Ketuhanan & status siswa ---
  const sudahKet = aktif.filter(s=>s.statusKetuhanan==='Sudah').length;
  const ketItems = [{label:'Sudah memohon Ketuhanan', n:sudahKet}, {label:'Belum', n:aktif.length-sudahKet}];
  const statusLbl = {aktif:'Aktif', lulus:'Lulus', pindah:'Pindah', nonaktif:'Nonaktif'};
  const statusItems = Object.keys(statusLbl).map(st=>({label:statusLbl[st], n:semuaSiswa.filter(s=>s.status===st).length}));

  // --- Guru ---
  const waliIds = new Set(kelasTA.map(k=>k.guruId).filter(Boolean));
  const asistenIds = new Set(kelasTA.flatMap(k=>k.guruAsistenIds||[]));
  const nWali = guruList.filter(g=>waliIds.has(g.id)).length;
  const nAsisten = guruList.filter(g=>!waliIds.has(g.id) && asistenIds.has(g.id)).length;
  const guruItems = [{label:'Wali kelas utama', n:nWali}, {label:'Asisten wali kelas saja', n:nAsisten}, {label:'Belum ditugaskan', n:guruList.length-nWali-nAsisten}];
  const kelasTanpaWali = kelasTA.filter(k=>!k.guruId).length;
  const rasio = guruList.length? (aktif.length/guruList.length).toFixed(1) : '—';

  // --- Kehadiran tahun ajaran ini ---
  const absTA = db.absensi.filter(a=>a.status && kelasTAIds.has(a.kelasId));
  const cAbs = st=> absTA.filter(a=>a.status===st).length;
  const absItems = [{label:'Hadir',n:cAbs('Hadir'),cls:'H'},{label:'Izin',n:cAbs('Izin'),cls:'I'},{label:'Sakit',n:cAbs('Sakit'),cls:'S'},{label:'Alpa',n:cAbs('Alpa'),cls:'A'}];
  const pctHadir = pct(cAbs('Hadir'), absTA.length);
  const nPertemuan = ta? jadwalOfTahun(ta.id).filter(j=>!j.libur).length : 0;
  const nPertemuanLewat = ta? jadwalOfTahun(ta.id).filter(j=>!j.libur && j.tanggal<=new Date().toISOString().slice(0,10)).length : 0;

  // --- Paramita & kas (admin) ---
  const aktifTA = aktif.filter(s=>kelasTAIds.has(s.kelasId));
  const paramitaTA = ta? db.paramita.filter(p=>p.tahunAjaranId===ta.id) : [];
  const nBayar = aktifTA.filter(s=>paramitaTA.some(p=>p.siswaId===s.id)).length;
  const totalParamita = paramitaTA.reduce((a,p)=>a+Number(p.jumlah||0),0);
  const saldoKas = db.kas.reduce((a,k)=>a+(k.tipe==='masuk'?1:-1)*Number(k.jumlah||0),0);

  // --- Tabel kelas ---
  const kelasTampil = isAdmin()? kelasTA : kelasTA.filter(k=>canAccessKelas(k.id));
  const kelasRows = kelasTampil.map(k=>{
    const nS = siswaAktifDiKelas(k.id).length;
    const rec = absTA.filter(a=>a.kelasId===k.id);
    const h = rec.filter(a=>a.status==='Hadir').length;
    const p = rec.length? Math.round(h/rec.length*100) : null;
    const cls = p===null? '' : (p>=80?'good':p>=60?'mid':'low');
    return `<tr><td><strong>${esc(kelasLabel(k))}</strong></td><td>${esc(k.guruId?guruNama(k.guruId):'—')}${!k.guruId?' <span class="badge nonaktif">tanpa wali</span>':''}</td>
      <td style="text-align:right">${nS}</td><td style="text-align:right">${pct(nS, aktifTA.length)}%</td>
      <td style="text-align:right" class="dash-pct ${cls}">${p===null?'—':p+'%'}</td></tr>`;
  }).join('');

  const panel = (judul, sub, isi)=> `<div class="dash-panel"><div class="dash-h">${judul}</div>${sub?`<div class="dash-sub">${sub}</div>`:''}${isi}</div>`;

  return `
    <h2>Selamat datang, ${esc(currentUser.nama)} 👋</h2>
    <p class="subtitle">Tahun ajaran aktif: <strong>${ta? esc(ta.nama):'belum ada'}</strong> · Peran: <span class="badge ${currentUser.role}">${currentUser.role}</span></p>
    ${dashOnlineHtml()}

    <div class="stat-grid">
      <div class="stat"><div class="num">${aktif.length}</div><div class="lbl">Siswa aktif</div><div class="stat-note">${pct(aktif.length, semuaSiswa.length)}% dari ${semuaSiswa.length} siswa tercatat</div></div>
      <div class="stat"><div class="num">${kelasTA.length}</div><div class="lbl">Kelas berjalan</div><div class="stat-note">${kelasTA.length? (aktifTA.length/kelasTA.length).toFixed(1):'0'} siswa / kelas · ${kelasTanpaWali} tanpa wali</div></div>
      <div class="stat"><div class="num">${guruList.length}</div><div class="lbl">Guru terdaftar</div><div class="stat-note">${pct(nWali+nAsisten, guruList.length)}% sudah mengajar · 1 guru : ${rasio} siswa</div></div>
      <div class="stat"><div class="num">${absTA.length? pctHadir+'%' : '—'}</div><div class="lbl">Rata-rata kehadiran</div><div class="stat-note">${nPertemuanLewat} dari ${nPertemuan} pertemuan sudah lewat</div></div>
    </div>

    ${isAdmin()? `<div class="dash-strip">
      <div><span>Pendaftaran menunggu</span><strong>${pendingCount()}</strong>${pendingCount()? `<button class="btn-outline btn-small" onclick="switchTab('pendaftaran')">Tinjau</button>`:''}</div>
      <div><span>Dana Paramita ${ta?esc(ta.nama):''}</span><strong>${nBayar}/${aktifTA.length} siswa · ${pct(nBayar, aktifTA.length)}%</strong><em>Rp${totalParamita.toLocaleString('id-ID')}</em></div>
      <div><span>Saldo Kas SMB</span><strong>Rp${saldoKas.toLocaleString('id-ID')}</strong></div>
      <div><span>Total lulus</span><strong>${semuaSiswa.filter(s=>s.status==='lulus').length}</strong></div>
    </div>`:''}

    <div class="dash-grid">
      ${panel('Siswa per Daerah', `${aktif.length} siswa aktif`, meterRows(daerahItems, aktif.length, {unit:'siswa'}))}
      ${panel('Siswa per Jenjang', `${aktif.length} siswa aktif`, meterRows(jenjangItems, aktif.length, {unit:'siswa'}))}
      ${panel('Kehadiran Tahun Ajaran Ini', `${absTA.length} catatan absensi`, meterRows(absItems, absTA.length))}
      ${panel('Status Memohon Ketuhanan', `${aktif.length} siswa aktif`, meterRows(ketItems, aktif.length, {unit:'siswa'}))}
      ${panel('Penugasan Guru', `${guruList.length} guru · ${kelasTanpaWali} kelas belum punya wali`, meterRows(guruItems, guruList.length, {unit:'guru'}))}
      ${panel('Status Seluruh Siswa', `${semuaSiswa.length} siswa tercatat`, meterRows(statusItems, semuaSiswa.length, {unit:'siswa'}))}
    </div>

    <div class="dash-panel" style="margin-top:14px">
      <div class="dash-h">${isAdmin()? 'Rincian per Kelas' : 'Kelas Saya'}</div>
      <div class="dash-sub">Persentase siswa dihitung dari ${aktifTA.length} siswa aktif tahun ajaran ini; kehadiran = Hadir ÷ seluruh catatan absensi kelas</div>
      ${kelasRows? `<div style="overflow-x:auto"><table><thead><tr><th>Kelas</th><th>Wali kelas</th><th style="text-align:right">Siswa</th><th style="text-align:right">% Siswa</th><th style="text-align:right">Kehadiran</th></tr></thead><tbody>${kelasRows}</tbody></table></div>`
      : `<div class="dash-empty">Belum ada kelas.</div>`}
    </div>
  `;
}

/* ======================= DATA SISWA ======================= */
let siswaFilterKelas = '';
let siswaSearchQuery = '';
let siswaFilterStatus = 'aktif';
let siswaSort = 'noInduk';
let siswaPage = 1;
const SISWA_PER_PAGE = 25;
const ICON = {
  eye:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  edit:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>',
};
function kontakUtama(s){
  if(s.namaAyah || s.teleponAyah) return {nama:s.namaAyah||'—', rel:'Ayah', tel:s.teleponAyah};
  if(s.namaIbu || s.teleponIbu) return {nama:s.namaIbu||'—', rel:'Ibu', tel:s.teleponIbu};
  if(s.namaWali || s.teleponWali) return {nama:s.namaWali||'—', rel:'Wali', tel:s.teleponWali};
  return null;
}
function inisial(n){ return (n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase(); }
function siswaTerfilter(){
  const ta = activeTahunAjaran();
  const kelasIdsTA = new Set((ta? kelasOfTahun(ta.id):[]).map(k=>k.id));
  let list;
  if(siswaFilterStatus==='aktif') list = db.siswa.filter(s=>s.status==='aktif' && kelasIdsTA.has(s.kelasId));
  else if(siswaFilterStatus==='semua') list = db.siswa.filter(s=> kelasIdsTA.has(s.kelasId) || isAdmin());
  else list = db.siswa.filter(s=>s.status===siswaFilterStatus && (kelasIdsTA.has(s.kelasId) || isAdmin()));
  if(siswaFilterKelas) list = list.filter(s=>s.kelasId===siswaFilterKelas);
  const q = siswaSearchQuery.trim().toLowerCase();
  if(q){
    list = list.filter(s=>{
      const k = db.kelas.find(x=>x.id===s.kelasId);
      return [s.noInduk, s.namaLengkap, s.tempatLahir, s.tglLahir? isoToDdmmyyyy(s.tglLahir):'', s.alamatTinggal, s.asalSekolah,
        s.namaAyah, s.namaIbu, s.namaWali, s.teleponSiswa, s.teleponAyah, s.teleponIbu, s.namaVihara, k? kelasLabel(k):''].join(' ').toLowerCase().includes(q);
    });
  }
  const urutKelas = s=>{ const k=db.kelas.find(x=>x.id===s.kelasId); const t=k?tingkatOf(k):null; return (t?t.urutan:99)*1000 + (k&&daerahOf(k)? db.daerah.indexOf(daerahOf(k)):0); };
  const cmp = {
    noInduk:(a,b)=>(a.noInduk||'').localeCompare(b.noInduk||''),
    nama:(a,b)=>a.namaLengkap.localeCompare(b.namaLengkap),
    kelas:(a,b)=>urutKelas(a)-urutKelas(b) || a.namaLengkap.localeCompare(b.namaLengkap),
  }[siswaSort];
  return list.sort(cmp);
}
function renderSiswa(){
  const ta = activeTahunAjaran();
  const kelasListAll = ta? kelasOfTahun(ta.id):[];
  const list = siswaTerfilter();
  const pages = Math.max(1, Math.ceil(list.length/SISWA_PER_PAGE));
  if(siswaPage>pages) siswaPage = pages;
  const start = (siswaPage-1)*SISWA_PER_PAGE;
  const pageList = list.slice(start, start+SISWA_PER_PAGE);
  const nParamita = ta? list.filter(s=>db.paramita.some(p=>p.siswaId===s.id && p.tahunAjaranId===ta.id)).length : 0;
  const nKet = list.filter(s=>s.statusKetuhanan==='Sudah').length;

  const rows = pageList.map((s,i)=>{
    const k = db.kelas.find(x=>x.id===s.kelasId);
    const t = k? tingkatOf(k):null, d = k? daerahOf(k):null;
    const pay = ta? db.paramita.find(p=>p.siswaId===s.id && p.tahunAjaranId===ta.id) : null;
    const bolehUbah = isAdmin() || canAccessKelas(s.kelasId);
    const kt = kontakUtama(s);
    return `<tr>
      <td class="sd-no">${esc(s.noInduk||'—')}</td>
      <td><button class="sd-name" onclick="lihatSiswa('${s.id}')">
          <span class="sd-av">${esc(inisial(s.namaLengkap))}</span>
          <span><strong>${esc(s.namaLengkap)}</strong><small>${esc(s.tempatLahir||'')}${s.tempatLahir&&s.tglLahir?', ':''}${s.tglLahir? fmtDate(s.tglLahir):''}</small></span></button></td>
      <td><strong class="sd-k">${esc(t? t.nama+(k.namaRombel?' - '+k.namaRombel:'') : '—')}</strong><small class="sd-sub">${esc(d? d.nama:'')}</small></td>
      <td class="sd-wrap">${esc(s.asalSekolah||'—')}</td>
      <td>${kt? `<span class="sd-k">${esc(kt.nama)}</span><small class="sd-sub">${kt.rel}${kt.tel? ' · '+esc(kt.tel):''}</small>` : '<span class="sd-sub">—</span>'}</td>
      <td><span class="pill ${s.statusKetuhanan==='Sudah'?'pill-ok':'pill-muted'}">${esc(s.statusKetuhanan||'—')}</span></td>
      <td class="sd-pay">${ta? `<label class="sw ${bolehUbah?'':'dis'}" title="${pay?'Sudah setor':'Belum setor'}"><input type="checkbox" id="paramitaChk_${s.id}" ${pay?'checked':''} ${bolehUbah?'':'disabled'} onchange="toggleParamita('${s.id}', this.checked, this)"><span></span></label>
          <small class="sd-sub">${pay? 'Rp'+Number(pay.jumlah||DANA_PARAMITA).toLocaleString('id-ID') : 'Belum'}</small>` : '—'}</td>
      <td><span class="badge ${s.status}">${s.status}</span></td>
      <td class="sd-act">
        <button class="ib" title="Lihat detail" onclick="lihatSiswa('${s.id}')">${ICON.eye}</button>
        ${bolehUbah? `<button class="ib" title="Ubah data" onclick="formSiswa('${s.id}')">${ICON.edit}</button>
        <button class="ib ib-danger" title="Hapus" onclick="hapusSiswa('${s.id}')">${ICON.trash}</button>`:''}
      </td>
    </tr>`;
  }).join('');

  const pager = pages>1? `<div class="pager">
      <button class="btn-outline btn-small" ${siswaPage<=1?'disabled':''} onclick="siswaPage--; renderContent()">Sebelumnya</button>
      ${Array.from({length:pages},(_,i)=>i+1).filter(p=>p===1||p===pages||Math.abs(p-siswaPage)<=1)
        .map((p,i,arr)=>`${i&&p-arr[i-1]>1?'<span class="pg-gap">…</span>':''}<button class="pg ${p===siswaPage?'on':''}" onclick="siswaPage=${p}; renderContent()">${p}</button>`).join('')}
      <button class="btn-outline btn-small" ${siswaPage>=pages?'disabled':''} onclick="siswaPage++; renderContent()">Berikutnya</button>
    </div>`:'';

  return `
    <div class="page-head">
      <div><h2>Data Siswa</h2><p class="subtitle">Tahun ajaran ${ta?esc(ta.nama):'—'}${!isAdmin()? ' — Anda hanya bisa mengubah siswa di kelas Anda':''}</p></div>
      <div class="row">
        <details class="dd"><summary class="btn-outline">Excel</summary><div class="dd-menu">
          <button onclick="downloadTemplateExcel()">Unduh template kosong</button>
          <label>Import dari Excel<input type="file" accept=".xlsx,.xls" style="display:none" onchange="importExcel(this)"></label>
          <button onclick="exportExcel()">Export data siswa</button>
        </div></details>
        <button class="btn-sun" onclick="formSiswa()">+ Tambah siswa</button>
      </div>
    </div>
    <div class="sd-summary">
      <div><strong>${list.length}</strong><span>siswa ditampilkan</span></div>
      <div><strong>${list.length? Math.round(nParamita/list.length*100):0}%</strong><span>sudah setor Dana Paramita (${nParamita})</span></div>
      <div><strong>${list.length? Math.round(nKet/list.length*100):0}%</strong><span>sudah memohon Ketuhanan (${nKet})</span></div>
    </div>
    <div class="sd-filters">
      <input type="search" id="siswaSearchBox" placeholder="Cari nama, No Induk, sekolah, orang tua…" value="${esc(siswaSearchQuery)}" oninput="onSiswaSearchInput(this)">
      <select onchange="siswaFilterKelas=this.value; siswaPage=1; renderContent()" aria-label="Kelas">
        <option value="">Semua kelas</option>
        ${kelasListAll.map(k=>`<option value="${k.id}" ${k.id===siswaFilterKelas?'selected':''}>${esc(kelasLabel(k))}</option>`).join('')}
      </select>
      <select onchange="siswaFilterStatus=this.value; siswaPage=1; renderContent()" aria-label="Status">
        ${[['aktif','Siswa aktif'],['semua','Semua status'],['lulus','Lulus'],['pindah','Pindah'],['nonaktif','Nonaktif']].map(([v,l])=>`<option value="${v}" ${v===siswaFilterStatus?'selected':''}>${l}</option>`).join('')}
      </select>
      <select onchange="siswaSort=this.value; renderContent()" aria-label="Urutkan">
        ${[['noInduk','Urut No Induk'],['nama','Urut nama'],['kelas','Urut kelas']].map(([v,l])=>`<option value="${v}" ${v===siswaSort?'selected':''}>${l}</option>`).join('')}
      </select>
    </div>
    ${list.length? `<div class="sd-table-wrap"><table class="sd-table">
      <thead><tr><th>No Induk</th><th>Nama siswa</th><th>Kelas</th><th>Asal sekolah</th><th>Kontak orang tua</th><th>Ketuhanan</th><th>Paramita</th><th>Status</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      <div class="sd-foot"><span>Menampilkan ${start+1}–${Math.min(start+SISWA_PER_PAGE, list.length)} dari ${list.length} siswa</span>${pager}</div>`
    : `<div class="empty"><div class="display">${siswaSearchQuery||siswaFilterKelas? 'Tidak ada siswa yang cocok':'Belum ada data siswa'}</div>${siswaSearchQuery||siswaFilterKelas? 'Ubah kata kunci atau filter kelas.':'Tambahkan siswa satu per satu atau import dari Excel.'}</div>`}
  `;
}
function lihatSiswa(id){
  const s = db.siswa.find(x=>x.id===id); if(!s) return;
  const k = db.kelas.find(x=>x.id===s.kelasId);

  const ta = activeTahunAjaran();
  const pay = ta? db.paramita.find(p=>p.siswaId===s.id && p.tahunAjaranId===ta.id) : null;
  const abs = db.absensi.filter(a=>a.siswaId===s.id && a.kelasId===s.kelasId && a.status);
  const h = abs.filter(a=>a.status==='Hadir').length;
  const row = (l,v)=>`<div class="dl-row"><dt>${l}</dt><dd>${v||'<span class="sd-sub">—</span>'}</dd></div>`;

  const bolehUbah = isAdmin() || canAccessKelas(s.kelasId);
  openModal(`
    <div class="sd-detail-head">
      <span class="sd-av lg">${esc(inisial(s.namaLengkap))}</span>
      <div><h3 style="margin:0">${esc(s.namaLengkap)}</h3>
        <div class="sd-sub">No Induk ${esc(s.noInduk||'—')} · ${esc(k? kelasLabel(k):'Belum ada kelas')}</div></div>
      <span class="badge ${s.status}" style="margin-left:auto">${s.status}</span>
    </div>
    <div class="sd-detail">
      <section><h4>Data pribadi</h4><dl>
        ${row('Tempat, tgl lahir', esc((s.tempatLahir||'')+(s.tglLahir? ', '+tglPanjang(new Date(s.tglLahir+'T00:00:00')):'')))}
        ${row('No telepon', esc(s.teleponSiswa))}
        ${row('Alamat', esc(s.alamatTinggal))}
      </dl></section>
      <section><h4>Sekolah & kelas</h4><dl>
        ${row('Asal sekolah', esc(s.asalSekolah))}
        ${row('Kelas SMB', esc(t? t.nama+(k.namaRombel?' - '+k.namaRombel:''):''))}

function toggleParamita(siswaId, checked, el){
  const ta = activeTahunAjaran();
  if(!ta) return;
  if(checked){
    if(db.paramita.some(p=>p.siswaId===siswaId && p.tahunAjaranId===ta.id)) return;
    formParamitaJumlah(siswaId, ta, el);
  } else {
    db.paramita = db.paramita.filter(p=>!(p.siswaId===siswaId && p.tahunAjaranId===ta.id));
    db.kas = db.kas.filter(k=>!(k.siswaId===siswaId && k.tahunAjaranId===ta.id && k.autoGenerated));
    saveToDrive(true); toast('Tanda bayar dibatalkan');
  }
}

function fsShowError(msg, fieldId){

function simpanSiswa(id){
  const namaLengkap = kapitalNama(document.getElementById('fSNama').value);
  const tempatLahir = document.getElementById('fSTempat').value.trim();
  const tglLahirStr = document.getElementById('fSTgl').value.trim();
  const teleponSiswa = document.getElementById('fSTeleponSiswa').value.trim();
  const daerahId = document.getElementById('fSDaerah').value;
  const kelasId = document.getElementById('fSKelas').value;
  const alamatTinggal = document.getElementById('fSAlamat').value.trim();
  const asalSekolah = document.getElementById('fSAsalSekolah').value.trim();
  const namaVihara = document.getElementById('fSVihara').value.trim();

  if(!namaLengkap) return fsShowError('Nama Lengkap wajib diisi', 'fSNama');
  if(!tempatLahir) return fsShowError('Tempat Lahir wajib diisi', 'fSTempat');
  const tglLahir = ddmmyyyyToIso(tglLahirStr);
  if(!tglLahir) return fsShowError('Tanggal Lahir wajib diisi format dd/mm/yyyy', 'fSTgl');
  if(!teleponSiswa) return fsShowError('No Telepon Siswa wajib diisi', 'fSTeleponSiswa');
  if(!daerahId) return fsShowError('Daerah Belajar wajib dipilih', 'fSDaerah');
  if(!kelasId) return fsShowError('Kelas wajib dipilih', 'fSKelas');
  if(!alamatTinggal) return fsShowError('Alamat Tinggal wajib diisi', 'fSAlamat');
  if(!asalSekolah) return fsShowError('Asal Sekolah wajib diisi', 'fSAsalSekolah');
  if(!namaVihara) return fsShowError('Nama Vihara wajib diisi', 'fSVihara');

  const data = {
    namaLengkap, tempatLahir, tglLahir, teleponSiswa, kelasId,
    alamatTinggal, asalSekolah,
    namaAyah: document.getElementById('fSAyah').value.trim(),
    teleponAyah: document.getElementById('fSTeleponAyah').value.trim(),
    namaIbu: document.getElementById('fSIbu').value.trim(),
    teleponIbu: document.getElementById('fSTeleponIbu').value.trim(),
    namaWali: document.getElementById('fSWali').value.trim(),
    teleponWali: document.getElementById('fSTeleponWali').value.trim(),
    statusKetuhanan: document.getElementById('fSKetuhanan').value,
    namaVihara,
    waliKelasNama: document.getElementById('fSWaliKelasNama').value.trim(),
    waliKelasTelepon: document.getElementById('fSWaliKelasTelepon').value.trim(),
  };
  if(id){
    const s = db.siswa.find(x=>x.id===id);
    Object.assign(s, data);
    const st = document.getElementById('fSStatus'); if(st) s.status = st.value;
  } else {
    db.siswa.push({id:uid(), noInduk: nextNoInduk(), status:'aktif', ...data});
  }
  closeModal(); renderContent(); saveToDrive();
}
function hapusSiswa(id){
  if(!confirm('Hapus data siswa ini? Nomor Induk tidak akan dipakai ulang.')) return;
  db.siswa=db.siswa.filter(s=>s.id!==id); renderContent(); saveToDrive();
}

/* ---- Excel import/export ---- */
const EXCEL_COLUMNS = ["Nama Lengkap","Tempat Lahir","Tanggal Lahir (YYYY-MM-DD)","No Telepon Siswa","Daerah","Kelas","Alamat Tinggal","Asal Sekolah","Nama Ayah","Telepon Ayah","Nama Ibu","Telepon Ibu","Nama Wali Siswa","Telepon Wali Siswa","Status Memohon Ketuhanan (Sudah/Belum)","Nama Vihara","Nama Wali Kelas","Telepon Wali Kelas"];
function downloadTemplateExcel(){
  const ws = XLSX.utils.aoa_to_sheet([EXCEL_COLUMNS]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Template Siswa");
  XLSX.writeFile(wb, "template-data-siswa.xlsx");
}
function importExcel(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      const ta = activeTahunAjaran();
      if(!ta){ toast('Buat tahun ajaran aktif terlebih dahulu'); return; }
      let created=0, skipped=0;
      rows.forEach(r=>{
        const nama = kapitalNama(r["Nama Lengkap"]);
        if(!nama){ skipped++; return; }
        const daerahNama = (r["Daerah"]||'').toString().trim() || (db.daerah[0]?db.daerah[0].nama:'Pusat');
        let daerah = db.daerah.find(d=>d.nama.toLowerCase()===daerahNama.toLowerCase());
        if(!daerah){ daerah = {id:uid(), nama:daerahNama}; db.daerah.push(daerah); }
        const kelasNama = (r["Kelas"]||'').toString().trim();
        const tingkat = db.tingkatKelas.find(t=>t.nama.toLowerCase()===kelasNama.toLowerCase());
        let kelasId = '';
        if(tingkat){
          let kelas = db.kelas.find(k=>k.tahunAjaranId===ta.id && k.tingkatKelasId===tingkat.id && k.daerahId===daerah.id);
          if(!kelas){ kelas = {id:uid(), tahunAjaranId:ta.id, tingkatKelasId:tingkat.id, daerahId:daerah.id, namaRombel:'', guruId:''}; db.kelas.push(kelas); }
          kelasId = kelas.id;
        }
        db.siswa.push({
          id:uid(), noInduk: nextNoInduk(), status:'aktif',
          namaLengkap: nama,
          tempatLahir: (r["Tempat Lahir"]||'').toString().trim(),
          tglLahir: parseExcelDate(r["Tanggal Lahir (YYYY-MM-DD)"]),
          teleponSiswa: (r["No Telepon Siswa"]||'').toString().trim(),
          kelasId,
          alamatTinggal: (r["Alamat Tinggal"]||'').toString().trim(),
          asalSekolah: (r["Asal Sekolah"]||'').toString().trim(),
          namaAyah: (r["Nama Ayah"]||'').toString().trim(),
          teleponAyah: (r["Telepon Ayah"]||'').toString().trim(),
          namaIbu: (r["Nama Ibu"]||'').toString().trim(),
          teleponIbu: (r["Telepon Ibu"]||'').toString().trim(),
          namaWali: (r["Nama Wali Siswa"]||'').toString().trim(),
          teleponWali: (r["Telepon Wali Siswa"]||'').toString().trim(),
          statusKetuhanan: /sudah/i.test((r["Status Memohon Ketuhanan (Sudah/Belum)"]||'').toString())? 'Sudah':'Belum',
          namaVihara: (r["Nama Vihara"]||'').toString().trim(),
          waliKelasNama: (r["Nama Wali Kelas"]||'').toString().trim(),
          waliKelasTelepon: (r["Telepon Wali Kelas"]||'').toString().trim(),
        });
        created++;
      });
      renderContent(); saveToDrive();
      toast(`${created} siswa berhasil diimpor${skipped? `, ${skipped} baris dilewati`:''}`);
    }catch(err){ console.error(err); toast('Gagal membaca file Excel: '+err.message); }
    input.value='';
  };
  reader.readAsArrayBuffer(file);
}
function parseExcelDate(v){
  if(!v) return '';
  if(typeof v === 'number'){ const d = XLSX.SSF.parse_date_code(v); if(d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`; }
  const s = v.toString().trim();
  const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return '';
}
function exportExcel(){
  const ta = activeTahunAjaran();
  const kelasList = ta? kelasOfTahun(ta.id):[];
  const kelasIds = kelasList.map(k=>k.id);
  let list = db.siswa.filter(s=> isAdmin()? true : kelasIds.filter(id=>canAccessKelas(id)).includes(s.kelasId));
  const data = list.map(s=>{
    const k = db.kelas.find(x=>x.id===s.kelasId);
    return {
      "No Induk": s.noInduk, "Nama Lengkap": s.namaLengkap, "Tempat Lahir": s.tempatLahir,
      "Tanggal Lahir": s.tglLahir, "No Telepon Siswa": s.teleponSiswa, "Daerah": k? (daerahOf(k)?daerahOf(k).nama:''):'', "Kelas": k? (tingkatOf(k)?tingkatOf(k).nama:''):'',
      "Alamat Tinggal": s.alamatTinggal, "Asal Sekolah": s.asalSekolah,
      "Nama Ayah": s.namaAyah, "Telepon Ayah": s.teleponAyah, "Nama Ibu": s.namaIbu, "Telepon Ibu": s.teleponIbu,
      "Nama Wali Siswa": s.namaWali, "Telepon Wali Siswa": s.teleponWali,
      "Status Memohon Ketuhanan": s.statusKetuhanan, "Nama Vihara": s.namaVihara,
      "Nama Wali Kelas": s.waliKelasNama, "Telepon Wali Kelas": s.waliKelasTelepon, "Status": s.status
    };
  });
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Data Siswa");
  XLSX.writeFile(wb, `data-siswa-${ta?ta.nama.replace('/','-'):'export'}.xlsx`);
}

/* ======================= ABSENSI ======================= */
let absensiFilterKelas = '';
function jadwalOfTahun(taId){ return db.jadwalPertemuan.filter(j=>j.tahunAjaranId===taId).sort((a,b)=>a.tanggal.localeCompare(b.tanggal)); }
function renderAbsensi(){
  const ta = activeTahunAjaran();
  const kelasList = (ta? kelasOfTahun(ta.id):[]).filter(k=>canAccessKelas(k.id));
  if(!absensiFilterKelas && kelasList.length) absensiFilterKelas = kelasList[0].id;
  const jadwal = ta? jadwalOfTahun(ta.id):[];
  const jadwalRows = jadwal.map(j=>`
    <tr><td>${fmtDate(j.tanggal)}</td>
      <td>${j.libur? '<span class="badge nonaktif">Libur</span>' : '<span class="badge aktif">Masuk</span>'}</td>
      <td>${esc(j.keterangan||'—')}</td>
      <td>${isAdmin()? `<button class="btn-danger btn-small" onclick="hapusJadwal('${j.id}')">Hapus</button>` : ''}</td></tr>`).join('');
  const jadwalMasuk = jadwal.filter(j=>!j.libur);
  const isiRows = jadwalMasuk.map(j=>`
    <tr><td>${fmtDate(j.tanggal)}</td><td>${esc(j.keterangan||'—')}</td>
      <td><button class="btn-outline btn-small" onclick="bukaAbsen('${absensiFilterKelas}','${j.tanggal}')" ${absensiFilterKelas?'':'disabled'}>Isi absen</button></td></tr>`).join('');
  return `
    <h2>Absensi</h2>
    <p class="subtitle">${isAdmin()? 'Kalender pertemuan berlaku untuk <strong>semua kelas</strong> dalam satu tahun ajaran. Guru mengisi kehadiran siswanya sendiri pada tanggal yang sudah tersedia.' : 'Isi kehadiran siswa pada tanggal pertemuan yang sudah diatur Admin.'}</p>

    ${isAdmin()? `
    <div class="toolbar"><h3 style="margin:0">Kalender Pertemuan — ${ta?esc(ta.nama):'—'}</h3>
      <button class="btn-sun" onclick="formJadwal()">+ Tambah tanggal</button></div>
    ${jadwal.length? `<div style="overflow-x:auto"><table><thead><tr><th>Tanggal</th><th>Status</th><th>Keterangan</th><th></th></tr></thead><tbody>${jadwalRows}</tbody></table></div>`
    : `<div class="empty">Belum ada tanggal pertemuan untuk tahun ajaran ini.</div>`}
    ` : ''}

    <div class="toolbar" style="margin-top:28px"><h3 style="margin:0">Isi Kehadiran per Kelas</h3></div>
    <div class="field" style="max-width:320px"><label>Pilih kelas</label>
      <select onchange="absensiFilterKelas=this.value; renderContent()">
        ${kelasList.map(k=>`<option value="${k.id}" ${k.id===absensiFilterKelas?'selected':''}>${esc(kelasLabel(k))}</option>`).join('')}
      </select>
    </div>
    ${jadwalMasuk.length? `<div style="overflow-x:auto"><table><thead><tr><th>Tanggal</th><th>Keterangan</th><th></th></tr></thead><tbody>${isiRows}</tbody></table></div>`
    : `<div class="empty">Belum ada tanggal pertemuan (bukan libur) di kalender.</div>`}
  `;
}
function formJadwal(){
  if(!isAdmin()) return toast('Hanya Admin yang dapat mengatur tanggal pertemuan');
  const ta = activeTahunAjaran();
  if(!ta) return toast('Buat tahun ajaran aktif terlebih dahulu');
  openModal(`<h3>Tambah Tanggal Pertemuan</h3>
    <p class="subtitle" style="margin-top:-6px">Berlaku untuk semua kelas di tahun ajaran ${esc(ta.nama)}</p>
    <div class="field"><label>Tanggal</label><input id="fJTgl" type="date"></div>

function simpanJadwal(){

  if(db.jadwalPertemuan.some(j=>j.tahunAjaranId===ta.id && j.tanggal===tanggal)) return toast('Tanggal ini sudah ada di kalender');
  db.jadwalPertemuan.push({id:uid(), tahunAjaranId:ta.id, tanggal, libur:document.getElementById('fJLibur').checked, keterangan:document.getElementById('fJKet').value.trim()});

function hapusJadwal(id){
  if(!isAdmin()) return toast('Hanya Admin yang dapat mengatur tanggal pertemuan');

  const j = db.jadwalPertemuan.find(x=>x.id===id);
  db.jadwalPertemuan = db.jadwalPertemuan.filter(x=>x.id!==id);

function bukaAbsen(kelasId, tanggal){

function setAbsen(siswaId, kelasId, tanggal, status){

function setKeteranganAbsen(siswaId, kelasId, tanggal, keterangan){

}
