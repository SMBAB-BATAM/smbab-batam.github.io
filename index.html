<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sekolah Minggu Buddhis Web</title>
<link rel="icon" id="favicon" href="data:,">
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF2FB; --sky-deep:#2C4770; --sky-mid:#4E6E96; --paper:#FFFFFF;
    --ink:#1F2A3C; --ink-soft:#5B6B82; --sun:#F4B942; --sun-deep:#D99A1F;
    --coral:#EF767A; --leaf:#6FAE8A; --line:#DCE6F2; --radius:14px; --input-bg:#fbfdff; --hover-bg:#f7fafd; --heading:#2C4770;
  }
  body.theme-dark{
    --sky:#101722; --sky-deep:#0B111A; --sky-mid:#8CA3C2; --paper:#1B2432;
    --ink:#E8EDF5; --ink-soft:#9CACC4; --sun:#F4B942; --sun-deep:#D99A1F;
    --coral:#F1878B; --leaf:#7FC29A; --line:#2C384A; --input-bg:#232F40; --hover-bg:#212B3A; --heading:#EAF2FB;
  }
  body.theme-pink{
    --sky:#FFF0F5; --sky-deep:#B23A6B; --sky-mid:#C9769B; --paper:#FFFFFF;
    --ink:#3A2233; --ink-soft:#8C6478; --sun:#F4B942; --sun-deep:#D99A1F;
    --coral:#EF767A; --leaf:#6FAE8A; --line:#F3D6E3; --input-bg:#FFF8FB; --hover-bg:#FFF0F6; --heading:#B23A6B;
  }
  body.theme-kuning{
    --sky:#FFFBEA; --sky-deep:#B98900; --sky-mid:#D9A521; --paper:#FFFFFF;
    --ink:#4A3B12; --ink-soft:#8C7530; --sun:#F4B942; --sun-deep:#D99A1F;
    --coral:#E4572E; --leaf:#6FAE8A; --line:#F5E6B8; --input-bg:#FFFDF2; --hover-bg:#FFF6D9; --heading:#B98900;
  }
  body.theme-purple{
    --sky:#F5F0FF; --sky-deep:#6B3FA0; --sky-mid:#9B7BC4; --paper:#FFFFFF;
    --ink:#2E2140; --ink-soft:#7A6B94; --sun:#F4B942; --sun-deep:#D99A1F;
    --coral:#EF767A; --leaf:#6FAE8A; --line:#E4D9F5; --input-bg:#FBF8FF; --hover-bg:#F3EBFF; --heading:#6B3FA0;
  }
  body.theme-green{
    --sky:#EFFAF1; --sky-deep:#2F7A4F; --sky-mid:#5B9E77; --paper:#FFFFFF;
    --ink:#1F3A2A; --ink-soft:#5B7A68; --sun:#F4B942; --sun-deep:#D99A1F;
    --coral:#EF767A; --leaf:#4C8C4A; --line:#D7EEDD; --input-bg:#F7FCF8; --hover-bg:#EAF8EE; --heading:#2F7A4F;
  }
  .theme-picker{position:relative;display:inline-block;}
  .theme-menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;display:none;z-index:60;min-width:150px;}
  .theme-menu.show{display:block;}
  .theme-menu button{display:flex;align-items:center;gap:8px;width:100%;background:transparent;color:var(--ink);border-radius:8px;padding:8px 10px;font-weight:500;text-align:left;}
  .theme-menu button:hover{background:var(--hover-bg);}
  .theme-swatch{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.1);}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--sky);color:var(--ink);transition:background .2s,color .2s;}
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
  a{color:inherit;}
  .topbar{background:var(--sky-deep);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:50;}
  .brand{display:flex;align-items:center;gap:10px;}
    .brand-badge{width:40px;height:40px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
  .brand-badge img{width:100%;height:100%;object-fit:contain;}
  .brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px;}
  .brand span{display:block;font-size:11px;font-weight:400;opacity:.75;font-family:'Inter';}
  .drive-status{display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--coral);display:inline-block;}
  .dot.on{background:var(--leaf);}
  button{font-family:'Inter';font-weight:600;font-size:13px;border:none;border-radius:10px;padding:9px 16px;cursor:pointer;transition:transform .12s ease;}
  button:active{transform:scale(.97);}
  .btn-sun{background:var(--sun);color:#3A2A00;}
  .btn-sun:hover{background:var(--sun-deep);}
  .btn-ghost{background:rgba(255,255,255,.14);color:#fff;}
  .btn-ghost:hover{background:rgba(255,255,255,.24);}
  .btn-outline{background:var(--paper);color:var(--heading);border:1.5px solid var(--line);}
  .btn-outline:hover{border-color:var(--sky-mid);}
  .btn-danger{background:var(--paper);color:var(--coral);border:1.5px solid #f6cccd;}
  .btn-danger:hover{background:#fff5f5;}
  .btn-small{padding:6px 10px;font-size:12px;border-radius:8px;}
  .app-shell{max-width:1900px;width:100%;margin:0 auto;padding:18px clamp(16px,3vw,40px) 60px;display:flex;gap:18px;align-items:flex-start;box-sizing:border-box;}
  .sidebar{width:200px;flex-shrink:0;display:flex;flex-direction:column;gap:3px;position:sticky;top:88px;max-height:calc(100vh - 108px);overflow-y:auto;}
  .tab{font-family:'Baloo 2';font-weight:600;font-size:14px;padding:10px 14px;border-radius:10px;background:transparent;color:var(--sky-mid);cursor:pointer;white-space:nowrap;border:1px solid transparent;text-align:left;}
  .tab.active{background:var(--paper);color:var(--heading);border-color:var(--line);box-shadow:0 2px 8px rgba(44,71,112,.06);}
  main{flex:1;min-width:0;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:0 4px 18px rgba(44,71,112,.05);}
  .card h2{margin:0 0 4px;font-size:22px;color:var(--heading);}
  .subtitle{color:var(--ink-soft);font-size:13.5px;margin:0 0 20px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  input,select,textarea{font-family:'Inter';font-size:13.5px;padding:9px 11px;border-radius:9px;border:1.5px solid var(--line);background:var(--input-bg);color:var(--ink);}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sky-mid);}
  label{font-size:12.5px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .field{margin-bottom:12px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  @media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr;}}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:9px 8px;border-bottom:2px solid var(--line);}
  td{padding:9px 8px;border-bottom:1px solid var(--line);}
  tr:hover td{background:var(--hover-bg);}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .badge.aktif{background:#e3f3ea;color:#2f7a52;} .badge.lulus{background:#eaf0fb;color:var(--sky-deep);}
  .badge.pindah{background:#fdf1e0;color:var(--sun-deep);} .badge.nonaktif{background:#f5eaea;color:var(--coral);}
  .badge.admin{background:#e6eefb;color:var(--sky-deep);} .badge.guru{background:#e3f3ea;color:#2f7a52;}
  .rate{display:inline-block;min-width:30px;text-align:center;padding:2px 4px;border-radius:6px;font-weight:700;font-size:11.5px;}
  .rate.Hadir{background:#e3f3ea;color:#2f7a52;} .rate.Izin{background:#e6eefb;color:var(--sky-deep);}
  .rate.Sakit{background:#fdf1e0;color:var(--sun-deep);} .rate.Alpa{background:#f5eaea;color:var(--coral);}
  .empty{padding:40px 20px;text-align:center;color:var(--ink-soft);}
  .empty .display{font-size:17px;color:var(--heading);margin-bottom:6px;}
  .modal-bg{position:fixed;inset:0;background:rgba(31,42,60,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:var(--paper);border-radius:16px;padding:26px;max-width:520px;width:100%;max-height:85vh;overflow:auto;}
  .modal h3{margin:0 0 14px;color:var(--heading);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .setup-box{background:#fff8e8;color:#4a3b12;border:1.5px dashed var(--sun-deep);border-radius:12px;padding:18px 20px;margin-bottom:18px;font-size:13.5px;line-height:1.6;}
  .setup-box code{color:#4a3b12;}
  .setup-box code{background:#00000010;padding:2px 6px;border-radius:5px;font-size:12.5px;}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  @media(max-width:800px){.stat-grid{grid-template-columns:1fr 1fr;}}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .stat .num{font-family:'Baloo 2';font-size:26px;color:var(--heading);font-weight:700;}
  .stat .lbl{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1F2A3C;color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .gate{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .gate-card{background:var(--paper);border-radius:18px;padding:36px;max-width:400px;width:100%;box-shadow:0 10px 30px rgba(44,71,112,.12);}
  .gate-card h2{text-align:center;margin-bottom:4px;}
  .gate-card .subtitle{text-align:center;}
  .checkbox-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px;}
  .checkbox-grid label{display:flex;align-items:center;gap:6px;font-weight:400;color:var(--ink);font-size:13px;}
  .print-only{display:none;}

  /* ---- Beranda ---- */
  .stat-note{font-size:11.5px;color:var(--ink-soft);margin-top:6px;border-top:1px dashed var(--line);padding-top:6px;}
  .dash-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:12px;margin-bottom:18px;overflow:hidden;}
  .dash-strip > div{padding:12px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px;background:var(--hover-bg);}
  .dash-strip > div:last-child{border-right:none;}
  .dash-strip span{font-size:11.5px;color:var(--ink-soft);}
  .dash-strip strong{font-size:14.5px;color:var(--heading);}
  .dash-strip em{font-style:normal;font-size:12px;color:var(--ink-soft);}
  .dash-strip button{align-self:flex-start;margin-top:3px;}
  .dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media(max-width:1200px){.dash-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:800px){.dash-grid,.dash-strip{grid-template-columns:1fr;} .dash-strip > div{border-right:none;border-bottom:1px solid var(--line);}}
  .dash-panel{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--paper);}
  .dash-h{font-family:'Baloo 2';font-weight:700;font-size:16px;color:var(--heading);line-height:1.2;}
  .dash-sub{font-size:12px;color:var(--ink-soft);margin:2px 0 12px;}
  .dash-empty{font-size:13px;color:var(--ink-soft);padding:8px 0;}
  .meter{margin-bottom:11px;}
  .meter:last-child{margin-bottom:0;}
  .meter-top{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:4px;}
  .meter-lbl{color:var(--ink);}
  .meter-val{color:var(--ink-soft);white-space:nowrap;}
  .meter-val strong{color:var(--ink);}
  .meter-track{height:8px;border-radius:4px;background:var(--line);overflow:hidden;}
  .meter-fill{height:100%;border-radius:4px;background:var(--sky-mid);}
  .meter-fill.H{background:#4f9a73;} .meter-fill.I{background:#5b7fb5;} .meter-fill.S{background:#d9a13a;} .meter-fill.A{background:#d9666b;}
  .dash-pct.good{color:#2f7a52;font-weight:700;} .dash-pct.mid{color:var(--sun-deep);font-weight:700;} .dash-pct.low{color:var(--coral);font-weight:700;}

  /* ---- Laporan absensi per kelas (layar) ---- */
  .abs-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:2px 0 18px;}
  .abs-summary .stat{padding:14px 16px;position:relative;overflow:hidden;}
  .abs-summary .stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sky-mid);opacity:.55;}
  .abs-summary .stat.good::before{background:#2f7a52;opacity:1;} .abs-summary .stat.warn::before{background:var(--coral);opacity:1;}
  .abs-summary .num{font-size:23px;line-height:1.1;}
  .abs-summary .num small{font-size:13px;color:var(--ink-soft);font-weight:600;}
  @media(max-width:800px){.abs-summary{grid-template-columns:1fr 1fr;}}
  .abs-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .abs-chip{background:var(--hover-bg);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12.5px;color:var(--ink-soft);}
  .abs-chip strong{color:var(--ink);font-weight:600;}
  .abs-wrap{border:1px solid var(--line);border-radius:14px;overflow-x:auto;background:var(--paper);}
  .abs-table{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%;}
  .abs-table th,.abs-table td{padding:7px 4px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line);}
  .abs-table thead th{background:var(--hover-bg);color:var(--ink-soft);font-size:11px;text-transform:none;letter-spacing:0;border-bottom:1px solid var(--line);}
  .abs-table thead tr.m th{font-family:'Baloo 2';font-size:13px;color:var(--heading);padding-top:10px;text-transform:uppercase;letter-spacing:.04em;}
  .abs-table thead tr.d th{font-weight:600;color:var(--ink);font-size:12px;}
  .abs-table .ms{border-left:1px solid var(--line);}
  .abs-table th.fut{opacity:.4;}
  .abs-table .c-no{position:sticky;left:0;z-index:1;width:42px;min-width:42px;background:var(--paper);color:var(--ink-soft);}
  .abs-table .c-nama{position:sticky;left:42px;z-index:1;text-align:left;min-width:200px;padding-left:10px;padding-right:14px;background:var(--paper);box-shadow:inset -1px 0 0 var(--line);font-weight:600;}
  .abs-table thead .c-no,.abs-table thead .c-nama{background:var(--hover-bg);z-index:2;vertical-align:bottom;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);}
  .abs-table .c-induk{font-size:11px;color:var(--ink-soft);font-weight:400;margin-top:1px;}
  .abs-table tbody tr:last-child td{border-bottom:1px solid var(--line);}
  .abs-table tbody tr:hover td{background:var(--hover-bg);}
  .abs-cell{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;border-radius:7px;font-weight:700;font-size:11.5px;}
  .abs-cell.H{background:#e3f3ea;color:#2f7a52;} .abs-cell.I{background:#e6eefb;color:#2C4770;}
  .abs-cell.S{background:#fdf1e0;color:#b9800f;} .abs-cell.A{background:#fbe2e3;color:#c94a4f;}
  .abs-cell.kosong{color:var(--line);font-weight:400;}
  .abs-table .sum{font-weight:700;color:var(--ink);min-width:34px;}
  .abs-table td.sum{background:var(--hover-bg);}
  .abs-table .pct.good{color:#2f7a52;} .abs-table .pct.mid{color:var(--sun-deep);} .abs-table .pct.low{color:var(--coral);}
  .abs-table tfoot td{background:var(--hover-bg);font-weight:700;color:var(--heading);border-bottom:none;}
  .abs-table tfoot .c-foot{position:sticky;left:0;z-index:1;text-align:left;padding-left:12px;background:var(--hover-bg);box-shadow:inset -1px 0 0 var(--line);font-size:11.5px;letter-spacing:.03em;}
  .abs-legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:14px;font-size:12.5px;color:var(--ink-soft);}
  .abs-legend span{display:inline-flex;align-items:center;gap:6px;}
  .abs-legend .abs-cell{width:21px;height:21px;font-size:10.5px;}

  /* ---- Pengaturan logo kop ---- */
  .kop-setting{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border:1.5px dashed var(--line);border-radius:12px;margin-bottom:18px;}
  .kop-setting .info{flex:1;min-width:180px;font-size:13px;}
  .kop-setting .info div{font-size:12px;color:var(--ink-soft);}
  .kop-thumb{width:52px;height:52px;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
  .kop-thumb img{max-width:100%;max-height:100%;object-fit:contain;}

  /* ---- Kop surat & dokumen cetak ---- */
  .kop{display:flex;align-items:center;gap:14px;font-family:'Times New Roman',Times,serif;color:#000;}
  .kop-logo{width:96px;height:82px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .kop-logo img{max-width:100%;max-height:100%;object-fit:contain;}
  .kop-logo-ph{width:88px;height:72px;border:1.5px solid #000;border-radius:50%;position:relative;}
  .kop-logo-ph::after{content:'';position:absolute;width:8px;height:8px;border-radius:50%;background:#000;left:50%;top:50%;transform:translate(-50%,-50%);}
  .kop-text{flex:1;text-align:center;line-height:1.28;}
  .kop-1{font-size:16pt;font-weight:700;letter-spacing:.3px;}
  .kop-2{font-size:13pt;font-weight:700;}
  .kop-3{font-size:11pt;}
  .kop-4{font-size:10pt;}
  .kop-line{border-top:3px solid #000;border-bottom:1px solid #000;height:3px;margin:6px 0 14px;}
  .doc-title{text-align:center;font-family:'Times New Roman',Times,serif;font-weight:700;font-size:13pt;letter-spacing:.6px;text-decoration:underline;color:#000;margin:2px 0 2px;}
  .doc-sub{text-align:center;font-family:'Times New Roman',Times,serif;font-size:10.5pt;color:#000;margin-bottom:12px;}
  .doc-info{width:auto;font-family:'Times New Roman',Times,serif;font-size:10.5pt;color:#000;margin-bottom:10px;border-collapse:collapse;}
  .doc-info td{border:none !important;padding:1px 10px 1px 0;background:none !important;}
  .ttd{display:flex;justify-content:space-between;margin-top:22px;font-family:'Times New Roman',Times,serif;font-size:10.5pt;color:#000;page-break-inside:avoid;break-inside:avoid;}
  .ttd > div{width:40%;text-align:center;line-height:1.5;}
  .ttd .ttd-space{height:62px;}
  .ttd .ttd-nama{font-weight:700;text-decoration:underline;}
  .doc-legend{font-family:'Times New Roman',Times,serif;font-size:9.5pt;color:#000;margin-top:6px;}

  @media print{
    .topbar,.sidebar,.toolbar,button,.no-print{display:none !important;}
    body,body[class]{--paper:#fff;--ink:#000;--ink-soft:#333;--line:#bbb;--heading:#000;--hover-bg:#fff;background:#fff;color:#000;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .app-shell{padding:0;max-width:100%;display:block;}
    .card{box-shadow:none;border:none;border-radius:0;padding:0;} .print-only{display:block;}
    .abs-wrap{overflow:visible;border:none;border-radius:0;}
    .abs-table{font-size:8.5pt;width:100%;border-collapse:collapse;}
    .abs-table th,.abs-table td{border:0.6pt solid #555 !important;padding:2px 2px;position:static !important;background:#fff !important;box-shadow:none !important;color:#000;}
    .abs-table thead th{background:#e8ecf2 !important;color:#000 !important;font-weight:700;font-size:8.5pt;font-family:Arial,sans-serif;opacity:1 !important;}
    .abs-table,.abs-table *{font-family:Arial,Helvetica,sans-serif !important;}
    .abs-table .c-no{width:3%;min-width:0;}
    .abs-table .c-nama{width:24%;min-width:0;padding-left:5px;font-weight:400;white-space:normal;}
    .abs-table thead tr.m th{font-size:8pt;}
    .abs-table thead tr.d th,.abs-table td.dc{width:3%;}
    .abs-table .sum{min-width:0;width:3%;}
    .abs-table .c-induk{font-size:7pt;color:#333 !important;}
    .abs-table td.sum{background:#f3f3f3 !important;}
    .abs-cell{width:auto;height:auto;background:none !important;font-size:8.5pt;}
    .abs-cell.kosong{color:transparent;}
    .abs-table tfoot td{background:#e8ecf2 !important;}

  /* ======================= MODE TAMPILAN ======================= */
  #publicRoot{display:none;}

  /* ======================= HALAMAN PUBLIK ======================= */
  .pub-wrap{max-width:1180px;margin:0 auto;padding:0 24px;}

  .pub-nav-in{display:flex;align-items:center;gap:20px;height:66px;}
  .pub-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--heading);}
  .pub-brand-mark{width:44px;height:44px;border-radius:10px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--sun-deep);}
  .pub-brand-mark img{max-width:100%;max-height:100%;object-fit:contain;}

  .pub-links{display:flex;align-items:center;gap:4px;margin-left:auto;}

  .pub-burger{display:none;margin-left:auto;background:transparent;padding:8px;flex-direction:column;gap:4px;}
  .pub-burger span{display:block;width:22px;height:2px;background:var(--heading);border-radius:2px;}
  .pub-preview-bar{background:var(--sun);color:#3A2A00;text-align:center;font-size:13px;font-weight:600;padding:6px 12px;}

  .pub-hero{position:relative;overflow:hidden;background:#1E3557;color:#fff;padding:72px 0 76px;}
  .pub-hero-lotus{position:absolute;right:-90px;bottom:-110px;width:620px;height:560px;color:rgba(244,185,66,.13);pointer-events:none;}
  .pub-hero-in{position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.85fr);gap:56px;align-items:center;}
  .pub-hero h1{font-size:clamp(34px,4.6vw,54px);line-height:1.05;margin:0 0 14px;font-weight:800;letter-spacing:-.5px;color:#fff;}
  .pub-tagline{font-family:'Baloo 2';font-size:clamp(19px,2vw,23px);color:var(--sun);margin:0 0 14px;font-weight:600;line-height:1.3;}
  .pub-desc{font-size:16px;line-height:1.65;color:rgba(255,255,255,.82);max-width:58ch;margin:0 0 26px;}

  .pub-jadwal{margin:18px 0 0;font-size:14px;color:rgba(255,255,255,.75);padding-left:12px;border-left:3px solid var(--sun);}
  .pub-stats{display:flex;gap:34px;margin:30px 0 0;padding-top:22px;border-top:1px solid rgba(255,255,255,.14);flex-wrap:wrap;}
  .pub-stats div{display:flex;flex-direction:column-reverse;}
  .pub-stats dt{font-size:12.5px;color:rgba(255,255,255,.65);}
  .pub-stats dd{margin:0;font-family:'Baloo 2';font-size:28px;font-weight:700;line-height:1.1;color:#fff;}
  .pub-login-card{background:var(--paper);color:var(--ink);border-radius:18px;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.28);}

  .pub-opt strong{font-family:'Baloo 2';font-size:17px;color:var(--heading);}
  .pub-opt span{font-weight:400;font-size:13px;color:var(--ink-soft);}
  .pub-opt:hover{border-color:var(--sun-deep);background:var(--paper);}
  .pub-login-foot{font-size:13.5px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:14px;}
  .pub-login-foot a{color:var(--heading);font-weight:600;}

  .pub-sec{padding:72px 0;background:var(--paper);}
  .pub-sec-alt{background:var(--sky);}
  .pub-sec-head{margin-bottom:28px;max-width:640px;}

  .news-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;}
  .news-card{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;}
  .news-card:hover h3{color:var(--sun-deep);}
  .news-card.feat{grid-column:1 / -1;flex-direction:row;}
  .news-card.feat .news-img{flex:1.2;aspect-ratio:auto;min-height:260px;}
  .news-card.feat .news-body{flex:1;padding:26px;}
  .news-card.feat h3{font-size:24px;}
  .news-img{aspect-ratio:16/9;background:var(--sky);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .news-img img{width:100%;height:100%;object-fit:cover;display:block;}
  .news-ph{width:72px;height:72px;color:var(--sky-mid);opacity:.5;}
  .news-body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .news-meta{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--ink-soft);flex-wrap:wrap;}
  .news-cat{color:var(--sun-deep);font-weight:700;}
  .news-pin{background:var(--sky);color:var(--heading);padding:1px 8px;border-radius:10px;font-weight:600;}
  .news-card h3{margin:0;font-size:19px;line-height:1.25;color:var(--heading);}
  .news-card p{margin:0;font-size:14px;line-height:1.6;color:var(--ink-soft);}
  .news-more{margin-top:auto;font-size:13px;font-weight:600;color:var(--heading);padding-top:6px;}
  .news-full img{width:100%;border-radius:10px;margin-bottom:14px;max-height:340px;object-fit:cover;}
  .news-full h3{font-size:24px;margin:6px 0 12px;line-height:1.2;}
  .news-isi p{line-height:1.7;margin:0 0 12px;max-width:68ch;}
  .pub-about{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:56px;align-items:start;}
  .pub-about-txt p{font-size:16px;line-height:1.75;margin:0 0 14px;max-width:66ch;}
  .pub-about-side{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px 22px;}
  .pub-about-side > div{padding:16px 0;border-bottom:1px solid var(--line);}
  .pub-about-side > div:last-child{border-bottom:none;}
  .pub-about-side h4{margin:0 0 4px;font-family:'Baloo 2';font-size:16px;color:var(--heading);}
  .pub-about-side p{margin:0;color:var(--ink-soft);font-size:14px;}
  .pub-about-side ul{margin:4px 0 0;padding-left:18px;color:var(--ink-soft);font-size:14px;line-height:1.7;}
  .pub-contact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--line);}
  .pub-ci{padding:18px 18px 18px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;}
  .pub-ci span{font-size:12.5px;color:var(--ink-soft);}
  .pub-ci strong,.pub-ci a{font-size:15px;font-weight:600;color:var(--ink);text-decoration:none;}
  .pub-ci a:hover{color:var(--sun-deep);text-decoration:underline;}
  .pub-map-btn{display:inline-block;margin-top:22px;text-decoration:none;}
  .pub-auth{min-height:calc(100vh - 66px - 90px);display:flex;align-items:center;justify-content:center;padding:40px 16px;background:var(--sky);}
  .pub-auth .gate{min-height:0;width:100%;}
  .pub-foot{background:#16273F;color:rgba(255,255,255,.7);font-size:13px;}
  .pub-foot-in{display:flex;justify-content:space-between;gap:20px;padding:24px;flex-wrap:wrap;line-height:1.6;}
  .pub-foot strong{color:#fff;font-family:'Baloo 2';font-size:15px;}
  .pub-foot-r{align-self:flex-end;}
  @media(max-width:960px){
    .pub-hero-in,.pub-about{grid-template-columns:1fr;gap:34px;}
    .news-grid{grid-template-columns:1fr 1fr;}
    .pub-contact{grid-template-columns:1fr 1fr;}
  }
  @media(max-width:760px){
    .pub-burger{display:flex;}
    .pub-links{display:none;position:absolute;left:0;right:0;top:66px;background:var(--paper);flex-direction:column;align-items:stretch;padding:10px 16px 16px;border-bottom:1px solid var(--line);box-shadow:0 12px 24px rgba(0,0,0,.08);}
    .pub-nav.open .pub-links{display:flex;}
    .pub-nav-actions{margin:8px 0 0;flex-direction:column;}
    .pub-hero{padding:44px 0 50px;}
    .news-grid,.pub-contact{grid-template-columns:1fr;}
    .news-card.feat{grid-column:auto;flex-direction:column;}
    .news-card.feat .news-img{min-height:0;aspect-ratio:16/9;}
    .pub-sec{padding:48px 0;}
    .pub-stats{gap:22px;}
  }

  /* ======================= KOMPONEN UMUM APP ======================= */
  .page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
  .page-head h2{margin:0 0 4px;}
  .page-head .subtitle{margin:0;}
  .seg{display:inline-flex;gap:4px;background:var(--hover-bg);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px;flex-wrap:wrap;}
  .seg button{background:transparent;color:var(--ink-soft);padding:8px 14px;border-radius:9px;font-weight:600;}
  .seg button.on{background:var(--paper);color:var(--heading);box-shadow:0 1px 4px rgba(44,71,112,.12);}
  .seg.mini{margin:0;}
  .seg.mini button{padding:6px 10px;font-size:12.5px;}
  .help{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .chk{display:flex !important;align-items:center;gap:8px;font-weight:500 !important;color:var(--ink) !important;font-size:13.5px !important;margin:6px 0;}
  .modal.wide{max-width:780px;}
  .ib{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;padding:0;border-radius:8px;background:transparent;color:var(--ink-soft);border:1px solid transparent;}
  .ib:hover{background:var(--hover-bg);color:var(--heading);border-color:var(--line);}
  .ib-danger:hover{color:var(--coral);}
  .ib:disabled{opacity:.35;cursor:default;}
  .pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;}
  .pill-ok{background:#e3f3ea;color:#2f7a52;} .pill-muted{background:var(--hover-bg);color:var(--ink-soft);border:1px solid var(--line);}

  /* ---- Pengaturan ---- */
  .set-card{border:1px solid var(--line);border-radius:14px;padding:22px;max-width:960px;}
  .set-h{font-size:16px;margin:20px 0 10px;color:var(--heading);display:flex;align-items:center;gap:10px;}
  .set-card > .set-h:first-child{margin-top:0;}
  .set-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
  .grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;}
  @media(max-width:800px){.grid5{grid-template-columns:1fr 1fr;}}
  .tot{font-family:'Inter';font-size:12px;font-weight:600;padding:2px 9px;border-radius:12px;}
  .tot.ok{background:#e3f3ea;color:#2f7a52;} .tot.bad{background:#fbe2e3;color:#c94a4f;}
  .gate-card input,.gate-card select,.gate-card textarea{width:100%;}
  .set-card .grid3{grid-template-columns:repeat(3,minmax(0,1fr));}
  .pred-row{display:flex;align-items:center;gap:6px;} .pred-row input:first-child{flex:1;min-width:0;} .pred-row input:last-child{width:62px;flex-shrink:0;}
  .pred-row span{font-size:12px;color:var(--ink-soft);}
  .set-preview{border:1px dashed var(--line);border-radius:12px;padding:16px 18px 4px;margin-top:8px;background:#fff;}
  .set-preview-lbl{font-size:11.5px;color:#888;margin-bottom:8px;}
  .news-admin{border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .na-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border-bottom:1px solid var(--line);}
  .na-row:last-child{border-bottom:none;}
  .na-img{width:84px;height:54px;border-radius:8px;overflow:hidden;background:var(--sky);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .na-img img{width:100%;height:100%;object-fit:cover;} .na-ph{width:30px;height:30px;color:var(--sky-mid);opacity:.5;}
  .na-txt{flex:1;min-width:0;} .na-txt strong{display:block;color:var(--ink);}
  .na-meta{font-size:12.5px;color:var(--ink-soft);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .na-act{display:flex;gap:6px;}
  .nb-img-row{display:flex;gap:14px;align-items:center;}
  .nb-img{width:160px;height:96px;border-radius:10px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:12px;color:var(--ink-soft);}
  .nb-img img{width:100%;height:100%;object-fit:cover;}

  /* ---- Data siswa ---- */
  .dd{position:relative;}
  .dd > summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;padding:9px 16px;border-radius:10px;}
  .dd > summary::-webkit-details-marker{display:none;}
  .dd > summary::after{content:'';border:4px solid transparent;border-top-color:currentColor;margin-top:4px;}
  .dd-menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.14);padding:6px;z-index:20;min-width:210px;}
  .dd-menu button,.dd-menu label{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);font-weight:500;font-size:13px;padding:9px 12px;border-radius:8px;margin:0;cursor:pointer;}
  .dd-menu button:hover,.dd-menu label:hover{background:var(--hover-bg);}
  .sd-summary{display:flex;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden;flex-wrap:wrap;}
  .sd-summary > div{flex:1;min-width:180px;padding:12px 16px;border-right:1px solid var(--line);display:flex;align-items:baseline;gap:8px;background:var(--hover-bg);}
  .sd-summary > div:last-child{border-right:none;}
  .sd-summary strong{font-family:'Baloo 2';font-size:22px;color:var(--heading);}
  .sd-summary span{font-size:12.5px;color:var(--ink-soft);}
  .sd-filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .sd-filters input{flex:1;min-width:220px;}
  .sd-table-wrap{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:68vh;}
  .sd-table{font-size:13px;}
  .sd-table thead th{position:sticky;top:0;z-index:2;background:var(--hover-bg);text-transform:none;letter-spacing:0;font-size:12px;color:var(--ink-soft);border-bottom:1px solid var(--line);white-space:nowrap;padding:10px;}
  .sd-table td{padding:9px 10px;vertical-align:middle;}
  .sd-table tbody tr:last-child td{border-bottom:none;}
  .sd-no{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-weight:600;white-space:nowrap;}
  .sd-name{display:flex;align-items:center;gap:10px;background:transparent;padding:0;text-align:left;color:var(--ink);font-weight:400;border-radius:8px;}
  .sd-name strong{display:block;font-size:13.5px;white-space:nowrap;}
  .sd-name:hover strong{color:var(--sky-mid);text-decoration:underline;}
  .sd-name small,.sd-sub{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:400;}
  .sd-av{width:34px;height:34px;border-radius:50%;background:var(--sky);color:var(--heading);display:inline-flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:700;font-size:13px;flex-shrink:0;}
  .sd-av.lg{width:52px;height:52px;font-size:19px;}
  .sd-k{font-weight:600;white-space:nowrap;}
  .sd-wrap{max-width:180px;}
  .sd-pay{white-space:nowrap;}
  .sd-act{white-space:nowrap;text-align:right;}
  .sw{position:relative;display:inline-block;width:34px;height:20px;margin:0;vertical-align:middle;cursor:pointer;}
  .sw input{opacity:0;width:0;height:0;position:absolute;}
  .sw span{position:absolute;inset:0;background:var(--line);border-radius:20px;transition:background .15s;}
  .sw span::after{content:'';position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .sw input:checked + span{background:#4f9a73;} .sw input:checked + span::after{transform:translateX(14px);}
  .sw input:focus-visible + span{outline:2px solid var(--sun-deep);outline-offset:2px;}
  .sw.dis{opacity:.5;cursor:default;}
  .sd-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;font-size:12.5px;color:var(--ink-soft);flex-wrap:wrap;}
  .pager{display:flex;gap:4px;align-items:center;}
  .pg{background:transparent;color:var(--ink-soft);padding:6px 10px;border-radius:8px;}
  .pg.on{background:var(--sky-deep);color:#fff;} .pg-gap{color:var(--ink-soft);padding:0 2px;}
  .sd-detail-head{display:flex;align-items:center;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:6px;}
  .sd-detail{display:grid;grid-template-columns:1fr 1fr;gap:4px 26px;}
  @media(max-width:700px){.sd-detail{grid-template-columns:1fr;}}
  .sd-detail h4{font-family:'Baloo 2';font-size:15px;margin:14px 0 6px;color:var(--heading);}
  .sd-detail dl{margin:0;}
  .dl-row{display:grid;grid-template-columns:132px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .dl-row dt{color:var(--ink-soft);} .dl-row dd{margin:0;color:var(--ink);}

  /* ---- Penilaian ---- */
  .pn-controls{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px;}
  .pn-controls .field{margin:0;min-width:220px;}
  .pn-controls select{width:100%;}
  .pn-meta{display:flex;gap:16px;font-size:13px;color:var(--ink-soft);padding-bottom:10px;margin-left:auto;}
  .pn-meta strong{color:var(--ink);}
  .sheet-tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto;}
  .sheet-tabs button{background:transparent;color:var(--ink-soft);border-radius:8px 8px 0 0;padding:9px 14px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px;}
  .sheet-tabs button.on{color:var(--heading);border-bottom-color:var(--sun-deep);background:var(--hover-bg);}
  .sheet-title{font-family:'Baloo 2';font-weight:700;font-size:16px;color:var(--heading);margin-bottom:10px;}
  .sheet-wrap{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:66vh;}
  .sheet{font-size:13px;border-collapse:separate;border-spacing:0;}

  .sheet.narrow{width:100%;}
  .col-h{text-align:center;}
  .col-name{background:transparent;color:var(--heading);padding:2px 6px;font-size:12px;border-radius:6px;border:1px dashed transparent;}

  .col-x{background:transparent;color:var(--ink-soft);padding:0 4px;font-size:15px;line-height:1;}

  .sheet-actions{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap;}
  .sheet-note{font-size:12.5px;color:var(--ink-soft);margin:10px 0;}
  .sheet-note a{color:var(--heading);font-weight:600;}
  .warn-txt{color:var(--coral) !important;}
  .pred{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;}
  .pred.pr-a{background:#e3f3ea;color:#2f7a52;} .pred.pr-b{background:#e6eefb;color:#2C4770;} .pred.pr-c{background:#fdf1e0;color:#a8730c;}
  .pred.soft{opacity:.55;}
  .tp-seg .n{display:inline-block;min-width:18px;padding:0 6px;border-radius:10px;background:var(--hover-bg);border:1px solid var(--line);font-size:11px;margin-left:6px;color:var(--ink-soft);}
  .tp-seg button.on .n{background:var(--sky-deep);color:#fff;border-color:var(--sky-deep);}
  .tp-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start;}
  @media(max-width:1000px){.tp-grid{grid-template-columns:1fr;}}
  .tp-list{border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .tp-row{display:flex;gap:14px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);}
  .tp-code{flex-shrink:0;font-weight:700;font-size:12px;color:#fff;background:var(--sky-deep);border-radius:7px;padding:3px 8px;margin-top:1px;white-space:nowrap;}

  .tp-empty{padding:16px;color:var(--ink-soft);font-size:13.5px;border-bottom:1px solid var(--line);}
  .tp-add{display:flex;gap:8px;padding:12px 14px;background:var(--hover-bg);}
  .tp-add input{flex:1;min-width:0;}
  .tp-side{border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13px;}
  .tp-side h4{margin:0 0 6px;font-family:'Baloo 2';font-size:15px;color:var(--heading);}
  .cap-t td.cap{text-align:center;padding:4px;}
  .chip{display:inline-flex;align-items:center;justify-content:center;width:32px;height:30px;padding:0;border-radius:8px;font-weight:700;font-size:13px;border:1.5px solid var(--line);color:var(--ink-soft);background:var(--paper);cursor:pointer;}
  span.chip{cursor:default;}
  .chip.ok{background:#e3f3ea;border-color:#9fd1b3;color:#2f7a52;}
  .chip.bb{background:#fdf1e0;border-color:#efcf95;color:#a8730c;}
  .legend-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);margin:10px 0 0;}
  .legend-row > span{display:inline-flex;align-items:center;gap:6px;}
  .legend-row .chip{width:24px;height:22px;font-size:11px;}
  .rp-tp td{font-size:10pt;}
  .sheet th.grp-h{border-bottom:1px solid var(--line);color:var(--heading);}
  .sheet.rekap thead tr:nth-child(2) th{top:33px;}
  .bobot-t td.inp input{width:62px;}
  .lap-controls .seg.mini{flex-wrap:wrap;}
  .pn-formula{margin-top:18px;padding:12px 16px;border-left:3px solid var(--sun);background:var(--hover-bg);border-radius:0 10px 10px 0;font-size:12.5px;color:var(--ink-soft);line-height:1.8;}

  /* ---- Laporan per siswa (rapor) ---- */

  .lap-nav{display:flex;gap:4px;align-items:center;} .lap-nav select{flex:1;min-width:0;}
  .lap-nav .ib{font-size:20px;border-color:var(--line);background:var(--paper);height:38px;width:34px;}
  .paper-stage{background:#e9eef5;border-radius:12px;padding:28px 12px;overflow-x:auto;}
  body.theme-dark .paper-stage{background:#0f1520;}
  .paper{background:#fff;color:#000;width:794px;max-width:100%;margin:0 auto;padding:44px 52px 52px;box-shadow:0 8px 30px rgba(31,42,60,.16);border-radius:2px;font-family:'Times New Roman',Times,serif;}
  .paper .doc-title{margin-top:8px;}
  .rp-ident{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px;margin:6px 0 16px;font-size:11pt;}
  .rp-ident table{border-collapse:collapse;width:100%;}
  .rp-ident td{border:none;padding:2px 0;color:#000;vertical-align:top;background:none !important;}
  .rp-ident .id-l{width:118px;} .rp-ident .id-s{width:12px;}
  .rp-h{font-weight:700;font-size:11pt;margin:16px 0 6px;color:#000;}
  .rp-t{width:100%;border-collapse:collapse;font-size:10.5pt;color:#000;}
  .rp-t th,.rp-t td{border:0.75pt solid #333;padding:5px 7px;color:#000;background:none;}
  .rp-t th{background:#eef1f5 !important;font-weight:700;text-transform:none;letter-spacing:0;font-size:10pt;text-align:center;}
  .rp-t tr:hover td{background:none;}
  .rp-t .c{text-align:center;}
  .rp-t tfoot td{font-weight:700;background:#eef1f5;}
  .rp-big{font-size:13pt;}
  .rp-rinci{font-size:8.5pt;color:#444;margin-top:2px;}
  .rp-rinci-inline{font-size:9pt;color:#444;}
  .rp-pred{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:11pt;flex-wrap:wrap;}
  .rp-pred strong{border:1.5px solid #000;padding:3px 16px;font-size:12pt;}
  .rp-pred em{font-size:9.5pt;color:#9a2b2b;font-style:italic;}
  .rp-cols{display:grid;grid-template-columns:1fr 1.15fr;gap:22px;align-items:start;}
  .rp-note{width:100%;min-height:84px;font-family:inherit;font-size:10.5pt;border:1px dashed #9aa7b8;background:#fbfcfe;color:#000;border-radius:4px;}
  .rp-note-print{border:0.75pt solid #333;min-height:70px;padding:8px;font-size:10.5pt;}
  .ttd3{display:grid;grid-template-columns:1fr 1fr;gap:10px 40px;margin-top:28px;font-size:10.5pt;text-align:center;line-height:1.5;color:#000;break-inside:avoid;page-break-inside:avoid;}
  .ttd3 .ttd-full{grid-column:1 / -1;}
    .ttd3 .ttd-space{height:58px;}

  .ttd-sig img{max-height:66px;max-width:190px;object-fit:contain;}
  .sig-box{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border:1.5px dashed var(--line);border-radius:12px;padding:14px 16px;max-width:620px;}
  .sig-prev{width:220px;height:90px;border-radius:8px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;color:#999;font-size:12px;}
  .sig-prev img{max-width:100%;max-height:100%;object-fit:contain;}
  .ttd3 .ttd-nama{font-weight:700;text-decoration:underline;}
  @media(max-width:860px){ .paper{padding:24px 18px;} .rp-ident,.rp-cols{grid-template-columns:1fr;} }
  .portal-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;}

  @media print{
    #publicRoot{display:none !important;}
    .paper-stage{background:none;padding:0;border-radius:0;}
    .paper{box-shadow:none;width:auto;padding:0;margin:0;}
    .rp-ident,.rp-cols{grid-template-columns:1fr 1fr !important;}
  }

  /* ======================= LOADING (tanpa kartu) ======================= */
  .page-loader{position:fixed;top:0;left:0;right:0;height:3px;overflow:hidden;z-index:100;background:transparent;}
  .page-loader::before{content:'';position:absolute;top:0;bottom:0;width:35%;background:var(--sun-deep);animation:pl 1.1s ease-in-out infinite;}
  @keyframes pl{0%{left:-35%}100%{left:100%}}
  @media (prefers-reduced-motion: reduce){ .page-loader::before{animation:none;left:0;width:100%;opacity:.5;} }

  /* ======================= PEMBELAJARAN ======================= */
  .cnt{display:inline-block;min-width:18px;padding:0 6px;border-radius:10px;background:var(--coral);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;margin-left:4px;}
  .pb-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap;}

  .pb-row:last-child{border-bottom:none;}
  .pb-late .pb-date{border-color:var(--coral);}

  .pb-date strong{font-family:'Baloo 2';font-size:22px;color:var(--heading);}

  .pb-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .pb-done{display:flex !important;align-items:center;gap:6px;font-size:12.5px !important;color:var(--ink-soft) !important;font-weight:500 !important;margin:0 !important;white-space:nowrap;}

  .st-lewat{background:#fdf1e0;color:#a8730c;} .st-tutup{background:#fbe2e3;color:#c94a4f;}
  .mt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
  .mt-card{border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;background:var(--paper);}

  .mt-isi{font-size:13.5px;line-height:1.6;color:var(--ink);}

  .mt-act{display:flex;gap:6px;margin-top:auto;padding-top:6px;}
  .mt-read{display:flex;flex-direction:column;gap:14px;max-width:820px;}

  /* editor */
  .ed-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line);}
  .ed-title{flex:1;min-width:220px;}
  .ed-title h2{margin:0;font-size:22px;}
  .ed-warn{background:#fdf1e0;color:#7a5408;border:1px solid #f2d7a6;border-radius:10px;padding:10px 14px;font-size:13px;margin:0 0 14px;}
  .ed-grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start;}

  .kj-bar{position:sticky;top:66px;z-index:10;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px 12px;margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 6px 18px rgba(31,42,60,.08);}
  .kj-bar-l{display:flex;align-items:center;gap:12px;flex:1;min-width:0;}
  .kj-bar-l strong{display:block;color:var(--heading);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kj-bar-l span{font-size:12.5px;color:var(--ink-soft);}
  .kj-timer{font-size:12.5px;color:var(--ink-soft);background:var(--hover-bg);border:1px solid var(--line);border-radius:10px;padding:6px 12px;}
  .kj-timer b{font-family:'Baloo 2';font-size:20px;color:var(--heading);font-variant-numeric:tabular-nums;margin-left:4px;}
  .kj-timer.low{background:#fbe2e3;border-color:#f3c1c3;} .kj-timer.low b{color:#c94a4f;}
  .kj-prog{position:absolute;left:12px;right:12px;bottom:5px;height:3px;background:var(--line);border-radius:2px;overflow:hidden;}
  .kj-prog div{height:100%;background:#4f9a73;transition:width .2s;}
  .kj-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;max-width:860px;}
  .kj-q{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--paper);}
  .kj-q.done{border-color:#bfe0cc;}
  .kj-qh{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  .kj-q.done .kj-qh span:first-child{color:#2f7a52;}
  .kj-teks{font-size:15px;line-height:1.6;color:var(--ink);margin-bottom:12px;}
  .kj-opts{display:flex;flex-direction:column;gap:8px;}
  .kj-bs{flex-direction:row;} .kj-bs .kj-opt{flex:1;justify-content:center;}
  .kj-opt{display:flex !important;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;margin:0 !important;font-weight:400 !important;font-size:14px !important;color:var(--ink) !important;}
  .kj-opt:hover{border-color:var(--sky-mid);}
  .kj-opt input{position:absolute;opacity:0;width:0;height:0;}
  .kj-opt:has(input:checked){border-color:var(--sky-deep);background:var(--sky);}
  .kj-opt:has(input:focus-visible){outline:2px solid var(--sun-deep);outline-offset:2px;}
  .kj-l{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;color:var(--ink-soft);}
  .kj-opt:has(input:checked) .kj-l{background:var(--sky-deep);border-color:var(--sky-deep);color:#fff;}
  .kj-in{width:100%;font-size:14.5px;}
  .kj-submit{display:flex;justify-content:flex-end;align-items:center;gap:14px;max-width:860px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
  .kj-submit .btn-sun{padding:12px 24px;font-size:15px;}
  .kj-done{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
  .kj-done h2{margin:0;}
  .kj-check{width:46px;height:46px;border-radius:50%;background:#e3f3ea;color:#2f7a52;display:inline-flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0;}
  .kj-score{display:flex;align-items:baseline;gap:12px;border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;max-width:860px;}
  .kj-score strong{font-family:'Baloo 2';font-size:44px;line-height:1;color:var(--heading);}
  .kj-score span{font-size:13.5px;color:var(--ink-soft);}
  .kj-pemb{font-size:13px;color:var(--ink-soft);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
  @media(max-width:700px){
    body.kerja .topbar{position:static;} body.kerja .kj-bar{top:0;border-radius:0 0 12px 12px;} .kj-bar-l strong{max-width:52vw;}
    .kj-intro{padding:20px;} .pb-row{flex-wrap:wrap;} .pb-done{order:3;}
    .ts-card{flex-direction:column;align-items:flex-start;} .ts-r{width:100%;justify-content:space-between;}
    .kartu-grid{grid-template-columns:1fr;}
  }
  @media print{ .kartu-grid{grid-template-columns:1fr 1fr !important;} #toast,.toast{display:none !important;} }
  .kj-q.pk-ok,.kj-q.pk-no{border-left-width:4px;}

  /* ======================= STATUS ONLINE ======================= */
  .on-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#aab4c3;flex-shrink:0;vertical-align:middle;}
  .on-dot.on{background:#3fb36f;box-shadow:0 0 0 2px rgba(63,179,111,.22);}
  .rt-chip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:600;}
  .rt-chip:hover{background:rgba(255,255,255,.2);}
  .dash-online{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 16px;font-size:13.5px;}
  .dash-online strong{color:var(--heading);}
  .dash-online > span:not(.on-dot){color:var(--ink-soft);padding-left:12px;border-left:1px solid var(--line);}
  .dash-online .btn-small:first-of-type{margin-left:auto;}
  .on-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  @media(max-width:700px){.on-cols{grid-template-columns:1fr;}}
  .on-cols h4{font-family:'Baloo 2';font-size:16px;margin:0 0 8px;color:var(--heading);}
  .on-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .on-nm{flex:1;min-width:0;color:var(--ink);}
  .on-scroll{max-height:46vh;overflow:auto;padding-right:4px;}
  .rt-steps{margin:0;padding-left:20px;line-height:1.9;font-size:13.5px;}
  .rt-steps code{background:var(--hover-bg);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12.5px;}

  /* ======================= CHAT ======================= */
  .chat-fab{position:fixed;right:22px;bottom:22px;z-index:60;display:inline-flex;align-items:center;gap:8px;background:var(--sky-deep);color:#fff;border-radius:28px;padding:12px 18px;font-weight:700;font-size:14px;box-shadow:0 10px 26px rgba(31,42,60,.28);}
  .chat-fab:hover{filter:brightness(1.08);}
  .chat-fab .cnt{margin-left:0;}
  .chat-panel{position:fixed;right:18px;bottom:18px;z-index:60;width:380px;height:min(620px, calc(100vh - 100px));background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(31,42,60,.28);display:flex;flex-direction:column;overflow:hidden;}
  .cp-head{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line);}
  .cp-head > div strong{display:block;color:var(--heading);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cp-head > div:first-child{flex:1;}
  .cp-head small{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-soft);}
  .cp-search{padding:10px 12px;border-bottom:1px solid var(--line);}
  .cp-search input{width:100%;}
  .cp-list{flex:1;overflow:auto;}
  .cl-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border-radius:0;padding:10px 14px;color:var(--ink);font-weight:400;border-bottom:1px solid var(--line);}
  .cl-item:hover{background:var(--hover-bg);}
  .cl-av{position:relative;width:40px;height:40px;border-radius:50%;background:var(--sky);color:var(--heading);display:inline-flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:700;font-size:14px;flex-shrink:0;}
  .cl-av.grp{border-radius:12px;background:#fdf1e0;color:#a8730c;}
  .cl-av .on-dot{position:absolute;right:0;bottom:1px;border:2px solid var(--paper);width:12px;height:12px;box-shadow:none;}
  .cl-txt{flex:1;min-width:0;display:flex;flex-direction:column;}
  .cl-txt strong{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);}
  .cl-txt small{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cl-item.unread .cl-txt strong,.cl-item.unread .cl-txt small{color:var(--heading);font-weight:700;}
  .cl-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11.5px;color:var(--ink-soft);}
  .cp-msgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:3px;background:var(--hover-bg);}
  .cm-empty{margin:auto;color:var(--ink-soft);font-size:13px;text-align:center;padding:20px;}
  .cm-day{align-self:center;font-size:11.5px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:2px 10px;margin:10px 0 6px;}
  .cm{display:flex;flex-direction:column;align-items:flex-start;max-width:82%;margin-top:3px;}
  .cm.mine{align-self:flex-end;align-items:flex-end;}
  .cm-n{font-size:11.5px;font-weight:700;color:var(--sun-deep);margin:6px 0 2px 4px;}
  .cm-b{background:var(--paper);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:7px 11px 5px;font-size:14px;line-height:1.45;color:var(--ink);word-wrap:break-word;overflow-wrap:anywhere;}
  .cm.mine .cm-b{background:var(--sky-deep);border-color:var(--sky-deep);color:#fff;border-radius:14px 14px 4px 14px;}
  .cm-b time{display:block;text-align:right;font-size:10.5px;opacity:.65;margin-top:2px;}
  .cm.mine .cm-b time a{color:#fff;}
  .cm.pending{opacity:.65;} .cm.fail .cm-b{background:#fbe2e3;border-color:#f3c1c3;color:#7a2a2d;}
  .cp-input{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--paper);}
  .cp-input textarea{flex:1;resize:none;min-height:40px;max-height:110px;font-size:14px;}
  .cp-input .btn-sun{padding:10px 16px;}
  @media(max-width:700px){
    .chat-panel{inset:0;width:auto;height:auto;border-radius:0;right:0;bottom:0;}
    .chat-fab{right:14px;bottom:14px;}
    body.kerja .chat-fab{display:none;}
  }
  @media print{ #chatRoot,.chat-fab,.chat-panel,#rtChip{display:none !important;} }
</style>
</head>

// Membaca foto (termasuk foto HP 10+ MB) tanpa membuat browser macet:
// decode di luar thread utama bila didukung, langsung diperkecil ke ukuran yang dibutuhkan.
const GAMBAR_OK = /\.(jpe?g|png|webp)$/i;
function cekFileGambar(f){
  if(!f) return false;
  if(!(/^image\/(jpeg|png|webp)$/.test(f.type) || GAMBAR_OK.test(f.name||''))){ toast('Gunakan foto JPG, PNG, atau WEBP'); return false; }
  if(f.size > 25*1024*1024){ toast('Ukuran foto terlalu besar (maks. 25 MB)'); return false; }
  return true;
}
async function muatGambarFile(f, maxW, maxH){
  let src, w, h, tutup = ()=>{};
  if(window.createImageBitmap){
    try{ src = await createImageBitmap(f, {imageOrientation:'from-image'}); w = src.width; h = src.height; tutup = ()=>src.close && src.close(); }catch(e){ src = null; }
  }
  if(!src){
    const url = URL.createObjectURL(f);
    src = await new Promise((ok, gagal)=>{ const im = new Image(); im.onload = ()=>ok(im); im.onerror = ()=>gagal(new Error('Gambar tidak bisa dibaca')); im.src = url; });
    w = src.naturalWidth; h = src.naturalHeight; tutup = ()=>URL.revokeObjectURL(url);
  }
  const sc = Math.min(1, maxW/w, maxH/h);
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w*sc)); c.height = Math.max(1, Math.round(h*sc));
  const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high'; ctx.drawImage(src, 0, 0, c.width, c.height);
  tutup();
  return c;
}
const jeda = ()=> new Promise(r=>setTimeout(r, 30)); // beri kesempatan layar menampilkan pesan "Memproses…"

function cetakLaporan(orientasi){
  let st = document.getElementById('printPageStyle');
  if(!st){ st = document.createElement('style'); st.id='printPageStyle'; document.head.appendChild(st); }
  st.textContent = `@page{size:A4 ${orientasi||'portrait'};margin:12mm 10mm;}`;
  window.print();
}
async function uploadLogoKop(input){
  if(!isAdmin()){ input.value=''; return toast('Hanya Admin yang dapat mengganti logo kop surat'); }
  const f = input.files[0]; input.value='';
  if(!cekFileGambar(f)) return;
  toast('Memproses logo…'); await jeda();
  try{
    const c = await muatGambarFile(f, 300, 300);   // perkecil supaya file data di Drive tetap ringan
    db.meta = db.meta || {};
    db.meta.kopLogo = c.toDataURL('image/png');
    renderContent(); saveToDrive(true); toast('Logo kop surat disimpan');
  }catch(e){ toast('Gambar tidak bisa dibaca — coba foto lain'); }
}
function hapusLogoKop(){
  if(!isAdmin()) return toast('Hanya Admin yang dapat menghapus logo kop surat');
  if(!confirm('Hapus logo kop surat?')) return;
  if(db.meta) delete db.meta.kopLogo;
  renderContent(); saveToDrive(true);
}

// Nama siswa: huruf kapital di awal setiap kata, sisanya huruf kecil ("JAYRICH LUK" / "bryan lie" -> "Jayrich Luk" / "Bryan Lie")
function kapitalNama(s){
  return String(s||'').replace(/\s+/g,' ').trim().toLocaleLowerCase('id-ID')
    .replace(/(^|[\s\-'.(\/])(\p{L})/gu, (m,a,b)=> a + b.toLocaleUpperCase('id-ID'));
}
// Rapikan nama siswa & pendaftar yang sudah tersimpan (dijalankan saat Admin masuk; hanya menyimpan bila ada yang berubah)
function rapikanNamaSiswa(){
  let n = 0;
  (db.siswa||[]).concat(db.pendaftaran||[]).forEach(x=>{
    if(!x || !x.namaLengkap) return;
    const baru = kapitalNama(x.namaLengkap);
    if(baru!==x.namaLengkap){ x.namaLengkap = baru; n++; }
  });
  if(n){ saveToDrive(true); toast(`${n} nama siswa dirapikan ke format huruf kapital di awal kata`); }
  return n;
}
function normTeks(s){ return (s||'').toString().trim().toLowerCase().replace(/\s+/g,' '); }
// Cocok bila Nama + Tempat Lahir + Tanggal Lahir sama (tidak peka huruf besar/kecil & spasi berlebih)
function cariDuplikatPendaftar(nama, tempatLahir, tglLahir){
  const n = normTeks(nama), t = normTeks(tempatLahir);
  const cocok = x => normTeks(x.namaLengkap)===n && normTeks(x.tempatLahir)===t && x.tglLahir===tglLahir;
  const s = db.siswa.find(cocok);
  if(s) return {jenis:'siswa', data:s};
  const p = db.pendaftaran.find(x=>x.status==='pending' && cocok(x));
  if(p) return {jenis:'pendaftaran', data:p};
  return null;
}

function applyTheme(name){
  document.body.classList.remove('theme-dark','theme-pink','theme-kuning','theme-purple','theme-green');
  if(name==='dark') document.body.classList.add('theme-dark');
  if(name==='pink') document.body.classList.add('theme-pink');
  if(name==='kuning') document.body.classList.add('theme-kuning');
  if(name==='purple') document.body.classList.add('theme-purple');
  if(name==='green') document.body.classList.add('theme-green');
}
function setTheme(name){
  applyTheme(name);
  try{ localStorage.setItem('smb_theme', name); }catch(e){}
  toggleThemeMenu(false);
}
function toggleThemeMenu(force){
  const m = document.getElementById('themeMenu');
  if(typeof force==='boolean'){ m.classList.toggle('show', force); return; }
  m.classList.toggle('show');
}
document.addEventListener('click', (e)=>{
  const picker = document.querySelector('.theme-picker');
  if(picker && !picker.contains(e.target)) toggleThemeMenu(false);
});
(function initTheme(){
  let saved = 'normal';
  try{ saved = localStorage.getItem('smb_theme') || 'normal'; }catch(e){}
  applyTheme(saved);
})();
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ======================= AKSES / ROLE ======================= */
function isAdmin(){ return currentUser && currentUser.role==='admin'; }
function accessibleKelasIds(){
  if(isAdmin()) return null; // null = semua
  if(currentUser && currentUser.lihatSemuaSiswa) return null; // guru diberi akses lihat semua oleh admin
  const ta = activeTahunAjaran();
  const own = db.kelas.filter(k=> ta && k.tahunAjaranId===ta.id && (k.guruId===currentUser.id || (k.guruAsistenIds||[]).includes(currentUser.id))).map(k=>k.id);
  const granted = currentUser.kelasAksesIds||[];
  return Array.from(new Set([...own, ...granted]));
}
function canAccessKelas(kelasId){ const ids = accessibleKelasIds(); return ids===null || ids.includes(kelasId); }

/* ======================= TABS ======================= */
function allTabs(){
  const t = [
    {key:"dashboard", label:"Beranda"},
    {key:"tahunajaran", label:"Tahun Ajaran"},
    {key:"kelas", label:"Kelas & Guru"},
    {key:"siswa", label:"Data Siswa"},
    {key:"absensi", label:"Absensi"},
    {key:"penilaian", label:"Penilaian"},
    {key:"pembelajaran", label:"Pembelajaran"+(()=>{ const ids=accessibleKelasIds(); const n=perluDinilaiCount(ids); return n? ` (${n})`:''; })()},
    {key:"kenaikan", label:"Kenaikan Kelas"},
    {key:"laporan", label:"Laporan"},
  ];
  if(isAdmin()){
    t.push({key:"pendaftaran", label:"Pendaftaran"+(pendingCount()? ` (${pendingCount()})`:'')});
    t.push({key:"kas", label:"Kas SMB"});
    t.push({key:"pengguna", label:"Pengguna"});
    t.push({key:"aktivitas", label:"Aktivitas Online"});
    t.push({key:"pengaturan", label:"Pengaturan Website"});
  }
  t.push({key:"profil", label:"Profil Saya"});
  if(!isAdmin()) return t.filter(x=>!['tahunajaran','kenaikan'].includes(x.key));
  return t;
}
function pendingCount(){ return db.pendaftaran.filter(p=>p.status==='pending').length; }
let activeTab = "dashboard";
function renderTabs(){
  const nav = document.getElementById('tabsNav');
  if(appStage!=='ready'){ nav.innerHTML=''; return; }
  nav.innerHTML = allTabs().map(t=>`<div class="tab ${t.key===activeTab?'active':''}" onclick="switchTab('${t.key}')">${t.label}</div>`).join('');
}
function switchTab(key){ activeTab=key; renderTabs(); renderContent(); }

function renderContent(){
  const c = document.getElementById('content');
  const isPublic = publicPreview || ['need-drive','need-admin-setup','need-login'].includes(appStage);
  document.body.classList.toggle('mode-public', isPublic);
  document.body.classList.toggle('no-sidebar', appStage==='siswa-portal');
  document.body.classList.toggle('kerja', kerjaAktif());
  if(!document.getElementById('chatPanel')) renderChatUI();
  if(isPublic){ renderPublic(); return; }
  document.getElementById('publicRoot').innerHTML = '';
  if(appStage==='siswa-portal'){ c.innerHTML = screenSiswaPortal(); return; }
  const renderers = {
    dashboard: renderDashboard, tahunajaran: renderTahunAjaran, kelas: renderKelas,
    siswa: renderSiswa, absensi: renderAbsensi, penilaian: renderPenilaian,
    kenaikan: renderKenaikan, laporan: renderLaporan, pengguna: renderPengguna,
    pendaftaran: renderPendaftaran, kas: renderKas, profil: renderProfil, pengaturan: renderPengaturan, pembelajaran: renderPembelajaran, aktivitas: renderAktivitas
  };
  if(!allTabs().some(t=>t.key===activeTab)) activeTab='dashboard';
  c.innerHTML = renderers[activeTab]();
  if(activeTab==='pengaturan' && setTab==='penilaian') cekTotalBobot();
}

/* ---------- Penilaian otomatis ---------- */
function dijawab(v){ return v!=null && String(v).trim()!==''; }
function poinOtomatis(soal, jwb){
  if(soal.tipe==='esai') return null;
  if(!dijawab(jwb)) return 0;
  const p = Number(soal.poin)||0;
  if(soal.tipe==='pg') return Number(jwb)===Number(soal.kunci)? p : 0;
  if(soal.tipe==='bs') return String(jwb)===String(soal.kunci)? p : 0;
  if(soal.tipe==='isian') return String(soal.kunci||'').split('|').map(normTeks).filter(Boolean).includes(normTeks(jwb))? p : 0;
  return 0;
}
function hitungSkor(t, p){
  let total=0, dapat=0, perluNilai=0;
  (t.soal||[]).forEach(s=>{
    total += Number(s.poin)||0;
    const j = (p.jawaban||{})[s.id];
    if(s.tipe==='esai'){
      const m = (p.nilaiManual||{})[s.id];
      if(m!=null && m!=='') dapat += Number(m);
      else if(dijawab(j)) perluNilai++;
    } else dapat += poinOtomatis(s, j);
  });
  return {total, dapat, skor: total? Math.round(dapat/total*1000)/10 : 0, perluNilai};
}
function nilaiUlangPengumpulan(t, p){
  const r = hitungSkor(t, p);
  p.skor = r.skor; p.dapat = r.dapat; p.total = r.total; p.perluNilai = r.perluNilai;
  p.status = r.perluNilai? 'dikumpulkan' : 'dinilai';
  return r;
}
function pengumpulanDari(tugasId, siswaId){ return db.pengumpulan.find(p=>p.tugasId===tugasId && p.siswaId===siswaId); }
function perluDinilaiCount(kelasIds){
  pbInit();
  const tIds = new Set(db.tugas.filter(t=>!kelasIds || kelasIds.includes(t.kelasId)).map(t=>t.id));
  return db.pengumpulan.filter(p=>tIds.has(p.tugasId) && p.status==='dikumpulkan').length;
}

function statusTugasLabel(t){
  const now = Date.now();
  if(t.status==='draf') return {cls:'st-draf', txt:'Draf'};
  if(t.status==='tutup') return {cls:'st-tutup', txt:'Ditutup'};
  if(t.mulai && new Date(t.mulai).getTime()>now) return {cls:'st-jadwal', txt:'Terjadwal'};
  if(t.tenggat && new Date(t.tenggat).getTime()<now) return {cls:'st-lewat', txt:'Lewat tenggat'};
  return {cls:'st-buka', txt:'Dibuka'};
}
function pbDaftarTugas(k){

      <tbody>${list.map(t=>{

            <button class="ib" title="Duplikat" onclick="duplikatTugas('${t.id}')"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
            <button class="ib ib-danger" title="Hapus" onclick="hapusTugas('${t.id}')">${ICON.trash}</button>

}
function duplikatTugas(id){
  const t = db.tugas.find(x=>x.id===id); if(!t) return;
  const c = JSON.parse(JSON.stringify(t));
  c.id = uid(); c.judul = t.judul+' (salinan)'; c.status='draf'; c.dibuat=nowIso(); delete c.dikirimKe;
  c.soal.forEach(s=>s.id=uid());
  db.tugas.push(c); renderContent(); saveToDrive(true); toast('Tugas diduplikat sebagai draf');
}
function hapusTugas(id){
  const n = db.pengumpulan.filter(p=>p.tugasId===id).length;
  if(!confirm(`Hapus tugas ini?${n? ` ${n} jawaban siswa ikut terhapus.`:''}`)) return;
  db.tugas = db.tugas.filter(t=>t.id!==id);
  db.pengumpulan = db.pengumpulan.filter(p=>p.tugasId!==id);
  renderContent(); saveToDrive(true); toast('Tugas dihapus');
}

/* ---------- Editor tugas & soal ---------- */
function soalBaru(tipe){
  const s = {id:uid(), tipe, teks:'', poin:10, pembahasan:''};
  if(tipe==='pg'){ s.opsi=['','','','']; s.kunci=null; }
  else if(tipe==='bs') s.kunci=null;
  else s.kunci='';
  return s;
}
function bukaEditorTugas(id){
  const t = id? db.tugas.find(x=>x.id===id) : null;
  pbEditTugas = t? JSON.parse(JSON.stringify(t)) : {id:uid(), kelasId:pbKelasId, jenis:'tugas', judul:'', instruksi:'', mulai:'', tenggat:'', durasi:0,
    acak:false, terimaTerlambat:false, tampilHasil:'nilai', status:'draf', soal:[soalBaru('pg')], dibuatOleh:currentUser.id, dibuat:nowIso(), baru:true};
  pbEditAsli = JSON.stringify(pbEditTugas);
  renderContent(); window.scrollTo(0,0);
}
function tutupEditor(){
  if(JSON.stringify(pbEditTugas)!==pbEditAsli && !confirm('Perubahan belum disimpan. Tetap keluar?')) return;
  pbEditTugas = null; renderContent(); window.scrollTo(0,0);
}
function edT(f, v){ pbEditTugas[f] = v; }
function edS(i, f, v){ pbEditTugas.soal[i][f] = v; const c=document.getElementById('eq'+i); if(c) c.classList.remove('eq-err'); }
function edOpsi(i, oi, v){ pbEditTugas.soal[i].opsi[oi] = v; }
function updTotalPoin(){ const e=document.getElementById('edTotal'); if(e) e.textContent = totalPoin(pbEditTugas)+' poin'; }
function tambahSoal(tipe){ pbEditTugas.soal.push(soalBaru(tipe)); renderContent(); setTimeout(()=>{ const n=document.getElementById('eq'+(pbEditTugas.soal.length-1)); if(n){ n.scrollIntoView({behavior:'smooth',block:'center'}); const ta=n.querySelector('textarea'); ta && ta.focus(); } },30); }
function hapusSoal(i){ if(pbEditTugas.soal[i].teks && !confirm('Hapus soal '+(i+1)+'?')) return; pbEditTugas.soal.splice(i,1); renderContent(); }
function geserSoal(i, d){ const a=pbEditTugas.soal, j=i+d; if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; renderContent(); }
function duplikatSoal(i){ const c=JSON.parse(JSON.stringify(pbEditTugas.soal[i])); c.id=uid(); pbEditTugas.soal.splice(i+1,0,c); renderContent(); }
function ubahTipeSoal(i, tipe){ const lama=pbEditTugas.soal[i]; const b=soalBaru(tipe); b.id=lama.id; b.teks=lama.teks; b.poin=lama.poin; b.pembahasan=lama.pembahasan; pbEditTugas.soal[i]=b; renderContent(); }
function tambahOpsi(i){ const s=pbEditTugas.soal[i]; if(s.opsi.length>=6) return; s.opsi.push(''); renderContent(); }
function hapusOpsi(i, oi){ const s=pbEditTugas.soal[i]; s.opsi.splice(oi,1); if(s.kunci===oi) s.kunci=null; else if(s.kunci>oi) s.kunci--; renderContent(); }
function editorSoalHtml(s, i, n){

      <button class="ib" title="Naikkan" ${i===0?'disabled':''} onclick="geserSoal(${i},-1)">↑</button>

  let body = '';
  if(s.tipe==='pg'){
    body = `<div class="eq-opts">${s.opsi.map((o,oi)=>`<div class="eq-opt ${s.kunci===oi?'ok':''}">

        <input value="${esc(o)}" placeholder="Pilihan ${HURUF[oi]}" oninput="edOpsi(${i},${oi},this.value)">
        ${s.opsi.length>2? `<button class="ib" title="Hapus pilihan" onclick="hapusOpsi(${i},${oi})">×</button>`:''}</div>`).join('')}</div>
      <div class="eq-foot">${s.opsi.length<6? `<button class="btn-outline btn-small" onclick="tambahOpsi(${i})">+ Pilihan</button>`:''}<span class="sd-sub">Klik huruf untuk menandai jawaban yang benar.</span></div>`;
  } else if(s.tipe==='bs'){
    body = `<div class="eq-bs">${['benar','salah'].map(v=>`<label class="eq-bs-opt"><input type="radio" name="kunci_${s.id}" ${s.kunci===v?'checked':''} onchange="edS(${i},'kunci','${v}')"><span>${v==='benar'?'Benar':'Salah'}</span></label>`).join('')}<span class="sd-sub">Pilih jawaban yang benar.</span></div>`;

function validasiTugas(t){
  if(!t.judul.trim()) return {msg:'Judul wajib diisi'};
  if(!t.soal.length) return {msg:'Tambahkan minimal satu soal'};
  if(t.mulai && t.tenggat && t.tenggat<=t.mulai) return {msg:'Tenggat harus setelah waktu dibuka'};
  for(let i=0;i<t.soal.length;i++){
    const s=t.soal[i], no='Soal '+(i+1)+': ';
    if(!String(s.teks||'').trim()) return {i, msg:no+'pertanyaan belum diisi'};
    if(!(Number(s.poin)>0)) return {i, msg:no+'poin harus lebih dari 0'};
    if(s.tipe==='pg'){
      if(s.opsi.filter(o=>String(o).trim()).length<2) return {i, msg:no+'isi minimal dua pilihan jawaban'};
      if(s.kunci==null || !String(s.opsi[s.kunci]||'').trim()) return {i, msg:no+'tandai pilihan yang benar'};
    }
    if(s.tipe==='bs' && !s.kunci) return {i, msg:no+'pilih Benar atau Salah sebagai kunci'};
    if(s.tipe==='isian' && !String(s.kunci||'').trim()) return {i, msg:no+'isi kunci jawaban'};
  }
  return null;
}
function simpanTugas(statusBaru){
  const t = pbEditTugas;
  t.judul = (t.judul||'').trim();
  if(statusBaru==='draf'){ if(!t.judul) return toast('Judul wajib diisi'); }
  else {
    const err = validasiTugas(t);
    if(err){ toast(err.msg); if(err.i!=null){ const c=document.getElementById('eq'+err.i); if(c){ c.classList.add('eq-err'); c.scrollIntoView({behavior:'smooth',block:'center'}); } } return; }
  }
  if(statusBaru) t.status = statusBaru;
  if(t.status==='terbit' && !t.diterbitkan) t.diterbitkan = nowIso();
  delete t.baru;
  t.diubah = nowIso();
  const idx = db.tugas.findIndex(x=>x.id===t.id);
  if(idx>=0) db.tugas[idx] = t; else db.tugas.push(t);
  db.pengumpulan.filter(p=>p.tugasId===t.id && p.status!=='mengerjakan').forEach(p=>nilaiUlangPengumpulan(t, p));
  pbEditTugas = null;
  renderContent(); window.scrollTo(0,0); saveToDrive(true);
  toast(statusBaru==='terbit'? 'Tugas diterbitkan — siswa sudah bisa melihatnya' : statusBaru==='draf'? 'Draf disimpan' : 'Perubahan disimpan');
}

function periksaJawaban(pid){
  const p = db.pengumpulan.find(x=>x.id===pid); const t = db.tugas.find(x=>x.id===p.tugasId); const s = db.siswa.find(x=>x.id===p.siswaId);
  const items = t.soal.map((q,i)=>{

      <div class="pk-q">${teksBr(q.teks)}</div><div class="pk-a">${jawabanTampil(q,j)}</div>${ok?'':`<div class="pk-k"><span>Kunci:</span> ${kunciTampil(q)}</div>`}</div>`;

function simpanPeriksa(pid){
  const p = db.pengumpulan.find(x=>x.id===pid); const t = db.tugas.find(x=>x.id===p.tugasId);
  p.nilaiManual = p.nilaiManual || {};
  for(const q of t.soal.filter(q=>q.tipe==='esai')){
    const el = document.getElementById('pk_'+q.id); if(!el) continue;
    const raw = el.value.trim();
    if(raw===''){ delete p.nilaiManual[q.id]; continue; }
    const v = Number(raw);
    if(isNaN(v) || v<0 || v>q.poin){ el.focus(); return toast(`Poin soal esai harus 0–${q.poin}`); }
    p.nilaiManual[q.id] = v;
  }
  p.komentar = (document.getElementById('pk_komentar').value||'').trim();
  p.dinilaiOleh = currentUser.id;
  const r = nilaiUlangPengumpulan(t, p);
  closeModal(); renderContent(); saveToDrive(true);
  toast(r.perluNilai? 'Disimpan — masih ada soal esai yang belum diberi poin' : 'Penilaian disimpan');
}

  openModal(`<h3>Masukkan nilai ke Penilaian</h3>

    <div class="modal-actions"><button class="btn-outline btn-small" onclick="closeModal()">Batal</button><button class="btn-sun btn-small" onclick="kirimKePenilaian('${id}')">Masukkan nilai</button></div>`);
}
function kirimKePenilaian(id){
  const t = db.tugas.find(x=>x.id===id);
  const komp = document.getElementById('kp_komp').value, sem = document.getElementById('kp_sem').value;
  const judul = val('kp_judul') || t.judul, isiNol = document.getElementById('kp_nol').checked;
  // hapus kolom lama bila sebelumnya dikirim ke komponen/semester lain
  if(t.dikirimKe && (t.dikirimKe.komp!==komp || t.dikirimKe.semester!==sem) && ['tugas','ulangan','praktek'].includes(t.dikirimKe.komp)){
    const lama = getSheet(t.kelasId, t.dikirimKe.semester, false);
    if(lama){ lama.kolom[t.dikirimKe.komp] = lama.kolom[t.dikirimKe.komp].filter(c=>c.id!=='tg_'+t.id); Object.values(lama.nilai).forEach(n=>{ if(n[t.dikirimKe.komp]) delete n[t.dikirimKe.komp]['tg_'+t.id]; }); }
  }
  const sh = getSheet(t.kelasId, sem, true);
  const colId = 'tg_'+t.id;
  if(['tugas','ulangan','praktek'].includes(komp)){
    const ada = sh.kolom[komp].find(c=>c.id===colId);
    if(ada) ada.judul = judul; else sh.kolom[komp].push({id:colId, judul});
  }
  let n = 0, timpa = 0;
  siswaAktifDiKelas(t.kelasId).forEach(s=>{
    const p = pengumpulanDari(t.id, s.id);
    let v = null;
    if(p && p.status==='dinilai') v = p.skor;
    else if(!p && isiNol) v = 0;
    if(v==null) return;
    const ns = nilaiSiswa(sh, s.id);
    if(['tugas','ulangan','praktek'].includes(komp)) ns[komp][colId] = v;
    else { if(ns[komp]!=='' && ns[komp]!=null && Number(ns[komp])!==v) timpa++; ns[komp] = v; }
    n++;
  });
  t.dikirimKe = {komp, semester:sem, waktu:nowIso()};
  closeModal(); renderContent(); saveToDrive(true);

function pwAcak(){ const c='abcdefghjkmnpqrstuvwxyz23456789'; let o=''; const a=new Uint32Array(6); crypto.getRandomValues(a); a.forEach(x=>o+=c[x%c.length]); return o; }
function formPasswordSiswa(id){

  if(!(isAdmin() || canAccessKelas(s.kelasId))) return toast('Anda tidak punya akses ke siswa ini');

      <div class="help">Minimal 4 karakter. Catat dan berikan ke siswa — password tidak bisa dilihat lagi setelah disimpan.</div></div>
    <div class="modal-actions"><button class="btn-outline btn-small" onclick="closeModal()">Batal</button><button class="btn-sun btn-small" onclick="simpanPasswordSiswa('${id}')">Simpan password</button></div>`);

async function simpanPasswordSiswa(id){

  if(pw.length<4) return toast('Password minimal 4 karakter');

async function resetPasswordSiswa(id){

async function buatPasswordMassal(){
  const k = db.kelas.find(x=>x.id===pbKelasId);
  const siswa = siswaAktifDiKelas(k.id).sort((a,b)=>a.namaLengkap.localeCompare(b.namaLengkap));

let portalTab = 'beranda';
let kerjaTugasId = '';
function kerjaAktif(){ return appStage==='siswa-portal' && !!kerjaTugasId; }
function tugasUntukSiswa(s){ pbInit(); return db.tugas.filter(t=>t.kelasId===s.kelasId && t.status!=='draf'); }
function statusTugasSiswa(t, sid){
  const p = pengumpulanDari(t.id, sid), now = Date.now();
  const lewat = !!(t.tenggat && new Date(t.tenggat).getTime()<now);
  if(p && p.status!=='mengerjakan') return {kode:p.status, p};
  if(t.status==='tutup') return {kode:'tutup', p};
  if(t.mulai && new Date(t.mulai).getTime()>now) return {kode:'belumBuka'};
  if(lewat && !t.terimaTerlambat) return {kode:'terlewat', p};
  if(p) return {kode:'mengerjakan', p, lewat};
  return {kode:'tersedia', lewat};
}
const STATUS_SISWA = {
  tersedia:{txt:'Belum dikerjakan', cls:'st-buka'}, mengerjakan:{txt:'Sedang dikerjakan', cls:'st-jadwal'},
  dikumpulkan:{txt:'Menunggu penilaian', cls:'st-lewat'}, dinilai:{txt:'Selesai', cls:'st-buka'},
  belumBuka:{txt:'Belum dibuka', cls:'st-draf'}, terlewat:{txt:'Terlewat', cls:'st-tutup'}, tutup:{txt:'Ditutup', cls:'st-tutup'},
};
function nilaiTerlihat(t, p){ return p && p.status==='dinilai' && t.tampilHasil!=='tidak'; }
function kartuTugasSiswa(t, s){
  const st = statusTugasSiswa(t, s.id), info = STATUS_SISWA[st.kode];
  const bisa = ['tersedia','mengerjakan'].includes(st.kode);
  return `<button class="ts-card ${bisa?'ts-todo':''}" onclick="bukaKerja('${t.id}')">
    <div class="ts-l"><span class="ts-jenis">${jenisLabel(t.jenis)}</span><strong>${esc(t.judul)}</strong>
      <span class="sd-sub">${t.soal.length} soal${t.durasi>0? ' · '+t.durasi+' menit':''}${t.tenggat? ' · tenggat '+fmtDT(t.tenggat):''}${st.lewat? ' · <b class="warn-txt">lewat tenggat</b>':''}</span></div>
    <div class="ts-r">${nilaiTerlihat(t, st.p)? `<span class="ts-skor">${fmtN(st.p.skor)}</span>` : ''}<span class="tstat ${info.cls}">${info.txt}</span></div>
  </button>`;
}
