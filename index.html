/* ======================= PENILAIAN (format Excel PAB-BP Terintegrasi) ======================= */
const KOMPONEN = [
  {key:'tugas',   label:'Tugas Harian',   judul:'Nilai Hafalan & Tugas Harian PAB-BP', sheet:'Tugas Harian'},
  {key:'ulangan', label:'Ulangan Harian', judul:'Nilai Ulangan Harian (Asesmen Sumatif Materi)', sheet:'Ulangan Harian'},
  {key:'praktek', label:'Praktek',        judul:'Nilai Praktek Keagamaan (Meditasi & Puja Bakti)', sheet:'Tugas Praktek'},
];
const SEMESTER = [{key:'GANJIL', label:'Semester Ganjil'}, {key:'GENAP', label:'Semester Genap'}];
// Empat ujian dalam satu semester — sekaligus empat jenis rapor
const UJIAN = [
  {key:'mid1', label:'Mid Semester',   nama:'Mid Semester',                judul:'MID SEMESTER'},
  {key:'uts',  label:'UTS',            nama:'Ujian Tengah Semester (UTS)', judul:'UJIAN TENGAH SEMESTER'},
  {key:'mid2', label:'Mid Semester 2', nama:'Mid Semester 2',              judul:'MID SEMESTER 2'},
  {key:'uas',  label:'UAS',            nama:'Ujian Akhir Semester (UAS)',  judul:'UJIAN AKHIR SEMESTER'},
];
const KOMP_BOBOT = [
  {key:'tugas', label:'Rata Tugas', nama:'Tugas Harian & Hafalan'},
  {key:'ulangan', label:'Rata UH', nama:'Ulangan Harian'},
  {key:'praktek', label:'Rata Praktek', nama:'Praktek Keagamaan (Meditasi & Puja Bakti)'},
  ...UJIAN.map(u=>({key:u.key, label:u.label, nama:u.nama})),
];
function ujianLabel(k){ const u=UJIAN.find(x=>x.key===k); return u? u.label : k; }
let penilaianFilterKelas = '';
let penilaianSemester = semesterDariTanggal(new Date().toISOString().slice(0,10));
let penilaianSheetTab = 'rekap';

function semesterDariTanggal(iso){ const m = Number((iso||'').slice(5,7)); return m>=7 ? 'GANJIL' : 'GENAP'; }
function kolomDefault(){ return [1,2,3].map(n=>({id:uid(), judul:'Nilai '+n})); }
function getSheet(kelasId, semester, buat){
  const k = db.kelas.find(x=>x.id===kelasId); if(!k) return null;
  db.penilaianKelas = db.penilaianKelas || [];
  let sh = db.penilaianKelas.find(p=>p.kelasId===kelasId && p.semester===semester);
  if(!sh && buat){
    sh = {id:uid(), kelasId, tahunAjaranId:k.tahunAjaranId, semester, kolom:{tugas:kolomDefault(), ulangan:kolomDefault(), praktek:kolomDefault()}, nilai:{}};
    db.penilaianKelas.push(sh);
  }
  return sh;
}
function nilaiSiswa(sh, sid){ sh.nilai[sid] = sh.nilai[sid] || {tugas:{}, ulangan:{}, praktek:{}, mid1:'', uts:'', mid2:'', uas:''}; return sh.nilai[sid]; }
function angka(v){ if(v===''||v==null) return null; const n=Number(v); return isNaN(n)? null : n; }
function r1(n){ return n==null? null : Math.round(n*10)/10; }
function fmtN(n){ return n==null? '—' : (Number.isInteger(n)? String(n) : n.toFixed(1)); }
function rataKomponen(sh, sid, key){
  if(!sh) return null;
  const n = (sh.nilai[sid]||{})[key]||{};
  const vals = sh.kolom[key].map(c=>angka(n[c.id])).filter(v=>v!=null);
  return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}
// Kehadiran siswa pada kelas & semester ini, diambil langsung dari menu Absensi
function absensiSemester(sid, kelasId, semester){
  const c = {Hadir:0, Izin:0, Sakit:0, Alpa:0};
  db.absensi.forEach(a=>{ if(a.siswaId===sid && a.kelasId===kelasId && a.status && semesterDariTanggal(a.tanggal)===semester) c[a.status]++; });
  const total = c.Hadir+c.Izin+c.Sakit+c.Alpa;
  return {...c, total, pct: total? c.Hadir/total*100 : null};
}
function predikatDari(n){
  if(n==null) return '';
  const pr = [...S().penilaian.predikat].sort((a,b)=>b.min-a.min);
  return (pr.find(p=>n>=p.min) || pr[pr.length-1]).label;
}
function hitungRekap(sh, sid, kelasId, semester){
  const st = S().penilaian;
  const n = sh? (sh.nilai[sid]||{}) : {};
  const v = {tugas:rataKomponen(sh, sid,'tugas'), ulangan:rataKomponen(sh, sid,'ulangan'), praktek:rataKomponen(sh, sid,'praktek')};
  UJIAN.forEach(u=>{ v[u.key] = angka(n[u.key]); });
  const abs = absensiSemester(sid, kelasId, semester);
  const nilai = {}, pred = {}, kurang = {};
  UJIAN.forEach(u=>{
    const b = st.bobotRapor[u.key];
    const pakai = KOMP_BOBOT.filter(c=>Number(b[c.key])>0);
    const total = pakai.reduce((a,c)=>a+Number(b[c.key]),0);
    kurang[u.key] = pakai.filter(c=>v[c.key]==null).map(c=>c.label);
    nilai[u.key] = (total && !kurang[u.key].length)? r1(pakai.reduce((a,c)=>a+v[c.key]*Number(b[c.key]),0)/total) : null;
    pred[u.key] = predikatDari(nilai[u.key]);
  });
  const terakhir = [...UJIAN].reverse().map(u=>u.key).find(k=>nilai[k]!=null) || null;
  return {tugas:r1(v.tugas), ulangan:r1(v.ulangan), praktek:r1(v.praktek), mid1:v.mid1, uts:v.uts, mid2:v.mid2, uas:v.uas,
    abs, nilai, pred, kurang, terakhir, potongan:0};
}
function predCls(p){ const pr=[...S().penilaian.predikat].sort((a,b)=>b.min-a.min); const i=pr.findIndex(x=>x.label===p); return i===0?'pr-a':i===1?'pr-b':'pr-c'; }

  let body = '';

function sheetTitle(t){ return `<div class="sheet-title">${esc(t)}</div>`; }
function sheetKomponen(sh, k, siswa, komp){
  const kolom = sh? sh.kolom[komp.key] : kolomDefault().map((c,i)=>({id:'_'+i, judul:c.judul}));

      <tbody>${rows}</tbody>

      <span class="sd-sub">${nk} kolom. Klik judul kolom untuk mengganti nama (misal "Hafalan Paritta"). Tekan Enter untuk pindah ke siswa berikutnya.</span></div>`;

let penilaianTpUjian = 'mid1';
const CAPAIAN = {ok:{txt:'Tercapai', sym:'✓', cls:'ok'}, bb:{txt:'Perlu bimbingan', sym:'!', cls:'bb'}};
function tpList(sh, uj){ if(!sh) return []; sh.tp = sh.tp||{}; sh.tp[uj] = sh.tp[uj]||[]; return sh.tp[uj]; }
function capMap(sh, uj){ sh.capaian = sh.capaian||{}; sh.capaian[uj] = sh.capaian[uj]||{}; return sh.capaian[uj]; }
function capaianSiswa(sh, uj, sid){ return (sh && sh.capaian && sh.capaian[uj] && sh.capaian[uj][sid]) || {}; }

    </div>`;
  const side = `<aside class="tp-side"><h4>Salin TP</h4>
      <p class="sd-sub" style="margin:0 0 8px">TP biasanya sama untuk satu tingkat. Salin dari kelas lain agar tidak mengetik ulang.</p>
      ${sumber.length? `<select id="tpSumber" style="width:100%;margin-bottom:8px">${sumber.map(x=>`<option value="${x.v}">${esc(x.l)}</option>`).join('')}</select>
        <button class="btn-outline btn-small" onclick="salinTP('${k.id}')">Salin ke ${esc(ujn.label)} kelas ini</button>`
      : `<p class="sd-sub" style="margin:0">Belum ada kelas lain dengan TP di ${SEMESTER.find(x=>x.key===sh.semester).label.toLowerCase()} ini.</p>`}

  }
  return `${seg}<div class="sheet-title">1. Tujuan pembelajaran — ${esc(ujn.label)}</div><div class="tp-grid">${daftar}${side}</div>${cap}`;
}
function tambahTP(kelasId){

function gridKey(e){
  if(e.key!=='Enter' && e.key!=='ArrowDown' && e.key!=='ArrowUp') return;
  e.preventDefault();
  e.target.dispatchEvent(new Event('change'));
  const r = Number(e.target.dataset.r) + (e.key==='ArrowUp'? -1 : 1), c = e.target.dataset.c;
  const next = document.querySelector(`.sheet input[data-r="${r}"][data-c="${c}"]`);
  if(next){ next.focus(); next.select(); }
}

function renderKenaikan(){
  const ta = activeTahunAjaran();
  const kelasList = ta? kelasOfTahun(ta.id) : [];
  const siswaAktif = db.siswa.filter(s=>s.status==='aktif' && kelasList.some(k=>k.id===s.kelasId));
  const tingkatSorted = [...db.tingkatKelas].sort((a,b)=>a.urutan-b.urutan);
  const rows = siswaAktif.map(s=>{
    const k = db.kelas.find(x=>x.id===s.kelasId);
    const t = k? tingkatOf(k) : null;
    const tBerikut = t? tingkatSorted.find(x=>x.urutan===t.urutan+1) : null;
    const tujuan = tBerikut? tBerikut.nama : 'Lulus';
    return `<tr>
      <td><input type="checkbox" class="kn-check" value="${s.id}" checked></td>
      <td>${esc(s.noInduk||'—')}</td>
      <td><strong>${esc(s.namaLengkap)}</strong></td>
      <td>${k? esc(kelasLabel(k)):'—'}</td>
      <td>${esc(tujuan)}</td>
    </tr>`;
  }).join('');
  return `
    <h2>Kenaikan Kelas</h2>
    <p class="subtitle">Centang siswa yang akan dinaikkan ke tahun ajaran baru, lalu klik Proses. Siswa yang TIDAK dicentang akan tetap tinggal di kelas/tahun ajaran sekarang.</p>
    <div class="setup-box">⚠️ Proses ini membuat tahun ajaran baru & mengaktifkannya. Hanya siswa tercentang yang dipindah ke tingkat berikutnya (atau ditandai "lulus" jika sudah di tingkat akhir). Data lama tetap tersimpan untuk riwayat/laporan.</div>
    <div class="field"><label>Nama tahun ajaran baru</label><input id="fKenaikanNama" placeholder="${nextTAName(ta)}" style="width:220px"></div>
    <div class="row" style="margin-bottom:12px">
      <button class="btn-outline btn-small" onclick="toggleAllKenaikan(true)">Centang semua</button>
      <button class="btn-outline btn-small" onclick="toggleAllKenaikan(false)">Kosongkan semua</button>
    </div>
    ${siswaAktif.length? `<div style="overflow-x:auto"><table><thead><tr><th></th><th>No Induk</th><th>Nama</th><th>Kelas Sekarang</th><th>Tujuan</th></tr></thead><tbody>${rows}</tbody></table></div>`
    : `<div class="empty">Tidak ada siswa aktif untuk dinaikkan.</div>`}
    <button class="btn-sun" style="margin-top:16px" onclick="prosesKenaikan()">Proses Kenaikan Kelas</button>
  `;
}
function toggleAllKenaikan(val){ document.querySelectorAll('.kn-check').forEach(c=>c.checked=val); }
function nextTAName(ta){ if(!ta) return defaultTAName(); const m=ta.nama.match(/(\d{4})\D+(\d{4})/); if(m) return `${+m[1]+1}/${+m[2]+1}`; return defaultTAName(); }
function prosesKenaikan(){
  const taLama = activeTahunAjaran();
  if(!taLama) return toast('Tidak ada tahun ajaran aktif');
  const checkedIds = Array.from(document.querySelectorAll('.kn-check:checked')).map(x=>x.value);
  if(!checkedIds.length) return toast('Pilih minimal satu siswa untuk dinaikkan');
  if(!confirm(`Proses kenaikan kelas untuk ${checkedIds.length} siswa terpilih. Lanjutkan?`)) return;
  const namaBaru = document.getElementById('fKenaikanNama').value.trim() || nextTAName(taLama);
  const taBaru = {id:uid(), nama:namaBaru, aktif:true};
  db.tahunAjaran.forEach(t=>t.aktif=false); db.tahunAjaran.push(taBaru);

  const tingkatSorted = [...db.tingkatKelas].sort((a,b)=>a.urutan-b.urutan);
  const kelasBaruMap = {}; // "tingkatId|daerahId" -> kelas baru
  let jumlahLulus = 0;
  checkedIds.forEach(sid=>{
    const s = db.siswa.find(x=>x.id===sid);
    if(!s) return;
    const kelasSekarang = db.kelas.find(k=>k.id===s.kelasId);
    if(!kelasSekarang) return;
    const t = tingkatOf(kelasSekarang);
    if(!t) return;
    const tBerikut = tingkatSorted.find(x=>x.urutan===t.urutan+1);
    if(!tBerikut){ s.status='lulus'; jumlahLulus++; return; }
    const key = tBerikut.id+'|'+kelasSekarang.daerahId;
    let kelasBaru = kelasBaruMap[key];
    if(!kelasBaru){
      kelasBaru = db.kelas.find(k=>k.tahunAjaranId===taBaru.id && k.tingkatKelasId===tBerikut.id && k.daerahId===kelasSekarang.daerahId);
      if(!kelasBaru){
        kelasBaru = {id:uid(), tahunAjaranId:taBaru.id, tingkatKelasId:tBerikut.id, daerahId:kelasSekarang.daerahId, namaRombel:kelasSekarang.namaRombel, guruId:kelasSekarang.guruId, guruAsistenIds:kelasSekarang.guruAsistenIds||[]};
        db.kelas.push(kelasBaru);
      }
      kelasBaruMap[key] = kelasBaru;
    }
    s.kelasId = kelasBaru.id;
  });

  renderTabs(); renderContent(); switchTab('dashboard'); saveToDrive(true);
  toast(`Kenaikan kelas selesai untuk ${checkedIds.length} siswa (${jumlahLulus} lulus) → tahun ajaran ${namaBaru}`);
}

  const toggle = `<div class="seg no-print">
      <button class="${laporanMode==='siswa'?'on':''}" onclick="laporanMode='siswa'; renderContent()">Laporan per siswa</button>
      <button class="${laporanMode==='kelas'?'on':''}" onclick="laporanMode='kelas'; renderContent()">Laporan absensi per kelas</button>
    </div>`;
  return toggle + (laporanMode==='kelas'? renderLaporanAbsensiKelas() : renderLaporanSiswa());
}

function renderLaporanSiswa(){
  const ta = activeTahunAjaran();

  if((!laporanSiswaKelasId || !kelasList.some(k=>k.id===laporanSiswaKelasId)) && kelasList.length) laporanSiswaKelasId = kelasList[0].id;
  const siswaList = laporanSiswaKelasId? siswaAktifDiKelas(laporanSiswaKelasId).sort((a,b)=>a.namaLengkap.localeCompare(b.namaLengkap)) : [];
  if(!siswaList.some(s=>s.id===laporanSiswaId)) laporanSiswaId = siswaList[0]? siswaList[0].id : '';

        <button class="ib" title="Siswa berikutnya" ${idx<0||idx>=siswaList.length-1?'disabled':''} onclick="laporanSiswaId='${idx>=0&&idx<siswaList.length-1? siswaList[idx+1].id:''}'; renderContent()">›</button></div></div>
      <div class="field"><label>Semester</label><select onchange="laporanSemester=this.value; renderContent()">

  return controls + `<div class="paper-stage"><div class="paper">${dokumenRapor(laporanSiswaId, laporanSemester, laporanJenis, true)}</div></div>`;

function dokumenRapor(sid, semester, jenis, editable){
  const s = db.siswa.find(x=>x.id===sid);
  const k = db.kelas.find(x=>x.id===s.kelasId);
  const taS = db.tahunAjaran.find(t=>t.id===(k?k.tahunAjaranId:''));
  const sh = k? getSheet(k.id, semester, false) : null;
  const r = hitungRekap(sh, s.id, k?k.id:'', semester);
  const st = S().penilaian;
  if(!UJIAN.some(u=>u.key===jenis)) jenis = 'mid1';
  const uj = UJIAN.find(u=>u.key===jenis), b = st.bobotRapor[jenis];
  const semLabel = SEMESTER.find(x=>x.key===semester).label;
  const rincian = key=> sh && sh.kolom[key]? sh.kolom[key].map(c=>{ const v=angka(((sh.nilai[s.id]||{})[key]||{})[c.id]); return v==null? null : `${esc(c.judul)}: ${fmtN(v)}`; }).filter(Boolean).join(' · ') : '';
  const komp = KOMP_BOBOT.filter(c=>Number(b[c.key])>0).map(c=>({nama:c.nama, nilai:r[c.key], rinci:['tugas','ulangan','praktek'].includes(c.key)? rincian(c.key):''}));
  const nilaiAkhir = r.nilai[jenis];
  const pred = r.pred[jenis];
  const tpRapor = sh && sh.tp ? (sh.tp[jenis]||[]) : [];
  const capRapor = capaianSiswa(sh, jenis, s.id);
  const catKey = 'catatan_'+jenis;
  const nCat = sh && sh.nilai[s.id] ? sh.nilai[s.id] : {};
  const catatan = nCat[catKey]!=null? nCat[catKey] : (jenis==='uts'? nCat.catatanMid : jenis==='uas'? nCat.catatanAkhir : '') || '';
  const waliNama = k && k.guruId? guruNama(k.guruId) : '';

  const ident = (l,v)=>`<tr><td class="id-l">${l}</td><td class="id-s">:</td><td>${v||'—'}</td></tr>`;

    </div>

    <div class="rp-h">A. Nilai</div>
    <table class="rp-t">
      <thead><tr><th style="width:34px">No</th><th>Komponen penilaian</th><th style="width:90px">Nilai</th></tr></thead>
      <tbody>
        ${komp.map((c,i)=>`<tr><td class="c">${i+1}</td><td>${c.nama}${c.rinci? `<div class="rp-rinci">${c.rinci}</div>`:''}</td><td class="c">${fmtN(c.nilai)}</td></tr>`).join('')}
      </tbody>
      <tfoot><tr><td colspan="2">Nilai ${uj.label}</td><td class="c rp-big">${fmtN(nilaiAkhir)}</td></tr></tfoot>
    </table>
    <div class="rp-pred"><span>Predikat</span><strong>${pred? esc(pred) : '—'}</strong>${nilaiAkhir==null? `<em>Nilai belum lengkap — ${esc(r.kurang[jenis].join(', '))} perlu diisi di menu Penilaian.</em>`:''}</div>

    ${tpRapor.length? `<div class="rp-h">B. Capaian Tujuan Pembelajaran</div>
      <table class="rp-t rp-tp"><thead><tr><th style="width:52px">TP</th><th>Tujuan pembelajaran</th><th style="width:130px">Capaian</th></tr></thead>
      <tbody>${tpRapor.map((t,i)=>`<tr><td class="c">TP ${i+1}</td><td>${esc(t.teks)}</td><td class="c">${CAPAIAN[capRapor[t.id]]? CAPAIAN[capRapor[t.id]].txt : '—'}</td></tr>`).join('')}</tbody></table>`:''}

function simpanCatatanRapor(sid, semester, key, text){
  const s = db.siswa.find(x=>x.id===sid);
  const sh = getSheet(s.kelasId, semester, true);
  nilaiSiswa(sh, sid)[key] = text.trim();
  scheduleSave(); toast('Catatan disimpan');
}

function renderLaporanAbsensiKelas(){
  const ta = activeTahunAjaran();
  const kelasList = (ta? kelasOfTahun(ta.id):[]).filter(k=>canAccessKelas(k.id));
  if((!laporanKelasId || !kelasList.some(x=>x.id===laporanKelasId)) && kelasList.length) laporanKelasId = kelasList[0].id;
  const k = db.kelas.find(x=>x.id===laporanKelasId);
  const jadwal = ta? jadwalOfTahun(ta.id).filter(j=>!j.libur).sort((a,b)=>a.tanggal.localeCompare(b.tanggal)) : [];
  const siswaList = laporanKelasId? siswaAktifDiKelas(laporanKelasId).sort((a,b)=>a.namaLengkap.localeCompare(b.namaLengkap)) : [];
  const picker = `<div class="no-print">
    <h2>Laporan Absensi per Kelas</h2>
    <p class="subtitle">Rekap kehadiran seluruh siswa dalam satu kelas per tanggal pertemuan.</p>
    <div class="field" style="max-width:340px;margin-bottom:16px"><label>Pilih kelas</label>
      <select onchange="laporanKelasId=this.value; renderContent()">
        ${kelasList.map(x=>`<option value="${x.id}" ${x.id===laporanKelasId?'selected':''}>${esc(kelasLabel(x))}</option>`).join('')}
      </select>
    </div></div>`;
  if(!kelasList.length) return picker + `<div class="empty">Tidak ada kelas yang bisa diakses.</div>`;
  if(!jadwal.length) return picker + `<div class="empty">Belum ada tanggal pertemuan untuk tahun ajaran ini.</div>`;
  if(!siswaList.length) return picker + `<div class="empty">Belum ada siswa aktif di kelas ini.</div>`;

  const SYM = {Hadir:'H', Izin:'I', Sakit:'S', Alpa:'A'};
  const absMap = {};
  db.absensi.forEach(a=>{ if(a.kelasId===laporanKelasId && a.status) absMap[a.siswaId+'|'+a.tanggal]=a; });
  const sudahDiisi = j => siswaList.some(s=>absMap[s.id+'|'+j.tanggal]);
  const nTer = jadwal.filter(sudahDiisi).length; // pertemuan yang sudah terlaksana/diabsen
  const today = new Date().toISOString().slice(0,10);

  // Kelompok bulan
  const monthGroups = []; const monthStart = new Set();
  jadwal.forEach(j=>{
    const label = new Date(j.tanggal+'T00:00:00').toLocaleDateString('id-ID',{month:'short', year:'2-digit'});
    let g = monthGroups[monthGroups.length-1];
    if(!g || g.label!==label){ g={label, count:0}; monthGroups.push(g); monthStart.add(j.tanggal); }
    g.count++;
  });
  const msc = j => monthStart.has(j.tanggal)? ' ms':'';

  let tot = {H:0,I:0,S:0,A:0};
  const rows = siswaList.map((s,idx)=>{
    const c = {H:0,I:0,S:0,A:0};
    const cells = jadwal.map(j=>{
      const rec = absMap[s.id+'|'+j.tanggal];
      const sym = rec? SYM[rec.status] : '';
      if(sym) c[sym]++;
      const tip = rec? esc(rec.status)+(rec.keterangan? ' — '+esc(rec.keterangan):'') : '';
      return `<td class="dc${msc(j)}">${sym? `<span class="abs-cell ${sym}" title="${tip}">${sym}</span>` : '<span class="abs-cell kosong">·</span>'}</td>`;
    }).join('');
    Object.keys(c).forEach(x=>tot[x]+=c[x]);
    const pct = nTer? Math.round(c.H/nTer*100) : null;
    const pctCls = pct===null? '' : (pct>=80? 'good' : pct>=60? 'mid' : 'low');
    return `<tr><td class="c-no">${idx+1}</td>
      <td class="c-nama">${esc(s.namaLengkap)}<div class="c-induk">No Induk ${esc(s.noInduk||'—')} · ${esc(s.asalSekolah||'Asal sekolah belum diisi')}</div></td>
      ${cells}
      <td class="sum ms">${c.H}</td><td class="sum">${c.I}</td><td class="sum">${c.S}</td><td class="sum">${c.A}</td>
      <td class="sum pct ${pctCls}">${pct===null?'—':pct+'%'}</td></tr>`;
  }).join('');
  const footCells = jadwal.map(j=>{
    if(!sudahDiisi(j)) return `<td class="${msc(j).trim()}"></td>`;
    const n = siswaList.filter(s=>{ const r=absMap[s.id+'|'+j.tanggal]; return r && r.status==='Hadir'; }).length;
    return `<td class="${msc(j).trim()}">${n}</td>`;
  }).join('');
  const rataPct = nTer? Math.round(tot.H/(nTer*siswaList.length)*100) : null;

  const waliNama = k && k.guruId? guruNama(k.guruId) : '';
  const tingkat = k? tingkatOf(k) : null, daerah = k? daerahOf(k) : null;
  const kelasTeks = tingkat? tingkat.nama + (k.namaRombel? ' - '+k.namaRombel : '') : '—';

  return picker + `
    <!-- Ringkasan (layar) -->
    <div class="abs-meta no-print">
      <span class="abs-chip">Kelas <strong>${esc(kelasTeks)}</strong></span>
      <span class="abs-chip">Daerah <strong>${esc(daerah?daerah.nama:'—')}</strong></span>
      <span class="abs-chip">Wali kelas <strong>${esc(waliNama||'—')}</strong></span>
      <span class="abs-chip">Tahun ajaran <strong>${esc(ta?ta.nama:'—')}</strong></span>
    </div>
    <div class="abs-summary no-print">
      <div class="stat"><div class="num">${siswaList.length}</div><div class="lbl">Siswa aktif</div></div>
      <div class="stat"><div class="num">${nTer} <small>/ ${jadwal.length}</small></div><div class="lbl">Pertemuan terlaksana</div></div>
      <div class="stat ${rataPct!==null&&rataPct>=80?'good':''}"><div class="num">${rataPct===null?'—':rataPct+'%'}</div><div class="lbl">Rata-rata kehadiran</div></div>
      <div class="stat ${tot.A?'warn':''}"><div class="num">${tot.A}</div><div class="lbl">Total alpa</div></div>
    </div>

    <!-- Kepala dokumen (cetak) -->
    <div class="print-only">
      ${kopSuratHtml()}
      <div class="doc-title">DAFTAR HADIR SISWA</div>
      <div class="doc-sub">Tahun Ajaran ${esc(ta?ta.nama:'—')}</div>
      <table class="doc-info"><tbody>
        <tr><td>Kelas</td><td>: ${esc(kelasTeks)}</td><td style="padding-left:40px">Guru SMB</td><td>: ${esc(waliNama||'—')}</td></tr>
        <tr><td>Daerah</td><td>: ${esc(daerah?daerah.nama:'—')}</td><td style="padding-left:40px">Jumlah Siswa</td><td>: ${siswaList.length} siswa</td></tr>
      </tbody></table>
    </div>

    <div class="abs-wrap">
      <table class="abs-table">
        <thead>
          <tr class="m"><th rowspan="2" class="c-no">No</th><th rowspan="2" class="c-nama">Nama Siswa</th>
            ${monthGroups.map(g=>`<th colspan="${g.count}" class="ms">${g.label}</th>`).join('')}
            <th colspan="5" class="ms">Rekap</th></tr>
          <tr class="d">
            ${jadwal.map(j=>`<th class="${msc(j).trim()}${j.tanggal>today?' fut':''}">${new Date(j.tanggal+'T00:00:00').getDate()}</th>`).join('')}
            <th class="ms">H</th><th>I</th><th>S</th><th>A</th><th>%</th></tr>
        </thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td colspan="2" class="c-foot">TOTAL HADIR</td>${footCells}
          <td class="ms">${tot.H}</td><td>${tot.I}</td><td>${tot.S}</td><td>${tot.A}</td><td>${rataPct===null?'—':rataPct+'%'}</td></tr></tfoot>
      </table>
    </div>

    <div class="abs-legend no-print">
      <span><span class="abs-cell H">H</span> Hadir</span>
      <span><span class="abs-cell I">I</span> Izin</span>
      <span><span class="abs-cell S">S</span> Sakit</span>
      <span><span class="abs-cell A">A</span> Alpa</span>
      <span>% = Hadir ÷ pertemuan terlaksana</span>
    </div>
    <button class="btn-sun" style="margin-top:16px" onclick="cetakLaporan('landscape')">🖨️ Cetak laporan</button>

    <!-- Kaki dokumen (cetak) -->
    <div class="print-only">
      <div class="doc-legend">Keterangan: H = Hadir · I = Izin · S = Sakit · A = Alpa · % = persentase kehadiran dari ${nTer} pertemuan terlaksana</div>
      <div class="ttd"><div></div>${ttdGuruHtml(k? k.guruId:'', 'Guru SMB')}</div>
    </div>
  `;
}

// Website TIDAK memegang kunci rahasia. Setelah login, server memberi token sesi;
// server yang menentukan data apa yang dikirim dan perubahan apa yang diterima.
let driveKnownVersion = null;   // versi data terakhir yang kita ketahui (dari server)
let lastSyncedSnapshot = null;  // salinan db persis setelah muat/simpan terakhir — dasar menghitung perubahan
let saveBusy = false;
let saveQueued = false;
let authToken = null;
try{ authToken = sessionStorage.getItem('smb_token'); }catch(e){}
function setToken(t){ authToken = t; try{ t? sessionStorage.setItem('smb_token', t) : sessionStorage.removeItem('smb_token'); }catch(e){} }

const DB_KOSONG = ()=>({meta:{noIndukCounter:0},users:[],daerah:[],tingkatKelas:[],tahunAjaran:[],kelas:[],siswa:[],jadwalPertemuan:[],absensi:[],aspekPenilaian:[],nilai:[],pendaftaran:[],paramita:[],kas:[],settings:{},berita:[],penilaianKelas:[],rencana:[],materi:[],tugas:[],pengumpulan:[],chatGrup:[]});

function snapshotDb(){ try{ return JSON.parse(JSON.stringify(db)); }catch(e){ return null; } }
function updateStatusUI(connected){
  const el = document.getElementById('statusText'); if(!el) return;
  el.innerHTML = `<span class="dot ${connected?'on':''}" id="statusDot"></span> ${connected? 'Tersambung' : 'Terputus dari server'}`;
}
function backendConfigured(){ return APPS_SCRIPT_URL && !APPS_SCRIPT_URL.includes('GANTI_DENGAN'); }
function driveError(title, e){
  console.error(e);
  const msg = (e && e.message) ? e.message : String(e);
  openModal(`<h3>⚠️ ${esc(title)}</h3>
    <p style="font-size:13px;line-height:1.6;white-space:pre-wrap;background:#f7fafd;color:#1F2A3C;border:1px solid var(--line);border-radius:8px;padding:10px">${esc(msg)}</p>
    <p style="font-size:12.5px;color:var(--ink-soft)">Jika ini terus terjadi, periksa koneksi internet, lalu muat ulang halaman.</p>
    <div class="modal-actions"><button class="btn-sun btn-small" onclick="closeModal()">Tutup</button></div>`);
}

// Semua permintaan ke server lewat sini
async function api(action, data){
  const res = await fetch(APPS_SCRIPT_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, // hindari CORS preflight
    body: JSON.stringify(Object.assign({action, token: authToken}, data||{}))});
  if(!res.ok) throw new Error(`Server error ${res.status}`);
  const j = await res.json();
  if(j && j.error){
    if(j.code==='AUTH' && authToken){ sesiBerakhir(j.error); }
    const e = new Error(j.error); e.code = j.code; throw e;
  }
  return j;
}
function sesiBerakhir(pesan){
  setToken(null);
  clearInterval(window._pollTimer);
  currentUser = null; currentSiswa = null;
  muatPublik().then(()=> toast(pesan || 'Sesi berakhir, silakan masuk kembali'));
}

// Data halaman awal untuk pengunjung (tanpa login)
async function muatPublik(){
  try{
    const r = await api('public');
    db = Object.assign(DB_KOSONG(), r.data||{});
    driveKnownVersion = r.version; lastSyncedSnapshot = snapshotDb();
    backendInitError = null; updateStatusUI(true);
    appStage = r.needSetup? 'need-admin-setup' : 'need-login';
  }catch(e){ backendInitError = e.message || String(e); appStage = 'need-drive'; updateStatusUI(false); }
  kerjaTugasId=''; publicPreview=false;
  renderTabs(); renderContent(); updateUserBadge();
}
// Data milik pengguna yang sedang login
async function muatSesi(){
  const r = await api('load');
  db = Object.assign(DB_KOSONG(), r.data||{});
  driveKnownVersion = r.version; lastSyncedSnapshot = snapshotDb();
  if(r.me.t==='siswa'){ currentSiswa = db.siswa.find(s=>s.id===r.me.id); currentUser = null; appStage = 'siswa-portal'; }
  else { currentUser = db.users.find(u=>u.id===r.me.id); currentSiswa = null; appStage = 'ready'; }
  backendInitError = null; updateStatusUI(true);
  if(currentUser && isAdmin() && (!db.tingkatKelas || !db.tingkatKelas.length)){ seedDefaults(); saveToDrive(false); }
  startPolling();
}
async function loadFromDrive(){
  updateStatusUI(false);
  if(!backendConfigured()){ backendInitError = 'URL Web App belum diisi di kode.'; appStage='need-drive'; renderContent(); return; }
  if(authToken){
    try{ await muatSesi(); renderTabs(); renderContent(); updateUserBadge(); return; }
    catch(e){ if(e.code!=='AUTH'){ backendInitError = e.message||String(e); appStage='need-drive'; renderContent(); return; } }
  }
  await muatPublik();
}
// Dipanggil setelah login/daftar admin berhasil
async function masukDenganToken(token){
  setToken(token);
  await muatSesi();
  activeTab='dashboard'; loginMode='pilih'; portalTab='beranda'; kerjaTugasId='';
  renderTabs(); renderContent(); updateUserBadge();
}
function connectDrive(){ backendInitError=null; renderContent(); loadFromDrive(); }
async function manualRefresh(){ await loadFromDrive(); }

// Cek berkala; bila ada perubahan dari pengguna lain, muat ulang & gabungkan diam-diam
function startPolling(){
  clearInterval(window._pollTimer);
  window._pollTimer = setInterval(async ()=>{
    if(!authToken) return;
    try{
      const data = await api('version');
      const modalOpen = document.getElementById('modalRoot') && document.getElementById('modalRoot').innerHTML.trim().length>0;
      const ae = document.activeElement;
      const sedangMengetik = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && ae.type!=='checkbox';
      if(driveKnownVersion!=null && data.version && data.version !== driveKnownVersion && !modalOpen && !saveBusy && !window._savePending && !sedangMengetik){
        await mergeFromRemote();
        if(kerjaAktif() || (activeTab==='pembelajaran' && pbEditTugas)) return; // jangan ganggu yang sedang mengerjakan
        if(window._ttdProses || Date.now()-(window._pilihFile||0) < 90000) return; // sedang memilih/memproses file
        renderTabs(); renderContent(); updateUserBadge();
      }
    }catch(e){ /* diamkan, cek berikutnya akan coba lagi */ }
  }, 20000);
}

// Gabung per-catatan (berdasar id): perubahan lokal yang belum tersimpan ditimpakan ke data server terbaru
function mergeArr(local, remote, base){
  const punyaId = a => (a||[]).every(x=>x && typeof x==='object' && x.id);
  if(!punyaId(local) || !punyaId(remote) || !punyaId(base)) return local;
  const B = new Map((base||[]).map(x=>[x.id,x])), L = new Map(local.map(x=>[x.id,x]));
  const out = new Map(remote.map(x=>[x.id,x]));
  B.forEach((v,id)=>{ if(!L.has(id)) out.delete(id); });
  L.forEach((v,id)=>{ const b=B.get(id); if(!b || JSON.stringify(b)!==JSON.stringify(v)) out.set(id,v); });
  return [...out.values()];
}
async function mergeFromRemote(){
  if(!authToken) return;
  const r = await api('load');
  const remote = Object.assign(DB_KOSONG(), r.data||{});
  const base = lastSyncedSnapshot || {};
  const merged = {};
  new Set([...Object.keys(db), ...Object.keys(remote)]).forEach(key=>{
    const localChanged = JSON.stringify(db[key]) !== JSON.stringify(base[key]);
    if(!localChanged){ merged[key] = remote[key]; return; }
    merged[key] = (Array.isArray(db[key]) && Array.isArray(remote[key])) ? mergeArr(db[key], remote[key], base[key]) : db[key];
  });
  db = merged;
  driveKnownVersion = r.version;
  lastSyncedSnapshot = Object.assign(snapshotDb(), JSON.parse(JSON.stringify(remote)));  // dasar = versi server
  if(currentSiswa) currentSiswa = db.siswa.find(x=>x.id===currentSiswa.id) || currentSiswa;
  if(currentUser) currentUser = db.users.find(x=>x.id===currentUser.id) || currentUser;
}

// Hitung perubahan sejak sinkron terakhir: per catatan untuk daftar, utuh untuk objek (settings/meta)
function buatPatch(){
  const base = lastSyncedSnapshot || {};
  const patch = {}; let ada = false;
  Object.keys(db).forEach(k=>{
    const a = db[k], b = base[k];
    if(JSON.stringify(a)===JSON.stringify(b)) return;
    if(Array.isArray(a) && (b==null || Array.isArray(b))){
      const B = new Map((b||[]).filter(x=>x&&x.id).map(x=>[x.id, JSON.stringify(x)]));
      const ids = new Set(), up = [];
      a.forEach(x=>{ if(!x || !x.id) return; ids.add(x.id); if(B.get(x.id)!==JSON.stringify(x)) up.push(x); });
      const del = [...B.keys()].filter(id=>!ids.has(id));
      if(up.length || del.length){ patch[k] = {up, del}; ada = true; }
    } else if(a && typeof a==='object'){ patch[k] = {set:a}; ada = true; }
  });
  return ada? patch : null;
}
async function saveToDrive(manual){
  if(!authToken) return;
  if(saveBusy){ saveQueued = true; return; }
  const patch = buatPatch();
  if(!patch) return;
  saveBusy = true;
  const dasarBaru = snapshotDb();             // keadaan yang sedang dikirim
  try{
    const r = await api('save', {patch});
    const lompat = driveKnownVersion!=null && r.version > driveKnownVersion + 1;  // ada simpanan orang lain di antaranya
    lastSyncedSnapshot = dasarBaru;
    driveKnownVersion = r.version;
    updateStatusUI(true);
    if((r.ditolak && r.ditolak.length) || lompat){
      if(r.ditolak && r.ditolak.length && currentUser) toast('Sebagian perubahan tidak disimpan karena di luar hak akses Anda');
      await mergeFromRemote();
      if(!kerjaAktif()) { renderTabs(); renderContent(); }
    }
  }catch(e){
    if(e.code!=='AUTH') driveError('Gagal menyimpan data', e);
  }
  saveBusy = false;
  if(saveQueued){ saveQueued = false; saveToDrive(false); }
}
// Ganti satu catatan di db sekaligus di dasar sinkron (dipakai setelah aksi khusus server)
function setTersinkron(coll, rec){
  [db, lastSyncedSnapshot].forEach(o=>{
    if(!o) return;
    o[coll] = o[coll] || [];
    const i = o[coll].findIndex(x=>x.id===rec.id), c = JSON.parse(JSON.stringify(rec));
    if(i>=0) o[coll][i] = c; else o[coll].push(c);
  });
}

// Tandai saat jendela pilih file terbuka, supaya halaman tidak digambar ulang di tengah proses
document.addEventListener('click', e=>{ if(e.target.closest && e.target.closest('input[type=file], label')?.querySelector?.('input[type=file]') || (e.target.type==='file')) window._pilihFile = Date.now(); }, true);
document.addEventListener('change', e=>{ if(e.target && e.target.type==='file') window._pilihFile = 0; }, true);
document.addEventListener('cancel', e=>{ if(e.target && e.target.type==='file') window._pilihFile = 0; }, true);
/* ======================= INIT ======================= */
renderTabs();
renderContent();
connectDrive();
